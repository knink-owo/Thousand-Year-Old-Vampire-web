行为`},{type:`degradeResource`}]}]},{number:3,entries:[{text:`一位亲人发现了你的状况，并努力帮助你。创建一个代表他们帮助的资源。如果没有可用的凡人角色，请创造一个。`,effects:[{type:`gainResource`},{type:`createMortal`}]},{text:`你操纵这个凡人为你犯下可怕的罪行。当他们畏惧这些可怕任务时，你会怎么做？获得技能人类是工具。`,effects:[{type:`gainSkillNamed`,skill:`人类是工具`}]},{text:`在凡人的生命结束时，你将他们转化成了无意识的肉体机器，一个由你供养的不死物件。你对此有什么遗憾？把角色改为资源。勾选一个技能。`,effects:[{type:`characterToResource`},{type:`checkSkill`}]}]},{number:4,entries:[{text:`你暴露了，逃向邻近地区。失去所有固定资源。勾选一项技能。有一个凡人和你一起逃跑。在这些陌生人中，你取什么新名字？`,effects:[{type:`checkSkill`},{type:`loseAllFixedResources`}]},{text:`你被吸收进了一个奇怪的密教，他们不顾（或因为）你的外来者身份接纳了你。勾选一项技能并创建一项资源：秘密阴谋集团。他们是怎么找到你的？你经历了什么邪恶的入会仪式？他们知道你的真实身份吗？`,effects:[{type:`checkSkill`},{type:`gainResourceNamed`,resource:`秘密阴谋集团`}]},{text:`在你不知情的情况下，秘密阴谋集团进行了一次黑暗仪式，将一个凡人角色变成可怕、非人且不朽的存在。将一个凡人角色转换为敌对的不朽者。这个新的不朽者追求哪些异类目标？该阴谋集团是否曾操纵你参与这种创造活动？这如何改变你与该组织的关系？`,effects:[{type:`mortalToHostileImmortal`}]}]},{number:5,entries:[{text:`你杀死了一个你所爱或尊敬的人，而不是让他们揭露你。杀死一个角色。勾选一项技能。如果没有活着的角色，就不要杀任何人，而是创造一个被你背叛的心爱的凡人角色。`,effects:[{type:`checkSkill`},{type:`killCharacter`},{type:`createMortal`}]},{text:`一个被你伤害过的角色在梦中来到你面前。他们是诅咒还是原谅你？得到一个印记。`,effects:[{type:`gainMark`}]},{text:`隐藏在你灵魂中的爱促使你踏上愚蠢的赎罪之旅，以弥补巨大的负罪感。你尝试纠正什么错误？这如何失败并导致一切变得更糟？失去一项资源。勾选一项技能。`,effects:[{type:`checkSkill`},{type:`loseResource`}]}]},{number:6,entries:[{text:`一个凡人角色开始为你服务。他是谁？他为什么被你吸引？创造一个新的凡人角色。`,effects:[{type:`createMortal`}]},{text:`一个信任的凡人角色以令人惊讶的方式背叛了你。失去一项资源。他们为什么这样做？你为什么原谅他们？`,effects:[{type:`loseResource`}]},{text:`一个凡人角色为了拯救你而牺牲自己。勾选一项技能。获得与爱或信任相关的技能。`,effects:[{type:`checkSkill`},{type:`gainSkill`}]}]},{number:7,entries:[{text:`你的身体展现出创造你的吸血鬼相关特征。你如何变得更像他们？创建一个反映这一点的技能。`,effects:[{type:`gainSkill`}]},{text:`人们在你身上看到你无法感知的恐怖。你拥有什么你自己不知道的印记？创建一个印记和一个见过它的可疑凡人。在你背后，人们用什么来称呼你？`,effects:[{type:`gainMark`},{type:`createMortal`}]},{text:`通过与铁与火的不懈努力，你去除了一枚印记。记录一次痛苦和流血的经历。你责怪谁？你可以移除一项印记或用更糟糕的一项替换现有的印记。`,effects:[{type:`loseMark`}]}]},{number:8,entries:[{text:`另一个像你一样的生物认出了你是吸血鬼。创造一个不朽者角色，失去一项资源并获得一项技能。你对他们失去了什么？`,effects:[{type:`gainSkill`},{type:`loseResource`},{type:`createImmortal`}]},{text:`你对于一个不朽者角色取得了优势。从他们那里得到了什么？学到了什么？将一段记忆转化为技能：划掉该记忆。获得一项神秘学资源。`,effects:[{type:`memoryToSkill`},{type:`gainResource`}]},{text:`被你激怒的角色拥有强大的盟友。创造一个新的敌对不朽者角色，他是困扰你的这个神秘团体的代表。勾选一个技能以逃脱他们的掌控。获得技能该离开了。移居至遥远地区并失去任何固定资源。取个新名字。`,effects:[{type:`gainSkillNamed`,skill:`该离开了`},{type:`checkSkill`},{type:`loseAllFixedResources`},{type:`createImmortalHostile`}]}]},{number:9,entries:[{text:`你开发了一个系统来喂养你自己。这是什么？那些去世的人会怎样？创造一个反映这一情况的技能。`,effects:[{type:`gainSkill`}]},{text:`你不仅饮用他们的血液，还从你的受害者那里获利！你如何安排这一切？为了保护这个系统，你犯下了什么暴行？勾选一项技能，创建一项资源。`,effects:[{type:`checkSkill`},{type:`gainResource`}]},{text:`另一个角色篡夺并改进了你的喂养系统。你是否爬回到逐出者面前，乞求重新加入？如果是这样，那么获得技能匍匐在地。如果你选择重新从头建立新的喂养系统，则勾选两项技能并获得一项资源。`,effects:[{type:`gainSkillNamed`,skill:`匍匐在地`},{type:`checkSkill2`},{type:`gainResource`}]}]},{number:10,entries:[{text:`夜空中的星辰在你头顶旋转。四季如梭。你如同一个自动装置，对数十年的流逝毫无知觉。一个世纪过去了。划掉一个记忆，划掉所有凡人角色。`,effects:[{type:`loseMemory`},{type:`killAllMortals`}]},{text:`一件强大的神器，无论是宗教、魔法或技术的，都落入你的手中。有了它，你可以重塑世界。这是什么东西？谁在寻找它？创造一个凡人角色，将此物品添加为资源。如果在达成任何游戏结局结果时依然拥有它，你可以随意改写结局。如果与不朽角色的遭遇中失去了一项资源，必须首先失去这件物品。`,effects:[{type:`note`,text:`神器规则：在资源面板把此物标记为「神器」。此后与不朽者遭遇失去资源时，必须首先失去这件物品；若达成结局时仍持有它，可以改写结局。`},{type:`createMortal`},{type:`gainResource`}]},{text:`在摆弄这件神器时，你不小心引发了末日到来。恶魔崛起，天使坠落，灵魂显现。人类的人口被征用于一场将持续几个世纪并决定宇宙命运的战争之中。在适合你故事至今进展的情境下创建一个代表超自然冲突显现的角色或资源。创建两个不朽者角色，他们分别站在冲突的两边，现在对你的吸血鬼感兴趣。`,effects:[{type:`createImmortal`},{type:`createImmortal`},{type:`createCharacter`},{type:`gainResource`}]}]},{number:11,entries:[{text:`你如何从内心的强烈饥饿中找到慰藉？你可能会失去一项已勾选或未勾选的技能。`,effects:[{type:`loseSkill`}]},{text:`你发现了一种内在的专注力，让你能够控制自己的吸血鬼本性。失去一段暴力的记忆，获得技能“我控制那野兽”，并将任何未勾选的技能重写为新技能。你会取什么新名字来与过去的自己保持距离？这个名字有什么象征意义？`,effects:[{type:`loseMemory`},{type:`gainSkillNamed`,skill:`“我控制那野兽”`},{type:`rewriteSkill`}]},{text:`你的控制崩溃了。你吞食、杀戮、沉迷于鲜血。你就是饥渴本身。当你享用你最亲密的友好角色（凡人或不朽者）时，他们的临终遗言是什么？将一段被爱的记忆改为一段谎言，其中你为了保护自己而杀戮。创造一项技能，以嘲讽的方式提到一个死去角色的名字。`,effects:[{type:`editMemory`},{type:`gainSkill`}]}]},{number:12,entries:[{text:`新的法律或社会习俗让你更难隐藏在人群中。你是如何差点被抓获并被消灭的？勾选一项技能。创建一项技能。创建一个协助你的凡人罪犯。`,effects:[{type:`checkSkill`},{type:`gainSkill`},{type:`createMortal`}]},{text:`通过横跨多代人的努力，你可以改变社会法律使之对你有利。你如何让领导者屈服于你的意愿？你会改变什么？创建一项资源。`,effects:[{type:`gainResource`}]},{text:`一个凡人门徒超越了你。他比你更聪明、更残忍、更有能力。他把你关在地牢里——他们用你做什么？创造一个邪恶的凡人角色。`,effects:[{type:`createMortal`}]}]},{number:13,entries:[{text:`同一家族的几代人为你服务。这条血脉从任何活着的凡人角色开始，或从死去凡人角色的后代开始。他们为自己的服务制定了哪些奇怪的仪式？失去一项资源并创建一个仆从家族资源。`,effects:[{type:`loseResource`},{type:`gainResource`}]},{text:`你的仆人数量众多，热情高涨，但有时却毫无用处。根据记忆创建一项技能，这是你用来控制他们的技能。`,effects:[{type:`gainSkill`}]},{text:`你的仆人给你带来了一个你不想要的礼物。创建一个有问题的资源。`,effects:[{type:`gainResource`}]}]},{number:14,entries:[{text:`敌方角色利用一项失去的资源让你的几个朋友背叛你。勾选三项技能来重新获得资源，或者勾选一项技能勉强活下来。你杀了哪位前朋友？你逃到哪里去？`,effects:[{type:`checkSkill3`},{type:`checkSkill`}]},{text:`你出生的时代和地点与你现在所处的时代和地点截然不同。为了在这个陌生的世界中生存，你必须放弃哪些价值观？根据你最近的记忆创建一个合适的当代技能。你最近使用什么新名字？`,effects:[{type:`gainSkill`}]},{text:`你如何才能在这个地方取得领导地位？你通过战争和暴力征服了哪些邻居或民众？获得你从一个只想要和平的人那里夺走的资源。`,effects:[{type:`gainResource`}]}]},{number:15,entries:[{text:`在旅途中，你与另一个不朽者发生冲突。获得一项印记。对方是谁？你对他使了什么花招？创建一个新的不朽角色。`,effects:[{type:`gainMark`},{type:`createImmortal`}]},{text:`不朽者比他们表面上看起来的要强大得多。勾选一项技能，或者会失去一项资源或一段记忆。获得一项资源或技能。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`loseMemory`},{type:`gainResource`},{type:`gainSkill`}]},{text:`人类社会如何因受到像你这样的不朽者的干预而发生巨大变化？谁从中受益？你失去了什么资源？获得一项资源、技能或印记。`,effects:[{type:`loseResource`},{type:`gainResource`},{type:`gainSkill`},{type:`gainMark`}]}]},{number:16,entries:[{text:`一些凡人联合起来追捕你，他们装备精良，并且了解你的花招。你该如何击败或躲避他们？创建一个与你勾选的技能之一相关的凡人猎人。勾选一项技能。`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`猎人们执着、能干、见多识广。他们知道你不知道的事情——创造一个在对抗中显露的印记。你被迫躲藏在一片无人居住的荒地中。失去所有固定资源。学习与这片荒凉地区相关的新技能。孤独中你会想到什么新名字？`,effects:[{type:`loseAllFixedResources`},{type:`gainMark`},{type:`gainSkill`}]},{text:`重返文明世界后，你对猎人们的可怜后代进行了可怕的报复。他们的痛苦将被传唱千年。历史学家将其视为邪恶的标杆。创建一个凡人角色，他原本无辜而善良，直到你向他们索取代价。不要实际写下你对这些人的所作所为。`,effects:[{type:`createMortal`}]}]},{number:17,entries:[{text:`你犯下了卑鄙的谋杀罪，但不是为了满足食欲。为什么？勾选一项技能。如果你愿意，可以删除一个凡人角色。`,effects:[{type:`checkSkill`},{type:`deleteCharacter`}]},{text:`你因犯罪而被追捕。勾选一项技能，失去一项资源。向任何角色坦白你的罪行。将敌人变成朋友或将朋友变成敌人。如果你必须创建一个角色，你们成为恋人。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`createCharacter`},{type:`changeAllegiance`}]},{text:`你与一个心爱的角色决斗，如果没有，就创建一个。勾选一个暴力技能或适当的资源，通过杀死他们来获胜，或者获得一个印记并逃往他乡。`,effects:[{type:`checkSkill`},{type:`killCharacter`},{type:`gainMark`}]}]},{number:18,entries:[{text:`你在一个地方吃得太久了，摧毁了一个社区或社会群体。他们是谁？最后一个社区成员是怎么死的？获得一项拾荒得来的资源，失去一项资源。`,effects:[{type:`loseResource`},{type:`gainResource`}]},{text:`一个社区弃儿幸存下来，并发誓要对你进行报复。你是怎么认识他们的？他们怎么知道在你最脆弱的时候抓住你？创建一个一心想毁灭你的凡人角色。`,effects:[{type:`createMortal`}]},{text:`你被赶出了这片土地。失去所有固定资源。勾选一项技能以逃脱，两项技能以消灭迫害者，三项技能以弥补过失。`,effects:[{type:`checkSkill`},{type:`checkSkill2`},{type:`checkSkill3`},{type:`loseAllFixedResources`}]}]},{number:19,entries:[{text:`两个友好角色卷入了一场内讧。参与其中并勾选一项技能。如果需要，可创建最多两个角色。你如何从中获利？获得一项资源。`,effects:[{type:`checkSkill`},{type:`gainResource`},{type:`createCharacter`}]},{text:`当你的朋友互相争斗时，你却在暗中谋划。操纵冲突来摧毁任意角色。`,effects:[{type:`killCharacter`}]},{text:`战斗太多，流血太多。你扮演和事佬的角色，试图结束昔日好友之间的冲突，但他们却背叛了你。失去一项资源。获得一项印记。`,effects:[{type:`loseResource`},{type:`gainMark`}]}]},{number:20,entries:[{text:`社会运输货物的方式发生了巨大变化。这对你有什么好处？勾选一项技能。根据记忆创建一项技能。`,effects:[{type:`gainSkill`},{type:`checkSkill`}]},{text:`你的吸血鬼状态使你能够操纵多代人，利用他们为自己谋利。创建一个固定的资源和一个象征财富和权力的奢华资源。`,effects:[{type:`gainFixedResource`},{type:`gainResource`}]},{text:`靠投资和租金生活会让你变得懒惰，削弱了你的狩猎优势。勾选一项残忍或贪婪的技能，失去一项与创造力或努力相关的已勾选技能。获得一项你并非真正挣来的固定资源。`,effects:[{type:`checkSkill`},{type:`loseSkill`},{type:`gainFixedResource`}]}]},{number:21,entries:[{text:`当太阳升起时，你被困在外面，躲在一个你未曾预料的地方。一个孩子发现了你并与你成为朋友。创建一个凡人儿童角色并记录一次人性化的经历。`,effects:[{type:`createMortal`}]},{text:`孩子会教你重新欣赏这个世界。你看到生活中的美好。基于愉快的记忆创造一项技能。`,effects:[{type:`gainSkill`}]},{text:`几十年过去了。孩子已经因年老而死。你站在他们的坟墓旁。你还能做些什么来让他们的生活变得更好？你是如何背叛他们的？庄重地划掉这个角色。`,effects:[{type:`dieByAge`}]}]},{number:22,entries:[{text:`创造一个凡人角色。你从婴儿时期就把他们塑造成你想要的样子。失去一项资源。`,effects:[{type:`loseResource`},{type:`createMortal`}]},{text:`你的日记丢失或被盗。丢失日记及其包含的所有记忆。如果你没有日记，则丢失一项资源。创建一个被你错误地将此损失归咎于他的角色。`,effects:[{type:`note`,text:`若拥有日记：日记丢失，其中包含的记忆全部划掉（若无日记则失去一项资源）`},{type:`loseResource`},{type:`createCharacter`}]},{text:`你成为一个沉浸在当下的孤独者，操纵着一百根线以求温饱和安全。永久失去一个记忆槽。获得技能野性狡诈。`,effects:[{type:`loseMemorySlot`},{type:`gainSkillNamed`,skill:`野性狡诈`}]}]},{number:23,entries:[{text:`你掌握了一门奇怪的新科学或知识领域。你的吸血鬼本性如何让你对这些研究有特别的见解？根据记忆创建适当的技能。`,effects:[{type:`gainSkill`}]},{text:`你开始了长期的通信联系并坠入爱河。创建一个凡人角色。通过放弃一项资源来接近他们，或者扼杀爱情并失去一段记忆。`,effects:[{type:`createMortal`},{type:`loseResource`},{type:`loseMemory`}]},{text:`除非你勾选一项技能，否则你的凡人爱人会因另一个角色的阴谋而死亡。如果你确实拯救了他，他会改为死于疾病、事故或年老。无论哪种方式，你都会保留一个印记来记住他们。创建一项资源。`,effects:[{type:`checkSkill`},{type:`gainResource`}]}]},{number:24,entries:[{text:`你被迫习惯一个新名字。为什么？`,effects:[]},{text:`删除任意两段记忆的第一句话。你不太确定为什么。不要为此创建一个经历。`,effects:[{type:`removeMemorySentence`}]},{text:`所有地方对你来说都一个样，你不再回家了。失去一项固定资源。你在哪里漂泊？`,effects:[{type:`loseFixedResource`}]}]},{number:25,entries:[{text:`你猎取受害者的方法不再有效。发生了什么变化？失去一项资源并创建一项描述你的新猎食技巧的技能。`,effects:[{type:`loseResource`},{type:`gainSkill`}]},{text:`要利用这种方法，需要付出哪些体力劳动？创造一个简单实用的技能，并划掉一段记忆。`,effects:[{type:`gainSkill`},{type:`loseMemory`}]},{text:`一个凡人角色发现了你的觅食系统。他们会用什么令人信服的理由让你放弃它？勾选一项技能。`,effects:[{type:`checkSkill`}]}]},{number:26,entries:[{text:`你因为吸血不当而意外创造了一个吸血鬼。从现有的凡人角色中创造一个不朽者角色。你为什么不消灭他？勾选一项技能。`,effects:[{type:`checkSkill`},{type:`createImmortal`},{type:`mortalToImmortal`}]},{text:`这个不朽者角色潜伏在你生活的边缘。他们成为你最不受欢迎的一项已勾选技能的化身。当你们相遇时，他们会如何行动？他们会给你什么令人不安的礼物？创建一项资源。`,effects:[{type:`gainResource`}]},{text:`这个不朽者角色落入了凡人的手中，间接危及你的生存。通过勾选三个技能来拯救他。如果不拯救他，你将失去三项资源。如果你无法失去所有三项资源，那就尽可能多地失去它们，然后逃到一个新的地方——从现在起，所有人类都知道吸血鬼是真实存在的。`,effects:[{type:`loseResource3`},{type:`checkSkill3`}]}]},{number:27,entries:[{text:`你所居住的地区战火纷飞。你躲进一个隐蔽的避难所，等待战火过去。失去一项资源。`,effects:[{type:`loseResource`}]},{text:`你隐秘的行事方式导致你被当作间谍逮捕。勾选一项技能以逃脱或失去一项资源并从对你进行的实验中获得一项印记。不管怎样，创造一个领导组织的凡人，该组织资金充足并对像你这样的生物构成威胁。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`gainMark`}]},{text:`你成为了一名间谍，出卖你曾称之为家园的土地。获得两项资源。勾选一项技能，获得一项技能，取消勾选一项古老而令人惊讶的技能。哪个角色因你的行为而受苦并死亡？`,effects:[{type:`gainTwoResources`},{type:`checkSkill`},{type:`gainSkill`},{type:`uncheckSkill`}]}]},{number:28,entries:[{text:`一个死去已久的凡人角色归来。他们想从你这里得到什么？他们是如何逃过死亡的？只有当你仍然拥有相关记忆时才能认出他们。勾选一项技能。`,effects:[{type:`checkSkill`}]},{text:`他们会给你带来什么危险？创建一个新的敌人角色，可以是凡人或不朽者。勾选一项技能或失去一项资源。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`createCharacter`}]},{text:`你不断被强大的超自然生物追捕。描述你为避免被发现而开发的方法。失去一段记忆以获得一项技能或资源，或者不失去记忆并创造一个凡人仆从。`,effects:[{type:`loseMemory`},{type:`gainSkill`},{type:`gainResource`},{type:`createMortal`}]}]},{number:29,entries:[{text:`你被揭露为怪物并逃往遥远的土地。失去所有固定资源。你不懂这个新地方的语言——你如何克服这个障碍？你取了什么新名字？`,effects:[{type:`loseAllFixedResources`}]},{text:`你用一个全新的身份伪装自己。选择一个旧记忆并对其进行修改，使其变得现代而平淡。创建基于这一混合的技能。`,effects:[{type:`editMemory`},{type:`gainSkill`}]},{text:`你迷失在假装的个性中。失去你最古老和最新的记忆。扔掉你的日记。创造一项与新生活相关的技能和资源。`,effects:[{type:`loseTwoMemories`},{type:`destroyResource`},{type:`gainSkill`},{type:`gainResource`}]}]},{number:30,entries:[{text:`你忘记了哪些社会习俗？失去一项已勾选的技能。`,effects:[{type:`loseCheckedSkill`}]},{text:`你感受到一种被周围凡人的传统所禁止的爱。创建一个新角色。失去一项资源。`,effects:[{type:`createCharacter`},{type:`loseResource`}]},{text:`你将重塑自我以及与世界的关系。取消勾选一项技能。`,effects:[{type:`uncheckSkill`}]}]},{number:31,entries:[{text:`你陷入了长达一百年的沉睡。划掉所有凡人角色。`,effects:[{type:`killAllMortals`}]},{text:`你认出了你记忆中出现的某个已故凡人的后代，并感到有必要与他们结识。你如何在不暴露自己怪物本性的情况下分享有关他们祖先的知识？这次谈话为何尴尬？这次谈话有多尴尬？获得一个当代且意想不到的技能。创建一个凡人角色，一个新朋友。`,effects:[{type:`createMortal`},{type:`gainSkill`}]},{text:`你的凡人朋友发现了家族文件，揭露了你的真面目。你们的关系会如何变化？你可以恢复与凡人祖先有关的被遗忘的记忆。`,effects:[{type:`restoreMemory`}]}]},{number:32,entries:[{text:`你关押了一名囚犯。为什么是这个人？你为什么不吃掉他？创建一个与关押该囚犯有关的角色和技能。`,effects:[{type:`createCharacter`},{type:`gainSkill`}]},{text:`凡人救出了你的囚犯。创建两个凡人救援者。失去一项资源。`,effects:[{type:`createMortal`},{type:`createMortal`},{type:`loseResource`}]},{text:`你的囚犯回到了你身边，但有他们自己的条件。这种奇怪的新关系是什么样的？`,effects:[]}]},{number:33,entries:[{text:`你知道旧东西在哪里。创建一项资源并将一个敌人角色变成朋友。`,effects:[{type:`gainResource`},{type:`changeAllegiance`}]},{text:`你出版一本书或以其他方式巩固一段记忆（无论是当前的还是来自你的日记的），这样它就永远不会丢失。在记忆旁边画一个星号来表示这一点，并更改记忆以使其稍微不那么有趣。此记忆永远无法再更改或删除。它也不再占用记忆槽。`,effects:[{type:`stabilizeMemory`}]},{text:`凡人世界发生了大规模的权力转移——政府垮台，战争爆发，新秩序建立。谁从中受益？勾选一项技能。犯下暴行以获得与控制无辜人民相关的资源。获得一项技能并加入胜利方或勾选两项技能。`,effects:[{type:`checkSkill`},{type:`checkSkill2`},{type:`gainSkill`},{type:`gainResource`}]}]},{number:34,entries:[{text:`你在毫无意义的愤怒中摧毁了对你来说很重要的东西。失去一段珍贵的记忆或摧毁一项资源。`,effects:[{type:`loseMemory`},{type:`destroyResource`}]},{text:`你的狂怒甚至让你自己感到恐惧。你是学会控制它，还是选择拥抱这种恐怖？如果有一个凡人角色，就杀死他，如果没有，则创建一项印记。`,effects:[{type:`killCharacter`},{type:`gainMark`}]},{text:`你撕掉脸上的每一块皮肤，试图抹去残留的人性。创建一项印记。今后你该如何掩盖自己的毁容？`,effects:[{type:`gainMark`}]}]},{number:35,entries:[{text:`你遇到了一个宿敌的后代，并以某种方式帮助他们。你为什么要这么做？勾选一项技能。创建一个凡人角色。`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`为了报答你的恩情，他们会猛烈攻击那些他们认为是你的敌人的人。一个角色被杀死了。`,effects:[{type:`killCharacter`}]},{text:`这个凡人正处于极度危险之中。勾选一项技能或损失一项资源来拯救他，否则他会死得很惨。`,effects:[{type:`checkSkill`},{type:`loseResource`}]}]},{number:36,entries:[{text:`你的谎言甚至会骗过你自己。结合任意三个特征来编造出一段你信以为真的经历。`,effects:[]},{text:`因为这段虚假的记忆而惩罚某人。你杀死或致残一个角色。勾选一项技能。获得技能我知道什么是真的。`,effects:[{type:`gainSkillNamed`,skill:`我知道什么是真的`},{type:`checkSkill`},{type:`killCharacter`}]},{text:`你的一段真实记忆原来是完全虚构的，如同由蛛网编织的狂热梦境。彻底抹去一段记忆。`,effects:[{type:`loseMemory`}]}]},{number:37,entries:[{text:`万物化为尘土。失去一个你没有相应记忆的资源。不要为这个提示创建新的经历，它只是在你沉默凝视时发生。`,effects:[{type:`loseResource`}]},{text:`你有一种来源不明的习惯。失去一项你没有相应记忆的未勾选技能。`,effects:[{type:`loseSkill`}]},{text:`你思想僵化，沉溺于已有习惯。你差点被一个多年来一直在研究你的行为模式的敌人抓住。破坏一项资源并将其重塑为新的令人惊讶的东西。`,effects:[{type:`destroyResource`},{type:`gainResource`}]}]},{number:38,entries:[{text:`你的整个身心都集中在你的感官和饥渴上。创建一项展现你野性吸血鬼本性的技能，并失去一段现有的记忆。`,effects:[{type:`gainSkill`},{type:`loseMemory`}]},{text:`你的动作与人类不同，他们会无意识地察觉到这一点。创建一项印记。`,effects:[{type:`gainMark`}]},{text:`你总能找到脆弱、无力、易受伤害的人。使用技能淘汰弱者。不要直视强者的眼睛——他们不适合你。`,effects:[]}]},{number:39,entries:[{text:`岁月侵蚀了你的日记。从日记中最早的记忆开始，划掉三个名词。如果你没有日记，就对中年时期记忆中的前三个名词进行同样的操作。`,effects:[]},{text:`你为破旧的日记制作了一份新副本。在最近的日记记忆中，将两个动词互换。如果你没有日记，就在你最新的记忆中划掉三个动词。`,effects:[]},{text:`查找之前用来玩该游戏的角色记录。将一段记忆与该角色表中的一段记忆交换。`,effects:[]}]},{number:40,entries:[{text:`你如何在沉睡时隐藏自己？你采取了哪些保护措施？勾选一项技能并创建一项资源。如果愿意，可以创建一个凡人仆人角色。`,effects:[{type:`checkSkill`},{type:`gainResource`},{type:`createMortal`}]},{text:`一位你不认识的超自然人物向你走来。他们带你踏上一段奇异的旅程，然后以精神慰藉作为交换，要求你做出一个可怕的承诺。他们要求什么？你会接受吗？如果你接受，获得一项技能。`,effects:[{type:`gainSkill`}]},{text:`那些存在于视线之外的强大生物已被揭示于你，从此一切都将不同。让这个奇异的世界深刻影响你游戏的其余部分。获得技能观察入微。`,effects:[{type:`gainSkillNamed`,skill:`观察入微`}]}]},{number:41,entries:[{text:`你的身体远离人类的关注。失去一个记忆槽。抹去你现存最早的名字。`,effects:[{type:`loseMemorySlot`}]},{text:`一些早已被遗忘的社会习俗或禁忌深深地刻在你的心中。那是什么？它如何阻碍你在社会中的行动？创建一项印记。`,effects:[{type:`gainMark`}]},{text:`一个幽灵缠绕着你，尽管你不知道它是真实的还是疯狂的表现。将一个早已死去的角色作为幽灵带回来。`,effects:[{type:`returnGhost`}]}]},{number:42,entries:[{text:`由于你的吸血鬼本性，你无法与哪种现代技术互动？你在第一次接触这种技术时几乎被摧毁的经历是怎样的？勾选一项技能。`,effects:[{type:`checkSkill`}]},{text:`你结识了一群对你拥有的某种资源感兴趣的凡人。这是一个俱乐部吗？他们是朋友吗？创建三个凡人角色。发展出一项与对应资源相关的技能。`,effects:[{type:`createMortal`},{type:`createMortal`},{type:`createMortal`},{type:`gainSkill`}]},{text:`几十年过去了。你依然永葆青春，而你的朋友们却慢慢枯萎：你必须离开，否则会被发现是怪物。站在外面的黑暗中，看着他们一边笑一边讲述他们多么想念你的故事。`,effects:[]}]},{number:43,entries:[{text:`尽管你努力融入，但你的作风却很古板。根据已勾选的技能创建一项资源来反映这一点。`,effects:[{type:`gainResource`}]},{text:`在两个记忆之间交换专有名词。不要为此创建经历。`,effects:[{type:`swapProperNouns`}]},{text:`检查你拥有的一项资源会引发一段被遗忘的记忆。那个资源曾属于另一个角色，但你已经忘记了这一点。通过回忆起这段记忆来深入了解你自己的历史。将这段被遗忘的经历写入你的记忆或直接写入日记。注意，你是在创建一个新的“被遗忘”的经历，而不是恢复一段已被删除的记忆。`,effects:[{type:`resourceToMemory`}]}]},{number:44,entries:[{text:`你曾经遇到过的一位不朽者角色回来索债。是什么债？他们有什么变化？你愿意还债吗？如果你有和这个角色有关的记忆，你会失去两项资源，如果没有，则失去三项资源并勾选一项技能。`,effects:[{type:`note`,text:`条件分支：若你拥有与这位不朽者相关的记忆 → 失去两项资源；否则 → 失去三项资源并勾选一项技能。`},{type:`checkSkill`},{type:`loseResource3`},{type:`loseResource2`}]},{text:`他们做了什么让你陷入最深沉的绝望？抹去你最早的记忆。你永远无法找回它。获得一项技能。`,effects:[{type:`loseMemory`},{type:`gainSkill`}]},{text:`你制定计划并以无情的效率执行，给这个不朽者角色带来死亡和毁灭。你可以收回他们拿走的资源，也可以摧毁它们。勾选一项技能。`,effects:[{type:`checkSkill`}]}]},{number:45,entries:[{text:`你的身体正在经历进一步的腐化和变化。你什么时候第一次注意到这些新的变化？创建一项印记。`,effects:[{type:`gainMark`}]},{text:`你的身体变得越来越不像人类，但同时也变得更加高效。根据你的一项印记创建一项技能。`,effects:[{type:`gainSkill`}]},{text:`你在一个某种程度上被社会排斥的凡人群体中找到了陪伴。他们知道你是吸血鬼吗？他们会在意吗？创建两个友好的凡人角色，每个角色都与一个你的印记有关。`,effects:[{type:`createMortal`},{type:`createMortal`}]}]},{number:46,entries:[{text:`你暴露了，逃往遥远的土地。将任何固定资源转换为代表便携现金或财宝的新资源。你以什么名字旅行？当你停下来时，你声称自己从事什么职业？`,effects:[{type:`convertFixedResources`}]},{text:`你再次逃亡，这次是逃往遥远的飞地或殖民地。你如何利用殖民统治为自己谋利？获得一项技能：占领者、叛乱者、不显眼的人或土著，并选择一个合适的新名字。`,effects:[{type:`gainSkill`}]},{text:`革命！作为一名可疑的外来者，你被监禁了。通过勾选两项技能以逃脱，或用两项资源贿赂以逃脱。花费额外的资源来拯救任何旅行同伴。`,effects:[{type:`checkSkill2`},{type:`loseResource2`},{type:`loseResource`}]}]},{number:47,entries:[{text:`世界以你无法理解的方式发展，导致你损失了大量财富。发生了什么？勾选一项技能。创建一项技能，希望能以此防止这种情况再次发生。失去一项资源。`,effects:[{type:`gainSkill`},{type:`checkSkill`},{type:`loseResource`}]},{text:`你负责照顾无助的人。创造一项技能来帮助你利用他们。从一段快乐的记忆中衍生出来。`,effects:[{type:`gainSkill`}]},{text:`你对其中一名受害者的斗志印象深刻。他们做了什么？他们如何让你想起你最早的记忆？他们活下来了吗？创建一个凡人角色。`,effects:[{type:`createMortal`}]}]},{number:48,entries:[{text:`你满身尘土的醒来。几代人过去了。你的沉眠之地已被封锁。你该如何逃脱？失去一项资源。划掉所有凡人角色。`,effects:[{type:`loseResource`},{type:`killAllMortals`}]},{text:`你以为已经死去的凡人不知为何却依然活着。太神奇了！带回一个最近被划掉的凡人角色。`,effects:[{type:`reviveCharacter`}]},{text:`在漫长的梦境中，你发现了一条通往现实之外的土地的道路，那是一个充满巨大恐惧和绝美风景的奇幻之地。你可以抛弃这个地球，去往无人能及的地方：留下所有角色、印记和资源，除了一把银剑，然后返回提示10。从那里继续前进，成为梦境中一个没有印记的吸血鬼。如果你第二次抵达该提示，你就会醒来，并且永远无法返回。如果你不前往这个梦境之地，你可以获得资源：一本奇幻梦境的手写书。`,effects:[{type:`dreamWorld`},{type:`gainResourceNamed`,resource:`一本奇幻梦境的手写书`}]}]},{number:49,entries:[{text:`什么简单而实用的技能对你奇特的生活非常有用？你是如何学会它的？创建一项技能。`,effects:[{type:`gainSkill`}]},{text:`你是如何成为一名普通劳动者的？哪一项之前勾选过的技能让他们接受了你？那个充满友情的夜晚是什么样的？创建一个凡人角色。勾选一项技能。`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`你的新朋友将成为你食物的来源。创建一项反映这一点的资源。`,effects:[{type:`gainResource`}]}]},{number:50,entries:[{text:`你被困在一个为掠夺成性的凡人（predatory mortals）设下的陷阱中。你被当成哪种罪犯了？这次经历如何帮助你学会更好地捕食凡人？创建一项让美好记忆变质的新技能。`,effects:[{type:`gainSkill`}]},{text:`你几乎已经暴露，必须彻底改变你的猎食模式。成为社会最低阶层的一员并失去一项资源。如果你已经是最低层人民，请改为成为最高阶层的一员并勾选一项技能。`,effects:[{type:`checkSkill`},{type:`loseResource`}]},{text:`你与掠夺成性的凡人交往。创造一个令人厌恶的凡人角色成为你的同伙。连你也害怕他。为什么？`,effects:[{type:`createMortal`}]}]},{number:51,entries:[{text:`当你过于饥饿时，你会变成一个没有智慧的猎食生物。从你的记忆列表中间的记忆里随机失去一段经历。`,effects:[{type:`loseMemoryRandom`}]},{text:`你在某种非人类的事物中找到了陪伴。是动物，还是某种无生命的东西？你如何与它互动？你是如何找到它的，还是它找到了你？创建一个角色或资源来代表这个伙伴。`,effects:[{type:`createCharacter`},{type:`gainResource`}]},{text:`万物皆有终结，但显然这人没有。一个你深爱的凡人角色永不衰老。这是魔法吗？还是某种感染？他们仍然算作凡人角色，但他们永远不会因年老而死`,effects:[{type:`note`,text:`该凡人角色永不因年老而死（仍算作凡人角色）`}]}]},{number:52,entries:[{text:`黎明之美在召唤你。创建一个专注于美丽、自然或和平的额外记忆槽。`,effects:[{type:`gainMemorySlot`}]},{text:`你停留得足够久，听到了晨鸟歌声的结束。你被太阳灼伤了——创建一项印记。`,effects:[{type:`gainMark`}]},{text:`伸展双臂，感受温暖。光线穿过你的眼睑，而你没有被火焰吞噬。阳光（或其他环境条件）不再伤害你。创建一项关于自由的技能。`,effects:[{type:`gainSkill`}]}]},{number:53,entries:[{text:`你信任的凡人角色，或他们的后代之一，领导着一支猎人小队。他们用哪些你分享的秘密来对付你？勾选一项技能。`,effects:[{type:`checkSkill`}]},{text:`你已经可以任意处置那个制造麻烦的角色了。记录一次宽恕的经历。`,effects:[]},{text:`他们再次背叛你并逃跑。失去一项资源或获得一项印记毁容。`,effects:[{type:`loseResource`},{type:`gainMark`}]}]},{number:54,entries:[{text:`你奇怪的口音和老套的作风总是让你显得格格不入，最好的情况下是被嘲笑和欺骗，最坏的情况下是被憎恨。通过将一段旧记忆转化为一项新技能来掩盖这些无用的特征，以便融入其中。`,effects:[{type:`memoryToSkill`}]},{text:`你的旧记忆正在改变，以反映你在当下需要的态度。改变一段记忆以融入不合时宜的现代元素。不要为此创建新的经历。`,effects:[{type:`editMemory`}]},{text:`丢弃一个已有一百多年历史的资源。`,effects:[{type:`destroyResource`}]}]},{number:55,entries:[{text:`永恒的内省在创造性行为中体现出来。根据一段失去的记忆获得一项创造性的技能。`,effects:[{type:`gainSkill`}]},{text:`你献身于一门艺术。失去一项资源，但找回一段失去的记忆。`,effects:[{type:`loseResource`},{type:`restoreMemory`}]},{text:`你因自己的艺术而声名鹊起，但却不得不隐于阴影。沮丧地摧毁一项资源。获得一项技能。`,effects:[{type:`destroyResource`},{type:`gainSkill`}]}]},{number:56,entries:[{text:`你开始建造一座让周围凡人困惑不已的奇妙建筑。只透露一点它的用途。失去一项资源并获得技能远见。`,effects:[{type:`gainSkillNamed`,skill:`远见`},{type:`loseResource`}]},{text:`凡人试图阻止你实现你的愿景。勾选一项技能以坚持下去。你为了保护你的建筑犯下了什么可怕的罪行？`,effects:[{type:`checkSkill`}]},{text:`你已经完成了你的建筑。你为什么要做这个？它有什么用途吗？它会改变世界吗？`,effects:[]}]},{number:57,entries:[{text:`你对古老事物的知识成为一种优势。根据已勾选的技能，你与当代凡人分享了哪些知识？勾选一项技能。创建一项资源。`,effects:[{type:`checkSkill`},{type:`gainResource`}]},{text:`哪些人类会向你寻求知识？你给予他们什么？你又拿走了什么？创建一个比你更聪明、更有能力的凡人角色。获得一项资源。`,effects:[{type:`createMortal`},{type:`gainResource`}]},{text:`你被带到了你最早犯下的罪行之一的现场。谁带你来这里？为什么？你还记得吗？勾选一项技能。如果你不具有这起罪行的记忆，你会想起它。`,effects:[{type:`checkSkill`}]}]},{number:58,entries:[{text:`社会已经变了。旅行对你来说变得如何更容易？恢复任何你仍有一段记忆的固定资源，它们会重新添加到你的资源列表中。`,effects:[{type:`retrieveResource`}]},{text:`在这些古老的地方游荡会发掘出什么记忆？找回与固定资源相关的丢失的记忆，或者获取一项你在这里隐藏的新宝藏资源。`,effects:[{type:`restoreMemory`},{type:`gainResource`}]},{text:`这里为你设下了什么可怕的陷阱？失去一项资源，获得一项印记。`,effects:[{type:`loseResource`},{type:`gainMark`}]}]},{number:59,entries:[{text:`一个凡人发现了一个早已死去角色的日记，或者你自己遗失的日记，并接近你。他们在寻找什么？获得一项技能或资源。创建一个凡人角色。`,effects:[{type:`gainSkill`},{type:`gainResource`},{type:`createMortal`}]},{text:`凡人伤害、羞辱或揭发了你。在你徒劳无功地追逐他们中勾选一项技能。失去一项资源。`,effects:[{type:`checkSkill`},{type:`loseResource`}]},{text:`凡人对禁忌知识的渴望导致超自然恐怖降临于世。这是最终会毁灭世界的巨大怪物，还是一个专门针对你的个人恐怖？创建一个或多个不朽角色。`,effects:[{type:`createImmortal`}]}]},{number:60,entries:[{text:`勾选一项技能以避免作为罪犯被逮捕。发生了什么？谁代替你被捕了？如有必要，创建一个凡人角色。`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`创建一个无辜的凡人角色。他们因你犯下的罪行而被处死。在他们被处死的那天晚上，你在摆弄什么爱好？获得技能这不关我的事。`,effects:[{type:`gainSkillNamed`,skill:`这不关我的事`},{type:`createMortal`},{type:`killCharacter`}]},{text:`一整个阶层的人因你犯下的罪行而被指责。获得技能总有替罪羊。谁在替你受苦？创建一个代表这些人的友好角色，他们对你的共犯行为一无所知。创建另一个有权力的角色：他们知道这些人是无辜的，但并不在意。`,effects:[{type:`gainSkillNamed`,skill:`总有替罪羊`},{type:`createCharacter`},{type:`createCharacter`}]}]},{number:61,entries:[{text:`某人让你想起了一位早已去世的挚爱角色。勾选一项技能来讨好他们的熟人。创建一个凡人角色。`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`你经常将活着的凡人与死去的角色混淆。获得印记我到处都能看到[死去的角色]。`,effects:[{type:`gainMark`}]},{text:`你的身体已经衰老。一项印记变为失能。你必须寻求凡人的帮助。创建一个特别能帮助你的凡人角色。`,effects:[{type:`crippleMark`},{type:`createMortal`}]}]},{number:62,entries:[{text:`你意识到你长期以来所相信的某个古老禁忌或限制不再适用。是什么情况促使你发现了这一点？这如何让你的生活更令人满意？以适当的方式更改一项已勾选或未勾选的技能。`,effects:[{type:`changeSkill`}]},{text:`你发现自己曾经很强大的地方现在却变得很弱了。岁月从你身上夺走了什么？是什么导致了这种情况？失去一项已勾选的技能。`,effects:[{type:`loseCheckedSkill`}]},{text:`你受了伤，无法行动。若无人帮助，你会自行恢复，但好心人把你送到了医院。你醒来后意识到自己已经被人发现了。创建一个角色：一个惊恐万分的凡人医务人员，他完全了解你是什么东西。`,effects:[{type:`createCharacter`}]}]},{number:63,entries:[{text:`你如何满足自己平庸的物质需求？记录一次这方面出错的经历。勾选一项技能。`,effects:[{type:`checkSkill`}]},{text:`你如何避免被政府盯上？根据记忆创建一项技能。`,effects:[{type:`gainSkill`}]},{text:`你如何欺骗自己认为你为社会提供了有价值的服务？获得技能寄生虫。`,effects:[{type:`gainSkillNamed`,skill:`寄生虫`}]}]},{number:64,entries:[{text:`大量人类正在世界各地迁徙。哪些群体变得容易被捕食？你如何利用他们的无助？创建一项资源。`,effects:[{type:`gainResource`}]},{text:`你操纵社会领袖，让一群人更加容易成为你吸血的目标。你围绕这些受害者建立了什么系统？勾选一项技能，从记忆中创建一项相关技能。创建一个角色，这个角色是那些抵抗你阴谋之人的核心。`,effects:[{type:`checkSkill`},{type:`gainSkill`},{type:`createCharacter`}]},{text:`社会在全球范围内崩溃，数个世纪内都无法恢复。数百万人挨饿，政府解散，城市燃烧，街头发生谋杀。你如何利用混乱？勾选一项技能。创建两种新资源。创建一项技能。在这个可怕的时代，哪个角色能崛起成为全球领导者？`,effects:[{type:`gainSkill`},{type:`checkSkill`},{type:`gainTwoResources`}]}]},{number:65,entries:[{text:`一件物品被证明具有古董的经济价值。用你最古老的资源换取两项当代的资源。`,effects:[{type:`note`,text:`换入的是两项当代资源：划掉最古老的资源，创造两件新的资源。`},{type:`swapResource`}]},{text:`你对已放弃或丢失的资源感到非常后悔。尽一切努力将其找回。失去两项资源或勾选两项技能并找回一项失去的资源。`,effects:[{type:`checkSkill2`},{type:`loseResource2`},{type:`retrieveResource`}]},{text:`物体是短暂的。一切都是虚无。扔掉你最古老或最珍贵的资源。`,effects:[{type:`destroyResource`}]}]},{number:66,entries:[{text:`你的知识已经过时了。失去一项未勾选的技能，现在它已经没用了。`,effects:[{type:`loseUncheckedSkill`}]},{text:`我们的价值观已经过时了。失去一项资源。`,effects:[{type:`loseResource`}]},{text:`你是如此的古老，以至于不再像一个当前时代的人。创建一个反映这一点的印记。你是如何意识到你的身体不再适合现在的？`,effects:[{type:`gainMark`}]}]},{number:67,entries:[{text:`语言本身将你抛在身后。人们用你无法理解的工具讨论你无法掌握的概念。这个问题是如何显著表现出来的？创造一个角色，他会教你一项技能，以帮助你抵消这种劣势。`,effects:[{type:`createCharacter`},{type:`gainSkill`}]},{text:`新的通信形式提供了新的狩猎方法。修改一段旧记忆，以包含这种现代通信技术的不合时宜的使用。勾选一项技能，创建一项技能。`,effects:[{type:`editMemory`},{type:`checkSkill`},{type:`gainSkill`}]},{text:`语言已发展成超出你理解的东西。你可以调用凡人会以特定方式反应的音素结构，但你无法再分享实际的想法、感受或抽象的概念。创建一项表达这一点的技能。`,effects:[{type:`gainSkill`}]}]},{number:68,entries:[{text:`一件与你的凡人生活直接相关的古物浮出水面。勾选一项技能或失去一项资源，并将古物作为一项资源获得，然后重新获得你最早的记忆中的一项。记录一段获得古物的经历。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`gainResource`},{type:`restoreMemory`}]},{text:`因为这件古物，有人开始追捕你。创建一个凡人角色。他们是如何差点揭露你的？勾选一项技能或失去一项资源。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`createMortal`}]},{text:`凡人角色猎手将你逼入绝境。你化身为你勾选过的技能之一来击败他们。获得一项印记。`,effects:[{type:`gainMark`}]}]},{number:69,entries:[{text:`你与一个古老的敌人角色因共同的过去而建立联系，在其中找到比现代世界更易理解的东西。勾选一项技能。你们成为朋友。分享一项资源并获得对方与你分享的一项资源。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`gainResource`}]},{text:`你和朋友躲进一个隐蔽的地方。在那里，你们几个世纪以来第一次分享真正的快乐。创建一项关于爱与安全的技能。`,effects:[{type:`gainSkill`}]},{text:`你和朋友想出了一个绝妙的计划，并付诸实施。勾选一项技能。计划是什么？你要征服世界吗？让死者复活吗？如果合适，你可以现在结束游戏。`,effects:[{type:`checkSkill`}]}]},{number:70,entries:[{text:`凡人是残忍的，他们行事的方式超出你的理解范围。你是如何被嘲笑或受害的？为什么你的反应无效且代价高昂？勾选一项技能。`,effects:[{type:`checkSkill`}]},{text:`一个重要的记忆因你接触当代社会的心理诡计而受到污染。修改记忆以使其不那么特别。失去一项未勾选的反社会技能。`,effects:[{type:`editMemory`},{type:`loseUncheckedSkill`}]},{text:`失去一段记忆。记录一个由对当代声望物品的渴望驱动的经历。失去两项资源，获得一项有声望的资源。`,effects:[{type:`loseMemory`},{type:`loseResource2`},{type:`gainResource`}]}]},{number:71,entries:[{text:`一个不朽者角色被凡人摧毁了。你是怎么知道这件事的？你失去了什么？根据记忆创建一项技能。必要时创建一个不朽者角色。`,effects:[{type:`gainSkill`},{type:`createImmortal`}]},{text:`你是如何无意中对这起谋杀案负责的？你获得了什么微小的好处？获得一项资源。`,effects:[{type:`gainResource`}]},{text:`创建一段关于不朽角色的虚假经历，这帮助你平静地接受与他们有关的记忆。`,effects:[]}]},{number:72,entries:[{text:`你在外面被抓住并被摧毁了。发生了什么？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:73,entries:[{text:`你达到了绝对稳定的状态，可以维持不变，直至太阳消亡。这意味着什么？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:74,entries:[{text:`你被困在一个永远无法获救的地方。你在最初的一千年里会想些什么？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:75,entries:[{text:`一个老朋友或老敌人在你睡梦中谋杀了你。在梦境与虚无之间的那几秒钟里，你看到了什么？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:76,entries:[{text:`政府抓获了你，知道了你的真面目。他们会对你做什么？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:77,entries:[{text:`你的身体终于疲惫不堪。你无法继续猎食。这会发生什么？游 tify-between mb-6`},_p={class:`space-y-3`},vp=[`onClick`],yp={class:`text-xl`},bp={class:`flex-1 title-serif text-lg text-parchment`},xp={class:`text-amber-400/70 text-sm`},Sp={key:0,class:`px-5 py-4 fade-in`},Cp={key:0,class:`title-serif text-base gold-text mb-2`},wp={class:`space-y-3`},Tp=R({__name:`TutorialView`,emits:[`navigate`],setup(e,{emit:t}){let n=t,r=[{id:`intro`,title:`游戏简介与游玩所需`,icon:`🩸`,sections:[{paras:[`《千年老吸血鬼》是一款孤独的单人角色扮演游戏，你将在游戏中记录一个吸血鬼跨越多个世纪的不死生活，从失去凡人身份开始，直至其不可避免的毁灭。`,`这个吸血鬼会以意想不到的、令人不快的，有时甚至是悲惨的行为让你感到惊讶。做出令人不安的抉择，进行无法挽回的行动，解开复杂的剧情线索，是这款游戏的核心。你将在探索吸血鬼的人性缺陷、邪恶行为和意外胜利的过程中体验这些内容。`,`游戏的机制简单而直观。游戏通过本书的提示部分以半随机的方式进行。回答提示，了解你的吸血鬼的所欲与所求，揭示他们面临的挑战，并描绘他们逐渐衰老的过程。构建一个包含记忆的角色记录，然后随着时间的无情流逝失去这些记忆。目睹你爱过和恨过的每个人逐渐老去、死亡，最终化为尘土。`]},{heading:`游玩所需`,paras:[`你需要一颗十面骰（D10）和一颗六面骰子（D6）。如果你没有骰子，附录 II 中有随机数表。使用这些表格时，你只需丢一枚硬币、用手指指向某处，或者用其他方式从表中选择一个随机数即可。`,`你还需要以某种方式来记录你的吸血鬼故事。纸和笔就可以，不过使用 Word 文档或其他软件会更方便。在快速游戏中，你只需几张纸记录角色信息；但在日记式游戏中，你可能会写满整本日记。`,`在附录中，你还会找到多人游戏规则、安全工具、替代提示、游玩范例，以及一些关于游戏创作的背景。`,`（本网页版已内置骰子与记录功能，游玩所需皆备于此页。）`]}]},{id:`traits`,title:`你的吸血鬼：五种特征`,icon:`📋`,sections:[{heading:`五种特征`,paras:[`你在这款游戏中记录的吸血鬼会以五种不同的特征来表示：记忆、技能、资源、角色、印记。`,`几乎每次你收到一条提示时，你的某个特征都会被修改。例如，你可能被指示勾选某项技能。为此，你需要在该技能旁边打勾。或者，提示可能会导致你失去某个特征，这会以用一条线将其划掉来表示。确保被划掉的特征仍然可读，因为你可能会在之后参考它，甚至恢复它。`]},{heading:`记忆`,paras:[`记忆和经历是塑造你吸血鬼的重要时刻，并以文字的形式凝结成形。它们构成了吸血鬼自我的核心——那些他们知道并在乎的事物。经历是一个特定的事件；记忆则是通过主题或内容连接在一起的一系列经历。`,`经历涵盖了一个特定的事件，但该事件所代表的时间可能会有很大的差异。一项经历可能描述几秒钟的影响深远的事件，也可能涵盖在古老城堡中潜伏了两百年。`,`几乎每条提示都会创造一项经历，而经历最终会相互结合，形成记忆。但吸血鬼能记住的东西是有限的。为了反映这一限制，你的记录表上留给记忆的空间有限。旧的记忆将在游戏过程中消失，为新的记忆腾出空间。你需要做出艰难的选择，决定哪些记忆要保留，哪些要遗忘：这些艰难抉择是游戏的核心。`,`从游戏术语来看，经历是描述提示结果的一句话。记忆是随着时间积累的一系列相关经历。你的吸血鬼在游戏开始时有五个记忆槽，每段记忆可以包含至多三个经历。`,`尽管一个提示可能会提出多个问题，但一项经历不需要涵盖所有问题。经历应该是一句富有感染力的句子，是事件的浓缩——一句结合了发生的事情及其对你的吸血鬼意义的句子。`,`一个好的经历格式是“[事件的描述]；[我对此的感受或做出的反应]”。如有必要，可以在句末添加破折号以包括更多信息。注意任何受到提示影响的特征，例如角色或资源，并尝试将它们融入其中。以第一人称，从吸血鬼的角度写作。`,`一段记忆包含最多三项经历。每个记忆应通过一个主题、特征或其他将经历联系在一起的方式来定义。每当一项新的经历无法融入现有的记忆时，将它放入一段新的记忆中——前提是有可用的记忆槽。`,`你的吸血鬼可以拥有五段记忆。当新的经历发生且没有地方存放时，较早的记忆将会丢失。如果你已经填满了五个记忆且需要记录一段新的，划掉一个现有的记忆及其包含的所有经历——遗忘是游戏的基础部分，所以接受它。`,`由你作为玩家来决定遗忘哪些记忆。这不是吸血鬼的有意识选择。除非另有指示，否则你可以划掉任何记忆来为新的经历腾出空间。`,`当你没有空间时，有一种方法可以保存记忆。你可以将一个现有的记忆移动到日记中，而不是遗忘它。`]},{heading:`日记`,paras:[`一本日记最多可以容纳四段吸血鬼的记忆。与记忆本身不同，日记是添加到你的资源列表中的实物。你可以随时创建日记，以便将记忆移入其中。和其他资源一样，日记也可能会丢失。当这种情况发生时，将其所包含的记忆划掉。你的吸血鬼同时只能拥有一本日记，并且其中必须至少有一段记忆。`,`在将记忆放入日记的那一刻，这段记忆就不再存在于吸血鬼的脑海中——它仅存在于日记里，而吸血鬼接受任何写在上面的内容为真。一旦某段记忆被转移至日记，你就不能再为此记忆增加任何经历了。`]},{heading:`技能`,paras:[`某些提示会指示你勾选（check）一个技能。为此，在你的记录表上该技能旁边打勾。从机制上讲，这表示该技能已经被使用。叙述上，被勾选的技能给你后续回答提示增添了风味。`,`如果说未勾选的技能是你的吸血鬼能够做到的，那么勾选的则是他们已经做过的。这是你的吸血鬼本质的一部分——它们是什么样的吸血鬼。`,`每个技能只能被勾选一次。如果有提示让你失去一个技能，请将其划掉——这个技能消失，不再影响你的吸血鬼在世界中的行动方式。`]},{heading:`资源`,paras:[`资源是对吸血鬼有用的资产或结构，或他们重视的物品。骑士装备、忠诚的部落、一顶钻石头冠、昂布雷希特城堡、商业帝国、一枚幸运硬币、有遮挡的游览车、一支罗马军团、通往统治者宝藏库的镀银钥匙、一桶酸液、一盒动物蜡烛——这些都是可接受且迷人的资源。`,`提示有时会提到固定资源。这些是吸血鬼离开该区域时无法随身携带的财产。`,`当提示指示你创建资源时，请确保创建符合情境的资源，即使这会导致资源不够令人兴奋或有用。当提示让你的吸血鬼失去资源时，将其划掉。保持条目清晰，因为失去的东西可能会随着时间回来。`,`让你可用的资源影响你如何描绘经历。策马挥鞭，指挥潜艇。当必须将它们划掉时，让资源变得明显；不要只是失去你的豪宅，而是烧毁它，或至少描述一场激烈的法律争斗。`]},{heading:`角色`,paras:[`角色是与你的吸血鬼有关系的人物。每个角色应以一个句子片段命名和描述，例如“劳伦斯·霍尔穆勒，霍尔穆勒男爵的后裔”或“修女阿德尔福，一个爱管闲事的修女”。在处理提示的过程中，每次与他们互动时加入更多描述。`,`一个角色可以是凡人或不朽者。当被指示创建新角色时，提示会告知你该角色是凡人还是不朽者。`,`凡人是随着时间流逝而死亡的普通人类或其他生物。而不朽者则是超自然存在，时间对他们几乎没有意义。他们可能是其他吸血鬼、天使或恶魔、幽灵、失败的科学实验体、被遗忘的神祇、地下潜伏者、多事的祖先、隐形游荡者、不动声色的活尸、家神或精魄……或者其他任何稀奇古怪的东西。`,`有时，你会意识到一个凡人因年老而去世。这可能每隔四五个提示就会发生一次。遇到这种情况时，请划掉角色姓名。除此之外，除非提示让你这么做，否则角色不会被杀死，不过你可以随意描述他们。`]},{heading:`印记`,paras:[`印记是吸血鬼不死状态的可见标志，或任何使他们与凡人不同的特征。可能是一道在喉咙上不断流血的伤口、空洞苍白的眼睛、一个跟在身后的幽灵、一道狰狞的伤疤、装满老鼠的空洞腹部。印记是吸血鬼贯穿其生存期间携带的一种东西。`,`在创造印记时，请考虑你的吸血鬼是否掩饰它，以及如何掩饰。`,`范例印记包括：一对巨大的蝙蝠翅膀——我用锯子把它们锯掉了，但残根还在；我的眼睛有催眠效果，所以我必须戴墨镜；一个漆黑的光环，我用高高的军帽将其盖住；在月光下，我的影子会变成美洲豹的形状；动物害怕我，孩子见到我就哭；我可以变成狼或老鼠；我的手指向后弯曲成爪子，我穿长袖衣服来掩盖它。`]},{heading:`边栏：什么是吸血鬼？`,paras:[`吸血鬼是你将在叙述中跟随的角色。如何展现他们的吸血鬼本性由你决定，但《千年吸血鬼》有几个假设。为了获得此游戏系统的最佳体验，你的吸血鬼……`,`…应该以人为食；`,`…应该试图在他们赖以生存的人群中伪装自己；`,`…曾经是人类，仍然在某种意义上保有人类的需求；`,`…应该容易受到普通凡人不关心的环境危害的影响，比如阳光；`,`…应该几乎是不朽的；`,`…多为独行者。`,`《千年吸血鬼》中的提示并不一定是针对不朽生物之间的复杂政治阴谋设计的。`]}]},{id:`create`,title:`创建吸血鬼`,icon:`🕯️`,sections:[{paras:[`首先想象一个远古时代的人——一位罗马皇帝、一位美索不达米亚的助产士、一位法国骑士。这个人将成为你的吸血鬼。想象他们何时何地出生，以及他们生前是谁。从一个能够概括其历史的经历开始一段记忆。例如：“我是亨利，乔恩之子，出生于公元13世纪的卢瓦尔河谷附近；我是一名被骗取了遗产的贫穷骑士。”`,`这第一项经历与大多数经历有些不同，因为它是对吸血鬼成为亡灵前生活的一次概述。将这段经历放入记录表中的第一个记忆里。`,`接下来，创建至少三个凡人，并将他们添加到吸血鬼的记录表中。这些凡人与你的吸血鬼有关系——亲戚、朋友和爱人、敌人、导师、债务人或其他适合你所选择的时间和地点的人。用几句话描述每个角色。请注意，这些角色可能会非常重要，但不会存在太久。`,`为你的吸血鬼预备役提供三项适合其生活境遇的技能，以及在他仍是凡人时获得的三项资源。记住，资源几乎可以是任何东西。不论大小，无论是一把黑曜石刀还是一支战船舰队，都是一项资源。`,`然后，再创造三项经历——每项经历分别录入进一段记忆中。这些经历中的每一个都应与你的吸血鬼的特征相结合。`,`最后，创造一个不朽者。这是赋予（或诅咒）你的吸血鬼永生的生物。创造一项印记和经历来解释你的吸血鬼是如何成为黑夜生物的。`]}]},{id:`play`,title:`游玩游戏`,icon:`🎲`,sections:[{heading:`游戏流程`,paras:[`要玩《千年吸血鬼》，你需要回答一系列提示。通过回答这些提示来了解你的吸血鬼，体验他们的磨难，并对他们的所作所为感到惊讶。以令人满意的方式回应这些提示是这个游戏的乐趣。`,`你可以像记日记一样用书面形式回答提示，也可以自言自语。给自己的记录编号，以保持时间顺序清晰。`,`在回答提示的过程中，按照指示创建、失去和改变你的吸血鬼特征。除非有其他指示，否则每次回答提示时你都必须创建一段经历并将其添加到记忆中。`]},{heading:`骰子与移动`,paras:[`然后掷出 D10 和 D6，用 D10 的结果减去 D6 的结果。如果结果是正数，则向后移动相应数量的提示；如果是负数，则向前移动。若为 0，则说明再次遇到相同的提示。`,`假设我刚刚回答了提示 11。我在 D10 上掷出 7，在 D6 上掷出 4，这意味着我向后移动 3，到达提示 14。然而，如果两颗骰子都掷出 4，我将再次回答提示 11。`,`你不能移动到提示 1 之前，只是再次触发提示 1。`]},{heading:`提示的条目`,paras:[`你会注意到提示有第二和第三项。它们会在你第二次或第三次到达同一个提示时触发。如果你已全部回应了某个提示的所有条目，前往下一个提示。`,`当你进入一项提示时，先处理第一个条目；如果再次进入相同的提示，对应处理该提示的第二、第三个条目；如果已经三次进入同一个提示且处理完每一个条目，请跳到下一个提示。`]},{heading:`技能与资源的替代规则`,paras:[`如果提示指示你勾选一项技能，但没有可供勾选的技能，则失去一项资源。同样，如果被指示失去资源但无法这样做，则勾选一项技能。`,`当发生这些替代时，这表示对你的吸血鬼来说情况非常糟糕——叙述最糟糕的结果。你只能在技能和资源之间进行替换，不能选择用角色、记忆或印记来代替技能或资源。`]},{heading:`游戏结束…`,paras:[`…当你在需要勾选技能或失去资源时无法做到，或者`,`…提示告诉你游戏结束时。`,`如果你必须失去技能或资源但你都没有，那么游戏结束——利用提示作为灵感叙述吸血鬼的结局。`]}]},{id:`styles`,title:`两种游戏风格`,icon:`✍️`,sections:[{heading:`快速游戏`,paras:[`玩《千年吸血鬼》有两种方式：快速游戏或日志游戏。`,`在快速游戏中，完全在你的角色记录的记忆区域中回答提示。此方法快捷、令人满意，并让你可以更灵活地诠释自己吸血鬼的故事。`]},{heading:`日志游戏`,paras:[`在日志游戏中，你需要写日记。通过书面形式回答提示，每个问题大约用一段短小的文字作答。最终，你将获得一个可以回顾的文档。`,`除了书写日志条目外，仍必须为每个提示添加一项经历。如果出现任何矛盾或复杂情况，在日志游戏中，你的记忆和经历优先于日记条目的细节。在游戏进行的过程中，你会逐渐理解一些故事起初不明确的方面。如有需要，可以修改或忽略之前的日记条目，但除非有提示指示你这样做，否则永远不要修改记忆！`]},{heading:`回答提示`,paras:[`以自然的方式回应提示。不要强求。如果现有特征或过去事件与提示有关，将它们结合起来。你不需要回答提示中的每个问题。`,`提示通常会组合成故事。如果在一个提示中介绍了一个有帮助的角色，而接下来的提示中吸血鬼获得了新的资源，找出它们之间的关系。在不同的提示之间可以经过任意长的时间，因此多个提示可能会融合成持续数天或几十年的故事弧线。`,`将控制权交给游戏。提示是创意和联结的火花。可以重新解释以前提示的答案，以更好地理解当前情况。但不必试图把一切都联系在一起，这没有必要。你的吸血鬼将活上千年，在他们的人生中会有许多小而未结的事件发生。有时一个角色会出现然后离开游戏，没有完成任何重要事情，或者一个资源未被使用，这都是正常现象——这就是生活该有的样子。`,`过度思考无济于事。不是每个提示都需要意义重大。回答提示时不必解释所有决定。有些事情可以稍后再说。让游戏带回重要的部分。`,`感到不适。你的主角是吸血鬼，即使你试图保持他们体面而人性化，也会发生可怕而诱人的事情。当提示与有限的资源结合，导致你的吸血鬼杀死亲人并做出奇怪行为时，你应该有不适感。这是游戏的一种优势，所以让黑暗随之而来。`,`提示是一种了解历史和现实世界的机会。如果你需要，可以转向维基百科，阅读有关不同类型土耳其贵族的信息。`,`游戏会等你的。`]},{heading:`时间流逝`,paras:[`这款游戏涉及数个世纪的磨砺。你的吸血鬼会因为时间的流逝而失去记忆，必须不断追求重塑自我以跟上周围社会的发展。时间非常宽松，所以可以随意想象其进程。考虑历史事件，并在合适的时候将它们融入进去：世界大战和政治动荡是极为重要的事件，即使对吸血鬼来说也是如此。`,`作为一般指导，可以将你回答的前七个或八个提示视为角色成为吸血鬼后繁忙的最初几年。他们认识的人都还活着，世界仍然是他们作为凡人生活中的那个世界。相比之下，他们最后的经历可能发生在 21 世纪初。`,`不必担心具体的年份，但要注意年表中明显的断裂。一系列提示可能互相关联讲述一个小故事，只不过某件事情打断了这个故事。这时可借机向未来跳跃几十年。如果你在只有十五世纪时就达到游戏结束提示，那也没关系。`]}]},{id:`overview`,title:`提示：简单回顾`,icon:`📜`,sections:[{paras:[`以下一页的提示 1 作为开始；`,`掷 D10 和 D6，从 D10 的值中减去 D6 的值，然后移动到相应数值的提示处；`,`一个正数意味着向后移动；`,`一个负数意味着向前移动；`,`你不能移动到提示 1 之前，只是再次触发提示 1；`,`零意味着你保持在相同的提示处；`,`当你进入一项提示时，先处理第一个条目；`,`如果再次进入相同的提示，对应处理该提示的第二、第三个条目；`,`如果已经三次进入同一个提示且处理完每一个条目，请跳到下一个提示。`]}]},{id:`example`,title:`游玩示例`,icon:`🎭`,sections:[{heading:`示例一`,paras:[`我想在早期的东欧创造一个吸血鬼，所以我查了名字，选择了 Ada。接着，我判定 Ada 是一个住在后来成为波兰的地区斯拉夫人。我用一段概括 Ada 至此存在的经历开启她的第一段记忆：我是 Ada，一个住在荒野塔特拉山脉边缘的斯拉夫女人。`,`我为 Ada 选择一些特质。`,`人物：Piotr，一个照看我羊群的牧童。Róża，我年迈的母亲，她住在我的庄园里。Hania，我的邻居，一个朋友也是敌人。`,`技能：温柔的屠夫。酿啤酒。山野漫游者。`,`资源：华丽的步行手杖。一大群羊。一袋银币。`,`然后我将这些特质组合起来，创造三段新的记忆，每段包含一段经历。`,`一整天，Róża 母亲都安静地坐在啤酒桶旁；她说桶在对她唱甜美的歌，而她把听到的刻在一根华丽的白蜡木步行手杖上。`,`Piotr 在一次土匪袭击中成了孤儿；我替他保管他家的银币，直到他成年——在此期间他与羊群一起劳作。`,`Hania 抱怨当我赶着羊穿过溪流时，但她从不拒绝我赠予她的羊肉。`,`接下来我创造另一个人物：那个将把 Ada 推入不死之身的吸血鬼，以及一个与此相关的印记和一段记忆。`,`人物：Vyri，一个住在洞穴里的枯瘦东西`,`记忆：在群山中漫游，我听到有人呼救；那是恶魔 Vyri 的诡计，他饮我的血，然后将我抛入山溪等死——数小时后，Hania 和她的丈夫将我拉出水面，以为我已死。`,`印记：如冰的肌肤；我小心不碰触任何人`,`我现在有了一个由三项技能、三项资源、一个印记和五段记忆组成的吸血鬼，每段记忆各由一段经历构成。我已经准备好让 Ada 开始遭遇提示了。`,`我掷了一个 d10 和一个 d6，用前者减去后者。我得到 8 和 3：8 减 3 等于 5。从提示 1 开始，我向前数五个提示，来到提示 6：“一位凡人人物开始为你效劳。他们是谁？他们为何被你吸引？创造一个新的凡人人物。”`,`让我想想……最先浮现在我脑海中的想法相当狂野。我创造了 Josse，一位法国宫廷的天文学家。我需要写一段关于他的经历，并把它附在 Ada 的某段记忆上。我在第二段记忆——关于 Piotr 的那段——上补写道：同一伙强盗把 Josse 带到了我面前，他是个衣衫褴褛的流浪者，用磕磕巴巴的波兰语告诉我，他在星空中预见了我神秘力量的崛起，并已寻找我长达五年；他在偏院安顿下来，用河泥制作精致的面具。`,`只能写一句话作答，即便它们会被拉得很长。`]},{heading:`示例二`,paras:[`Soo-ae 是一位出生于韩国的吸血鬼，我们在 1855 年发现她生活在格陵兰的一座捕鲸站上。Soo-ae 目前处于提示 56，在漫长的一生中经历了许许多多的事情；她的五段记忆都已填满，每段包含三段经历。`,`掷出 1，Soo-ae 推进到提示 57：“你对古老事物的了解成为了一种力量。基于一项已勾选的技能，你与当代凡人分享了什么知识？勾选一项技能。创造一项资源。”`,`哦，妙啊！我认为，数百年前 Soo-ae 在勇敢的 Eltilda 女王麾下于不列颠的岁月，让她对继承与头衔的复杂问题有了洞见。她拥有已勾选的技能“海事律师”，这已经足够贴近了。`,`Soo-ae 只有两项未勾选的技能：Biting Wit 与 Sled Dog Trainer。该死，这很难办。我划掉 Biting Wit，开始写一段经历。`,`就在那时我意识到，Soo-ae 的五个记忆槽都已填满，每段含三段经历，而她的日记也同样满了，装下了四段各含三段经历的记忆。我从 Soo-ae 的日记中划掉一段关于五百年前与父亲同行走丝绸之路的记忆，并把她当前的一段记忆移入书中。Soo-ae 不再拥有任何关于她成为吸血鬼之前那段时光的记忆。`,`在新腾出的记忆槽中，我写道：我成了伦敦《Punch》杂志的通讯员；我那些针对名门望族历史的尖刻诗作透露出我知晓甚多，很快他们便雇用我，既让我分享秘密，也让我替他们保守秘密。`,`最后，我取用资源“一个丰盈的伦敦银行账户”。`]}]}],i=F(`intro`);function a(e){i.value=i.value===e?null:e}return(e,t)=>(U(),W(`div`,hp,[K(`div`,gp,[t[1]||=K(`h2`,{class:`title-serif text-2xl gold-text m-0`},`阅读教程`,-1),K(`button`,{class:`btn btn-ghost text-sm`,onClick:t[0]||=e=>n(`navigate`,`home`)},`← 返回`)]),K(`div`,_p,[(U(),W(H,null,z(r,e=>K(`div`,{key:e.id,class:`card overflow-hidden`},[K(`button`,{class:O([`w-full flex items-center gap-3 px-5 py-4 text-left`,i.value===e.id?`border-b border-amber-900/40`:``]),onClick:t=>a(e.id)},[K(`span`,yp,k(e.icon),1),K(`span`,bp,k(e.title),1),K(`span`,xp,k(i.value===e.id?`▾`:`▸`),1)],10,vp),i.value===e.id?(U(),W(`div`,Sp,[(U(!0),W(H,null,z(e.sections,(e,t)=>(U(),W(`div`,{key:t,class:`mb-4 last:mb-0`},[e.heading?(U(),W(`p`,Cp,k(e.heading),1)):Y(``,!0),K(`div`,wp,[(U(!0),W(H,null,z(e.paras,(e,t)=>(U(),W(`p`,{key:t,class:`text-sm leading-relaxed opacity-90`},k(e),1))),128))])]))),128))])):Y(``,!0)])),64))]),t[2]||=K(`p`,{class:`text-center text-xs opacity-40 mt-8`},` 本教程内容依据规则书《千年老吸血鬼》（Tim Hutchings 著）整理 · 间距与序号为排版所需，未改动原文 `,-1)]))}}),Ep={class:`fade-in max-w-3xl mx-auto`},Dp={class:`flex items-center justify-between
