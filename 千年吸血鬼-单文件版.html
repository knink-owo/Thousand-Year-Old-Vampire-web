-y-4 max-h-96 overflow-y-auto pr-2`},Um={class:`text-xs opacity-50 mb-1`},Wm={class:`text-sm whitespace-pre-wrap leading-relaxed`},Gm={class:`flex justify-center gap-4 flex-wrap`},Km=B({__name:`FinishView`,emits:[`navigate`],setup(e,{emit:t}){let n=Mc(),r=X(()=>n.state),i=t,a=X(()=>r.value.diaries.length),o=X(()=>r.value.memories.length),s=X(()=>r.value.skills.filter(e=>!e.lost).length),c=X(()=>r.value.characters.filter(e=>e.dead)),l=X(()=>r.value.resources.filter(e=>e.artifact&&!e.lost)),u=X(()=>Q(`finish.artifactList`,{names:l.value.map(e=>e.name).join(Q(`finish.artifactSep`))}));function d(){let e=n.exportDiaryMarkdown(),t=new Blob([e],{type:`text/markdown;charset=utf-8`}),i=document.createElement(`a`);i.href=URL.createObjectURL(t),i.download=Q(`finish.exportName`,{name:r.value.name}),i.click(),URL.revokeObjectURL(i.href)}return(e,t)=>(U(),W(`div`,vm,[K(`div`,ym,[K(`p`,bm,j(L(Q)(`finish.epilogue`)),1),K(`h2`,xm,j(L(Q)(`finish.title`,{name:r.value.name})),1),K(`p`,Sm,j(r.value.finishReason),1),K(`p`,Cm,j(L(Q)(`finish.moves`,{n:r.value.moves})),1)]),l.value.length?(U(),W(`div`,wm,[K(`p`,Tm,j(L(Q)(`finish.artifactTitle`)),1),K(`p`,Em,j(L(Q)(`finish.artifactText`,{list:u.value})),1)])):Y(``,!0),K(`div`,Dm,[K(`div`,Om,[K(`div`,km,j(o.value),1),K(`div`,Am,j(L(Q)(`finish.stat.memories`,{n:r.value.memories.filter(e=>e.inDiary).length})),1)]),K(`div`,jm,[K(`div`,Mm,j(s.value),1),K(`div`,Nm,j(L(Q)(`finish.stat.skills`)),1)]),K(`div`,Pm,[K(`div`,Fm,j(r.value.resources.filter(e=>!e.lost).length),1),K(`div`,Im,j(L(Q)(`finish.stat.resources`)),1)]),K(`div`,Lm,[K(`div`,Rm,j(c.value.length),1),K(`div`,zm,j(L(Q)(`finish.stat.dead`,{n:r.value.characters.length})),1)])]),a.value>0?(U(),W(`div`,Bm,[K(`h3`,Vm,j(L(Q)(`finish.diaryTitle`,{n:Math.min(a.value,5)})),1),K(`div`,Hm,[(U(!0),W(H,null,V([...r.value.diaries].reverse().slice(0,5),e=>(U(),W(`div`,{key:e.id,class:`border-l-2 border-blood pl-4`},[K(`p`,Um,j(L(Q)(`diary.meta`,{prompt:e.promptNumber,n:e.entryIndex,time:``})),1),K(`p`,Wm,j(e.content),1)]))),128))])])):Y(``,!0),K(`div`,Gm,[K(`button`,{class:`btn btn-gold`,onClick:t[0]||=e=>d()},j(L(Q)(`finish.exportMd`)),1),K(`button`,{class:`btn`,onClick:t[1]||=e=>i(`navigate`,`home`)},j(L(Q)(`finish.home`)),1)])]))}}),qm=[{id:`intro`,title:`游戏简介与游玩所需`,icon:`🩸`,sections:[{paras:[`《千年老吸血鬼》是一款孤独的单人角色扮演游戏，你将在游戏中记录一个吸血鬼跨越多个世纪的不死生活，从失去凡人身份开始，直至其不可避免的毁灭。`,`这个吸血鬼会以意想不到的、令人不快的，有时甚至是悲惨的行为让你感到惊讶。做出令人不安的抉择，进行无法挽回的行动，解开复杂的剧情线索，是这款游戏的核心。你将在探索吸血鬼的人性缺陷、邪恶行为和意外胜利的过程中体验这些内容。`,`游戏的机制简单而直观。游戏通过本书的提示部分以半随机的方式进行。回答提示，了解你的吸血鬼的所欲与所求，揭示他们面临的挑战，并描绘他们逐渐衰老的过程。构建一个包含记忆的角色记录，然后随着时间的无情流逝失去这些记忆。目睹你爱过和恨过的每个人逐渐老去、死亡，最终化为尘土。`]},{heading:`游玩所需`,paras:[`你需要一颗十面骰（D10）和一颗六面骰子（D6）。如果你没有骰子，附录 II 中有随机数表。使用这些表格时，你只需丢一枚硬币、用手指指向某处，或者用其他方式从表中选择一个随机数即可。`,`你还需要以某种方式来记录你的吸血鬼故事。纸和笔就可以，不过使用 Word 文档或其他软件会更方便。在快速游戏中，你只需几张纸记录角色信息；但在日记式游戏中，你可能会写满整本日记。`,`在附录中，你还会找到多人游戏规则、安全工具、替代提示、游玩范例，以及一些关于游戏创作的背景。`,`（本网页版已内置骰子与记录功能，游玩所需皆备于此页。）`]}]},{id:`traits`,title:`你的吸血鬼：五种特征`,icon:`📋`,sections:[{heading:`五种特征`,paras:[`你在这款游戏中记录的吸血鬼会以五种不同的特征来表示：记忆、技能、资源、角色、印记。`,`几乎每次你收到一条提示时，你的某个特征都会被修改。例如，你可能被指示勾选某项技能。为此，你需要在该技能旁边打勾。或者，提示可能会导致你失去某个特征，这会以用一条线将其划掉来表示。确保被划掉的特征仍然可读，因为你可能会在之后参考它，甚至恢复它。`]},{heading:`记忆`,paras:[`记忆和经历是塑造你吸血鬼的重要时刻，并以文字的形式凝结成形。它们构成了吸血鬼自我的核心——那些他们知道并在乎的事物。经历是一个特定的事件；记忆则是通过主题或内容连接在一起的一系列经历。`,`经历涵盖了一个特定的事件，但该事件所代表的时间可能会有很大的差异。一项经历可能描述几秒钟的影响深远的事件，也可能涵盖在古老城堡中潜伏了两百年。`,`几乎每条提示都会创造一项经历，而经历最终会相互结合，形成记忆。但吸血鬼能记住的东西是有限的。为了反映这一限制，你的记录表上留给记忆的空间有限。旧的记忆将在游戏过程中消失，为新的记忆腾出空间。你需要做出艰难的选择，决定哪些记忆要保留，哪些要遗忘：这些艰难抉择是游戏的核心。`,`从游戏术语来看，经历是描述提示结果的一句话。记忆是随着时间积累的一系列相关经历。你的吸血鬼在游戏开始时有五个记忆槽，每段记忆可以包含至多三个经历。`,`尽管一个提示可能会提出多个问题，但一项经历不需要涵盖所有问题。经历应该是一句富有感染力的句子，是事件的浓缩——一句结合了发生的事情及其对你的吸血鬼意义的句子。`,`一个好的经历格式是“[事件的描述]；[我对此的感受或做出的反应]”。如有必要，可以在句末添加破折号以包括更多信息。注意任何受到提示影响的特征，例如角色或资源，并尝试将它们融入其中。以第一人称，从吸血鬼的角度写作。`,`一段记忆包含最多三项经历。每个记忆应通过一个主题、特征或其他将经历联系在一起的方式来定义。每当一项新的经历无法融入现有的记忆时，将它放入一段新的记忆中——前提是有可用的记忆槽。`,`你的吸血鬼可以拥有五段记忆。当新的经历发生且没有地方存放时，较早的记忆将会丢失。如果你已经填满了五个记忆且需要记录一段新的，划掉一个现有的记忆及其包含的所有经历——遗忘是游戏的基础部分，所以接受它。`,`由你作为玩家来决定遗忘哪些记忆。这不是吸血鬼的有意识选择。除非另有指示，否则你可以划掉任何记忆来为新的经历腾出空间。`,`当你没有空间时，有一种方法可以保存记忆。你可以将一个现有的记忆移动到日记中，而不是遗忘它。`]},{heading:`日记`,paras:[`一本日记最多可以容纳四段吸血鬼的记忆。与记忆本身不同，日记是添加到你的资源列表中的实物。你可以随时创建日记，以便将记忆移入其中。和其他资源一样，日记也可能会丢失。当这种情况发生时，将其所包含的记忆划掉。你的吸血鬼同时只能拥有一本日记，并且其中必须至少有一段记忆。`,`在将记忆放入日记的那一刻，这段记忆就不再存在于吸血鬼的脑海中——它仅存在于日记里，而吸血鬼接受任何写在上面的内容为真。一旦某段记忆被转移至日记，你就不能再为此记忆增加任何经历了。`]},{heading:`技能`,paras:[`某些提示会指示你勾选（check）一个技能。为此，在你的记录表上该技能旁边打勾。从机制上讲，这表示该技能已经被使用。叙述上，被勾选的技能给你后续回答提示增添了风味。`,`如果说未勾选的技能是你的吸血鬼能够做到的，那么勾选的则是他们已经做过的。这是你的吸血鬼本质的一部分——它们是什么样的吸血鬼。`,`每个技能只能被勾选一次。如果有提示让你失去一个技能，请将其划掉——这个技能消失，不再影响你的吸血鬼在世界中的行动方式。`]},{heading:`资源`,paras:[`资源是对吸血鬼有用的资产或结构，或他们重视的物品。骑士装备、忠诚的部落、一顶钻石头冠、昂布雷希特城堡、商业帝国、一枚幸运硬币、有遮挡的游览车、一支罗马军团、通往统治者宝藏库的镀银钥匙、一桶酸液、一盒动物蜡烛——这些都是可接受且迷人的资源。`,`提示有时会提到固定资源。这些是吸血鬼离开该区域时无法随身携带的财产。`,`当提示指示你创建资源时，请确保创建符合情境的资源，即使这会导致资源不够令人兴奋或有用。当提示让你的吸血鬼失去资源时，将其划掉。保持条目清晰，因为失去的东西可能会随着时间回来。`,`让你可用的资源影响你如何描绘经历。策马挥鞭，指挥潜艇。当必须将它们划掉时，让资源变得明显；不要只是失去你的豪宅，而是烧毁它，或至少描述一场激烈的法律争斗。`]},{heading:`角色`,paras:[`角色是与你的吸血鬼有关系的人物。每个角色应以一个句子片段命名和描述，例如“劳伦斯·霍尔穆勒，霍尔穆勒男爵的后裔”或“修女阿德尔福，一个爱管闲事的修女”。在处理提示的过程中，每次与他们互动时加入更多描述。`,`一个角色可以是凡人或不朽者。当被指示创建新角色时，提示会告知你该角色是凡人还是不朽者。`,`凡人是随着时间流逝而死亡的普通人类或其他生物。而不朽者则是超自然存在，时间对他们几乎没有意义。他们可能是其他吸血鬼、天使或恶魔、幽灵、失败的科学实验体、被遗忘的神祇、地下潜伏者、多事的祖先、隐形游荡者、不动声色的活尸、家神或精魄……或者其他任何稀奇古怪的东西。`,`有时，你会意识到一个凡人因年老而去世。这可能每隔四五个提示就会发生一次。遇到这种情况时，请划掉角色姓名。除此之外，除非提示让你这么做，否则角色不会被杀死，不过你可以随意描述他们。`]},{heading:`印记`,paras:[`印记是吸血鬼不死状态的可见标志，或任何使他们与凡人不同的特征。可能是一道在喉咙上不断流血的伤口、空洞苍白的眼睛、一个跟在身后的幽灵、一道狰狞的伤疤、装满老鼠的空洞腹部。印记是吸血鬼贯穿其生存期间携带的一种东西。`,`在创造印记时，请考虑你的吸血鬼是否掩饰它，以及如何掩饰。`,`范例印记包括：一对巨大的蝙蝠翅膀——我用锯子把它们锯掉了，但残根还在；我的眼睛有催眠效果，所以我必须戴墨镜；一个漆黑的光环，我用高高的军帽将其盖住；在月光下，我的影子会变成美洲豹的形状；动物害怕我，孩子见到我就哭；我可以变成狼或老鼠；我的手指向后弯曲成爪子，我穿长袖衣服来掩盖它。`]},{heading:`边栏：什么是吸血鬼？`,paras:[`吸血鬼是你将在叙述中跟随的角色。如何展现他们的吸血鬼本性由你决定，但《千年吸血鬼》有几个假设。为了获得此游戏系统的最佳体验，你的吸血鬼……`,`…应该以人为食；`,`…应该试图在他们赖以生存的人群中伪装自己；`,`…曾经是人类，仍然在某种意义上保有人类的需求；`,`…应该容易受到普通凡人不关心的环境危害的影响，比如阳光；`,`…应该几乎是不朽的；`,`…多为独行者。`,`《千年吸血鬼》中的提示并不一定是针对不朽生物之间的复杂政治阴谋设计的。`]}]},{id:`create`,title:`创建吸血鬼`,icon:`🕯️`,sections:[{paras:[`首先想象一个远古时代的人——一位罗马皇帝、一位美索不达米亚的助产士、一位法国骑士。这个人将成为你的吸血鬼。想象他们何时何地出生，以及他们生前是谁。从一个能够概括其历史的经历开始一段记忆。例如：“我是亨利，乔恩之子，出生于公元13世纪的卢瓦尔河谷附近；我是一名被骗取了遗产的贫穷骑士。”`,`这第一项经历与大多数经历有些不同，因为它是对吸血鬼成为亡灵前生活的一次概述。将这段经历放入记录表中的第一个记忆里。`,`接下来，创建至少三个凡人，并将他们添加到吸血鬼的记录表中。这些凡人与你的吸血鬼有关系——亲戚、朋友和爱人、敌人、导师、债务人或其他适合你所选择的时间和地点的人。用几句话描述每个角色。请注意，这些角色可能会非常重要，但不会存在太久。`,`为你的吸血鬼预备役提供三项适合其生活境遇的技能，以及在他仍是凡人时获得的三项资源。记住，资源几乎可以是任何东西。不论大小，无论是一把黑曜石刀还是一支战船舰队，都是一项资源。`,`然后，再创造三项经历——每项经历分别录入进一段记忆中。这些经历中的每一个都应与你的吸血鬼的特征相结合。`,`最后，创造一个不朽者。这是赋予（或诅咒）你的吸血鬼永生的生物。创造一项印记和经历来解释你的吸血鬼是如何成为黑夜生物的。`]}]},{id:`play`,title:`游玩游戏`,icon:`🎲`,sections:[{heading:`游戏流程`,paras:[`要玩《千年吸血鬼》，你需要回答一系列提示。通过回答这些提示来了解你的吸血鬼，体验他们的磨难，并对他们的所作所为感到惊讶。以令人满意的方式回应这些提示是这个游戏的乐趣。`,`你可以像记日记一样用书面形式回答提示，也可以自言自语。给自己的记录编号，以保持时间顺序清晰。`,`在回答提示的过程中，按照指示创建、失去和改变你的吸血鬼特征。除非有其他指示，否则每次回答提示时你都必须创建一段经历并将其添加到记忆中。`]},{heading:`骰子与移动`,paras:[`然后掷出 D10 和 D6，用 D10 的结果减去 D6 的结果。如果结果是正数，则向后移动相应数量的提示；如果是负数，则向前移动。若为 0，则说明再次遇到相同的提示。`,`假设我刚刚回答了提示 11。我在 D10 上掷出 7，在 D6 上掷出 4，这意味着我向后移动 3，到达提示 14。然而，如果两颗骰子都掷出 4，我将再次回答提示 11。`,`你不能移动到提示 1 之前，只是再次触发提示 1。`]},{heading:`提示的条目`,paras:[`你会注意到提示有第二和第三项。它们会在你第二次或第三次到达同一个提示时触发。如果你已全部回应了某个提示的所有条目，前往下一个提示。`,`当你进入一项提示时，先处理第一个条目；如果再次进入相同的提示，对应处理该提示的第二、第三个条目；如果已经三次进入同一个提示且处理完每一个条目，请跳到下一个提示。`]},{heading:`技能与资源的替代规则`,paras:[`如果提示指示你勾选一项技能，但没有可供勾选的技能，则失去一项资源。同样，如果被指示失去资源但无法这样做，则勾选一项技能。`,`当发生这些替代时，这表示对你的吸血鬼来说情况非常糟糕——叙述最糟糕的结果。你只能在技能和资源之间进行替换，不能选择用角色、记忆或印记来代替技能或资源。`]},{heading:`游戏结束…`,paras:[`…当你在需要勾选技能或失去资源时无法做到，或者`,`…提示告诉你游戏结束时。`,`如果你必须失去技能或资源但你都没有，那么游戏结束——利用提示作为灵感叙述吸血鬼的结局。`]}]},{id:`styles`,title:`两种游戏风格`,icon:`✍️`,sections:[{heading:`快速游戏`,paras:[`玩《千年吸血鬼》有两种方式：快速游戏或日志游戏。`,`在快速游戏中，完全在你的角色记录的记忆区域中回答提示。此方法快捷、令人满意，并让你可以更灵活地诠释自己吸血鬼的故事。`]},{heading:`日志游戏`,paras:[`在日志游戏中，你需要写日记。通过书面形式回答提示，每个问题大约用一段短小的文字作答。最终，你将获得一个可以回顾的文档。`,`除了书写日志条目外，仍必须为每个提示添加一项经历。如果出现任何矛盾或复杂情况，在日志游戏中，你的记忆和经历优先于日记条目的细节。在游戏进行的过程中，你会逐渐理解一些故事起初不明确的方面。如有需要，可以修改或忽略之前的日记条目，但除非有提示指示你这样做，否则永远不要修改记忆！`]},{heading:`回答提示`,paras:[`以自然的方式回应提示。不要强求。如果现有特征或过去事件与提示有关，将它们结合起来。你不需要回答提示中的每个问题。`,`提示通常会组合成故事。如果在一个提示中介绍了一个有帮助的角色，而接下来的提示中吸血鬼获得了新的资源，找出它们之间的关系。在不同的提示之间可以经过任意长的时间，因此多个提示可能会融合成持续数天或几十年的故事弧线。`,`将控制权交给游戏。提示是创意和联结的火花。可以重新解释以前提示的答案，以更好地理解当前情况。但不必试图把一切都联系在一起，这没有必要。你的吸血鬼将活上千年，在他们的人生中会有许多小而未结的事件发生。有时一个角色会出现然后离开游戏，没有完成任何重要事情，或者一个资源未被使用，这都是正常现象——这就是生活该有的样子。`,`过度思考无济于事。不是每个提示都需要意义重大。回答提示时不必解释所有决定。有些事情可以稍后再说。让游戏带回重要的部分。`,`感到不适。你的主角是吸血鬼，即使你试图保持他们体面而人性化，也会发生可怕而诱人的事情。当提示与有限的资源结合，导致你的吸血鬼杀死亲人并做出奇怪行为时，你应该有不适感。这是游戏的一种优势，所以让黑暗随之而来。`,`提示是一种了解历史和现实世界的机会。如果你需要，可以转向维基百科，阅读有关不同类型土耳其贵族的信息。`,`游戏会等你的。`]},{heading:`时间流逝`,paras:[`这款游戏涉及数个世纪的磨砺。你的吸血鬼会因为时间的流逝而失去记忆，必须不断追求重塑自我以跟上周围社会的发展。时间非常宽松，所以可以随意想象其进程。考虑历史事件，并在合适的时候将它们融入进去：世界大战和政治动荡是极为重要的事件，即使对吸血鬼来说也是如此。`,`作为一般指导，可以将你回答的前七个或八个提示视为角色成为吸血鬼后繁忙的最初几年。他们认识的人都还活着，世界仍然是他们作为凡人生活中的那个世界。相比之下，他们最后的经历可能发生在 21 世纪初。`,`不必担心具体的年份，但要注意年表中明显的断裂。一系列提示可能互相关联讲述一个小故事，只不过某件事情打断了这个故事。这时可借机向未来跳跃几十年。如果你在只有十五世纪时就达到游戏结束提示，那也没关系。`]}]},{id:`overview`,title:`提示：简单回顾`,icon:`📜`,sections:[{paras:[`以下一页的提示 1 作为开始；`,`掷 D10 和 D6，从 D10 的值中减去 D6 的值，然后移动到相应数值的提示处；`,`一个正数意味着向后移动；`,`一个负数意味着向前移动；`,`你不能移动到提示 1 之前，只是再次触发提示 1；`,`零意味着你保持在相同的提示处；`,`当你进入一项提示时，先处理第一个条目；`,`如果再次进入相同的提示，对应处理该提示的第二、第三个条目；`,`如果已经三次进入同一个提示且处理完每一个条目，请跳到下一个提示。`]}]},{id:`example`,title:`游玩示例`,icon:`🎭`,sections:[{heading:`示例一`,paras:[`我想在早期的东欧创造一个吸血鬼，所以我查了名字，选择了 Ada。接着，我判定 Ada 是一个住在后来成为波兰的地区斯拉夫人。我用一段概括 Ada 至此存在的经历开启她的第一段记忆：我是 Ada，一个住在荒野塔特拉山脉边缘的斯拉夫女人。`,`我为 Ada 选择一些特质。`,`人物：Piotr，一个照看我羊群的牧童。Róża，我年迈的母亲，她住在我的庄园里。Hania，我的邻居，一个朋友也是敌人。`,`技能：温柔的屠夫。酿啤酒。山野漫游者。`,`资源：华丽的步行手杖。一大群羊。一袋银币。`,`然后我将这些特质组合起来，创造三段新的记忆，每段包含一段经历。`,`一整天，Róża 母亲都安静地坐在啤酒桶旁；她说桶在对她唱甜美的歌，而她把听到的刻在一根华丽的白蜡木步行手杖上。`,`Piotr 在一次土匪袭击中成了孤儿；我替他保管他家的银币，直到他成年——在此期间他与羊群一起劳作。`,`Hania 抱怨当我赶着羊穿过溪流时，但她从不拒绝我赠予她的羊肉。`,`接下来我创造另一个人物：那个将把 Ada 推入不死之身的吸血鬼，以及一个与此相关的印记和一段记忆。`,`人物：Vyri，一个住在洞穴里的枯瘦东西`,`记忆：在群山中漫游，我听到有人呼救；那是恶魔 Vyri 的诡计，他饮我的血，然后将我抛入山溪等死——数小时后，Hania 和她的丈夫将我拉出水面，以为我已死。`,`印记：如冰的肌肤；我小心不碰触任何人`,`我现在有了一个由三项技能、三项资源、一个印记和五段记忆组成的吸血鬼，每段记忆各由一段经历构成。我已经准备好让 Ada 开始遭遇提示了。`,`我掷了一个 d10 和一个 d6，用前者减去后者。我得到 8 和 3：8 减 3 等于 5。从提示 1 开始，我向前数五个提示，来到提示 6：“一位凡人人物开始为你效劳。他们是谁？他们为何被你吸引？创造一个新的凡人人物。”`,`让我想想……最先浮现在我脑海中的想法相当狂野。我创造了 Josse，一位法国宫廷的天文学家。我需要写一段关于他的经历，并把它附在 Ada 的某段记忆上。我在第二段记忆——关于 Piotr 的那段——上补写道：同一伙强盗把 Josse 带到了我面前，他是个衣衫褴褛的流浪者，用磕磕巴巴的波兰语告诉我，他在星空中预见了我神秘力量的崛起，并已寻找我长达五年；他在偏院安顿下来，用河泥制作精致的面具。`,`只能写一句话作答，即便它们会被拉得很长。`]},{heading:`示例二`,paras:[`Soo-ae 是一位出生于韩国的吸血鬼，我们在 1855 年发现她生活在格陵兰的一座捕鲸站上。Soo-ae 目前处于提示 56，在漫长的一生中经历了许许多多的事情；她的五段记忆都已填满，每段包含三段经历。`,`掷出 1，Soo-ae 推进到提示 57：“你对古老事物的了解成为了一种力量。基于一项已勾选的技能，你与当代凡人分享了什么知识？勾选一项技能。创造一项资源。”`,`哦，妙啊！我认为，数百年前 Soo-ae 在勇敢的 Eltilda 女王麾下于不列颠的岁月，让她对继承与头衔的复杂问题有了洞见。她拥有已勾选的技能“海事律师”，这已经足够贴近了。`,`Soo-ae 只有两项未勾选的技能：Biting Wit 与 Sled Dog Trainer。该死，这很难办。我划掉 Biting Wit，开始写一段经历。`,`就在那时我意识到，Soo-ae 的五个记忆槽都已填满，每段含三段经历，而她的日记也同样满了，装下了四段各含三段经历的记忆。我从 Soo-ae 的日记中划掉一段关于五百年前与父亲同行走丝绸之路的记忆，并把她当前的一段记忆移入书中。Soo-ae 不再拥有任何关于她成为吸血鬼之前那段时光的记忆。`,`在新腾出的记忆槽中，我写道：我成了伦敦《Punch》杂志的通讯员；我那些针对名门望族历史的尖刻诗作透露出我知晓甚多，很快他们便雇用我，既让我分享秘密，也让我替他们保守秘密。`,`最后，我取用资源“一个丰盈的伦敦银行账户”。`]}]}],Jm=[{id:`intro`,title:`About the game and what you need`,icon:`🩸`,sections:[{paras:[`Thousand Year Old Vampire is a lonely solo role-playing game in which you chronicle the unlife of a vampire over the many centuries of their existence, beginning with the loss of mortality and ending with their inevitable destruction.`,`This vampire will surprise you as they do things that are unexpected, unpleasant, and sometimes tragic. Making gut-churning decisions, performing irreconcilable acts, and resolving difficult narrative threads are what this game is about as you explore the vampire’s human failings, villainous acts, and surprising victories.`,`Game mechanics are simple and intuitive. Play progresses semi-randomly through the Prompt section of this book. Answer Prompts to learn about your vampire’s wants and needs, to learn what challenges they face, and to chart their decline into senescence. Build up a character record of Memories and then lose them to the inexorable crush of time. See everyone you’ve loved and hated grow old and die, then turn to dust.`]},{heading:`What is needed to play?`,paras:[`You will need a ten-sided die (d10) and a six-sided die (d6). If you lack dice, use any random-number generator you like — this web version rolls both for you.`,`You will also need a way to record your vampire’s story. Paper and pencil are fine, though it is very convenient to use a word processing document or other digital text tools. In a quick game, you only need a few pieces of paper to maintain a character record, but in the journaling game, you might fill a whole diary.`,`In the appendix, you will also find multiplayer rules, safety tools that let you push yourself as hard as possible, alternate Prompts, examples of play, and some context for the creation of the game itself.`,`(This web version provides the dice and the record; everything you need is on this page.)`]}]},{id:`traits`,title:`Your vampire: the five traits`,icon:`📋`,sections:[{heading:`Five traits`,paras:[`The vampire whose chronicles you will record in this game is represented by five different traits: Memories, Skills, Resources, Characters, and Marks.`,`Almost every time you receive a Prompt, one of your traits will be modified. For instance, you may be instructed to check a Skill. To do so, you place a checkmark next to that Skill. Alternately, the Prompt may cause you to lose a trait, which is indicated by striking it out with a line. Ensure that the lost trait stays readable because you may refer back to it later or even restore it. Some Prompts will give even more dramatic instructions for changing your traits. At all times, follow the instructions given in the Prompt.`]},{heading:`Memories`,paras:[`Memories and Experiences are important moments that have shaped your vampire, crystallized in writing. They make up the core of the vampire’s self—the things they know and care about. An Experience is a particular event; a Memory is an arc of Experiences that are tied together by subject or theme.`,`Experiences cover a particular event, but the amount of time represented by that event might vary dramatically. An Experience might describe a few seconds of impactful events, or it might cover two hundred years of lurking in an old castle.`,`Almost every Prompt will create an Experience, and Experiences eventually combine with one another to become Memories. But there is only so much your vampire can remember. To reflect this limitation there is only a finite amount of space for Memories on your record sheet. Old Memories will be lost over the course of the game, making room for new ones. You will need to make difficult choices about which Memories to preserve and which to forget; these hard decisions are the core of the game.`,`In game terms, an Experience is a single sentence that describes the resolution of a Prompt. Memories are a collection of related Experiences built up over time. Your vampire begins the game with space for five Memories, each of which can contain up to three Experiences.`,`An Experience should be a single evocative sentence. An Experience is the distillation of an event, a single sentence that combines what happened and why it matters to your vampire. A good format for an Experience is a description of the event that can include how you feel or what you did about it. If necessary, you can add an em dash at the end to include more information.`,`Be conscious of any traits affected by the Prompt, such as Characters or Resources, and try to incorporate them. Write in the first-person, from the vampire’s point of view.`,`A Memory contains up to three Experiences. Each Memory should be defined by a theme, trait, or another subject that links its component Experiences in an intelligible way. Whenever a new Experience doesn’t fit into an existing Memory, place it in a new Memory, assuming one is available.`,`Your vampire is allowed five Memories. Older Memories are lost when new Experiences occur and you have no place to put them. If you have filled all five Memories and need to start a new one, strike out an existing Memory and all of the Experiences it contains—forgetting things is a fundamental aspect of the game so embrace it.`,`The decision about which Memories are lost belongs to you as the player. It is not a decision that the Vampire is consciously making. Unless instructed otherwise, you may strike out any Memory you like to make room for a new Experience.`,`There is one way to preserve Memories when you run out of space. Instead of losing an existing Memory, you can move it into a Diary.`]},{heading:`Diary`,paras:[`A Diary can hold up to four of your vampire’s Memories. Unlike Memories themselves, Diaries are physical objects that are added to your Resource List. You may freely create a Diary whenever you need to move a Memory into it. Like any other Resource, a Diary can be lost. When this happens strike out the Memories it held. Your vampire can have one Diary at a time, and it must contain at least one Memory.`,`A Memory placed in the Diary is no longer in the vampire’s head—it exists only in the Diary and the vampire accepts whatever is written as truth. Once a Memory has been transferred to a Diary, you may not add any further Experiences to that Memory.`]},{heading:`Skills`,paras:[`Skills describe the capabilities and characteristics of your vampire. They indicate what your vampire can do and what they might do. Swordplay, Relaxing Banter, Operate Heavy Machinery, I Do Not Blink The Sand Away, and I Teach the Nanissáanah are all acceptable Skills. When instructed to record a new Skill you should relate it to the content of the Prompt.`,`Some Prompts will instruct you to check a Skill. To do this, place a checkmark next to that skill on your record sheet. Mechanically, this indicates that the Skill has been used. Narratively, a checked Skill gives you something to flavor your answers to later Prompts.`,`If unchecked Skills are what your vampire is capable of, checked Skills are what they have done. They are a part of your vampire’s being, they are who the vampire is. It is entirely possible that your vampire might have Skills that you do not want to check. Instead of fighting this, revel in the plight of your humane vampire when they go to help a friend out of a bureaucratic jam and find that the only Skill they can check is Rage and Kill.`,`You may only check a Skill once. If you are instructed to lose a Skill, strike it out—it is gone and no longer influences the way your vampire moves through the world.`]},{heading:`Resources`,paras:[`Resources are assets or structures that are useful to your vampire, or items that they value. Knightly equipage, a loyal impi, a diamond tiara, the Castle Umbrecht, a business empire, a lucky penny, a screened-in charabanc, a Roman legion, the silvered key to the potentate’s treasure vault, a carboy of acid, a box of tallow candles—all are acceptable and engaging Resources.`,`In the Prompts, there will occasionally be reference made to stationary Resources. These are possessions that cannot be physically hauled away with the vampire when they leave the area. Examples might be a haunted cave, an elephant-sized statue of Set, a chandlery, a hidden pit house, a hereditary title to land.`,`When a Prompt instructs you to create Resources, be sure to create Resources that are contextually appropriate even if this leads to Resources that aren’t necessarily the most exciting or most useful. When a Prompt causes your vampire to lose a Resource, strike it out. Leave the entry legible because lost things might come back in time.`,`Let your available Resources flavor how you write your Experiences. Curry your horse, ply your whip, command your submarine. Let Resources figure prominently when you are made to strike them out; don’t just lose your mansion but burn it to the ground, or at least describe a fierce legal battle over the deed.`,`Don’t limit your vampire’s stuff to the Resources listed on the record sheet when answering Prompts. Your rich Flemish vampire will have a fencing foil if one is needed, it’s just not a Resource which can be spent to satisfy the mechanical needs of the game. If tools or homes or tombs are needed for narrative color you may create them as needed, just don’t write them down.`]},{heading:`Characters`,paras:[`Characters are the people with whom your vampire has a relationship. Each Character should be named and described in a sentence fragment, such as Lawrence Hollmueller, a descendant of Baron Hollmueller, or Sister Adelpho, a meddlesome nun. Add more descriptors each time you interact with them in the course of resolving a Prompt.`,`A Character can be mortal or immortal; you will be told which type when you are instructed to create a new Character. Mortals are regular human beings or other creatures that die with the passage of time. Immortals, on the other hand, are supernatural beings for whom time has little meaning. They might be other vampires, angels or demons, ghosts, scientific experiments gone wrong, forgotten deities, underground lurkers, meddlesome ancestors, invisible shamblers, softly-spoken animated corpses, household gods or sprites, disembodied heads enduring cursed existences under bell jars, or anything else suitably bizarre.`,`Occasionally, you will realize that a Mortal must have died of old age. This might happen every four or five Prompts. When it does, strike out the Character’s name. Outside of this, Characters cannot be killed unless a Prompt tells you to do so, but you can otherwise narrate about them as you would like.`]},{heading:`Marks`,paras:[`A Mark is a visible indication of your vampire’s undying state or any other thing that sets them apart from mortal people. An ever-bleeding wound on the throat, eyes that are blank and white, a trailing specter, a ferocious scar, a hollow abdomen full of rats. A Mark is something your vampire carries for their entire existence. When creating a Mark, consider whether your vampire conceals it, and how.`,`Example Marks include: a pair of great bat wings—I cut them off with a saw but the stubs remain; my eyes are hypnotic so I must wear smoked glasses; a dark halo I cover with tall military hats; under the Moon my shadow takes the shape of a jaguar; animals fear me, children cry; I can become a wolf or a rat; I have hands with the fingers bent into backward claws, I wear long sleeves to cover them from view.`]},{heading:`Sidebar: what is a vampire?`,paras:[`The vampire is the character you will follow through the narrative. How they manifest their vampiric nature is up to you, but Thousand Year Old Vampire makes several assumptions. To get the best experience out of this game system, your vampire…`,`…should prey on human beings for sustenance;`,`…should seek to camouflage themselves among those on which they feed;`,`…should have been a human once, and still have human needs in one sense or another;`,`…should be susceptible to environmental dangers that regular mortals might not care about, such as sunlight;`,`…should be practically immortal;`,`…should be mostly a loner.`,`The Prompts in Thousand Year Old Vampire are not necessarily geared toward complex political machinations between factions of immortal beings.`]}]},{id:`create`,title:`Creating your vampire`,icon:`🕯️`,sections:[{paras:[`Start by imagining a person in the distant past—a Roman emperor, a Mesopotamian midwife, a French knight. This person will become your vampire. Imagine when and where they were born and who they were in life. Start a Memory with one Experience that encapsulates their history. For instance: “I am Henri, son of Jon, born near the Loire Valley in the 13th Century of Our Lord; I am a poor knight swindled out of my inheritance.”`,`This first Experience is a little different than most Experiences, in that it’s a broad summary of the vampire’s life before becoming an undead thing. This Experience will be slotted into the character record’s first Memory.`,`Next, create at least three Mortals and add them to the vampire’s record sheet. These Mortals will have a relationship with your vampire—relatives, friends and lovers, enemies, mentors, debtors, or anything else appropriate for the time and place you have chosen. Describe each Character in a few words. Know that these Characters can and should be very important, but will not be around for long.`,`Give your vampire-to-be three Skills fitting for their lot in life, and three Resources they obtained while still mortal. Remember, Resources can be almost anything. Big or small, a Resource is a Resource whether it’s an obsidian knife or a fleet of warships.`,`Then, create three more Experiences—with one Experience each being entered into a separate Memory. Each of these Experiences should combine two of your vampire’s traits. If your vampire has the Longship Bøkesuden as a Resource and the Character Gundar, a Viking jarl, like a father to me, you might write an Experience like Gundar takes me on my first voyage aboard the Longship Bøkesuden; his touch calms me when we first leave sight of land.`,`Lastly, create an Immortal. This is the creature that gifted (or cursed) your vampire with unlife. Create a Mark and an Experience that explains how your vampire became a creature of the night. One such Immortal is Baron Hollmueller, an Austrian noble and a vampire; he stole the deed to my land. The corresponding Experience might be: I duel the eerie Baron Hollmueller across the roof of the abbey; he nearly cuts my head from my shoulders but I do not die—which leads to the Mark: my neck is permanently broken, I wear tight scarves and walk slowly to maintain my dignity.`,`Once you have finished with your vampire, they will have three Skills, three Resources, a Mark, at least three Mortals, one Immortal, and one Experience in each of their five Memories.`]}]},{id:`play`,title:`Playing the game`,icon:`🎲`,sections:[{heading:`The flow of play`,paras:[`To play Thousand Year Old Vampire, you answer a series of Prompts. Answer these Prompts to learn about your vampire, experience their travails, and be surprised by their doings. Responding to the Prompts in satisfying ways is the joy of this game.`,`You can answer Prompts either in writing, like a journal, or just aloud to yourself. Number your entries to keep the chronology straight.`,`In the process of answering Prompts, you create, lose, and alter your vampire’s traits as instructed. Every time you answer a Prompt you must create an Experience and add it to a Memory unless instructed otherwise.`]},{heading:`Dice and movement`,paras:[`Roll your d10 and d6, and subtract the result of the d6 from that of the d10. If the result is a positive number, move forward that many Prompts; if it is a negative number, move backward instead. A 0 means you encounter the same Prompt a second time.`,`Let us imagine that I have just answered Prompt 11. I roll 7 on the d10 and 4 on the d6, which means that I move forward three and end up at Prompt 14. However, if I rolled 4 on both dice, I would answer Prompt 11 again.`,`You can’t move backward past Prompt 1. Just encounter 1 again.`]},{heading:`Prompt entries`,paras:[`You will notice that Prompts have second and third entries. These are encountered the second and third times you land on a Prompt.`,`When you land on a Prompt resolve the first entry; if you land on it again resolve the next entry for that Prompt, each entry being labelled a, b, or c. If you’ve landed on a Prompt three times and encountered all three entries, skip to the next Prompt.`]},{heading:`Skill and Resource substitutions`,paras:[`If you are instructed to check a Skill but have no unchecked Skills available, lose a Resource instead. Likewise, if you cannot lose a Resource when instructed to do so, check a Skill. When either of these substitutions occurs it indicates that things have gone very badly for your vampire. Narrate the worst possible outcome. Only Skills and Resources may be substituted for each other. You may not choose to lose Characters, Memories, or Marks in place of a Skill or Resource.`]},{heading:`The game ends…`,paras:[`…if you are unable to check or lose a Skill or Resource when required to do so, or`,`…if a Prompt tells you that the game has ended.`,`If you must lose a Skill or Resource and you have none, then your game is over—narrate your vampire’s demise using the Prompt for inspiration.`]}]},{id:`styles`,title:`Two styles of play`,icon:`✍️`,sections:[{heading:`Quick game`,paras:[`There are two ways to play Thousand Year Old Vampire: as a Quick Game or a Journaling Game.`,`In a Quick Game, answer the Prompts entirely in the Memory area of your character record. This method is fast and satisfying and gives you greater flexibility in interpreting your vampire’s story.`]},{heading:`Journaling game`,paras:[`In the Journaling Game, you keep a diary. Answer the Prompts in writing, dedicating a short paragraph or so to each question. You will end up with a document that you can look back at later. In addition to a journal entry, you must still add an Experience for each Prompt.`,`In the case of any contradictions or complications, your Memories and Experiences take precedence over the detail of your journal entries. As you play, you will come to understand aspects of the story that may not have been clear earlier on. You can modify or ignore earlier journal entries if needed, but you may never modify Memories unless instructed to do so by a Prompt!`]},{heading:`Answering Prompts`,paras:[`Answer Prompts in a way that feels natural. Never force things. If relationships between existing Traits or past events relate to a Prompt, work them in. You do not need to answer every question in the Prompt.`,`Prompts will often combine to tell stories. If a helpful Character was introduced in one Prompt and the following Prompt has the vampire acquire a new Resource, find the relationship between them. Any amount of time can pass between Prompts, so several Prompts might join together to make a story arc that lasts days or decades.`,`Cede control to the game. Prompts are sparks for creativity and connection. Feel free to gently reinterpret answers to earlier Prompts to better make sense of current situations. But you should not try to tie everything together, it’s not necessary. Your vampire will live for a thousand years, and many small, unresolved events will occur during their existence. Sometimes a Character will appear and then leave the game without accomplishing anything of note, or a Resource will go unused, both of which are fine—that’s just how life, or un-life, is.`,`Overthinking is unhelpful. Not every Prompt needs to be important. You do not need to explain every decision you make while answering a Prompt. You can let some of it wait until later. Let the game bring back what matters.`,`Be uncomfortable. Your protagonist is a vampire, even if you try to keep them decent and humane. Terrible and delicious things are going to happen. You should have moments of discomfort as Prompts combine with constrained resources to result in your vampire murdering loved ones and performing strange deeds. This is a strength of the game, so let darkness fall where it may.`,`Prompts are opportunities to learn about history and the real world. Turn to Wikipedia and read about the different types of Turkish nobility if you need to.`,`The game will wait.`]},{heading:`The passage of time`,paras:[`This game is about the grind of centuries. Your vampire will lose their very memories to the passage of years and must pursue continuous reinvention to keep up with the evolution of society around them. Time is very loose, so imagine its progression as you like. Think about historical events and work them in when it feels right; world wars and political upheavals are hugely important events, even for vampires.`,`For general guidance, consider the first seven or eight Prompts you answer to be the first busy years after your character becomes a vampire. Everyone they know is still alive and the world is still the world of their mortal life. By contrast, their final Experiences might take place in the early 21st century.`,`Don’t fret about specific years, but do watch for obvious breaks in the timeline. A series of Prompts might interrelate to tell a small story, only for something to interrupt that story. Take the opportunity to jump a few decades ahead. However, if you reach a game-ending Prompt and it’s only the Fifteenth Century, that’s fine too.`]}]},{id:`overview`,title:`The Prompts: a quick review`,icon:`📜`,sections:[{paras:[`Start at Prompt 1 on the next page;`,`Subtract a d6 from a d10 and move that many Prompts;`,`A positive number moves you forward;`,`A negative number moves you backward;`,`You can’t move backward past Prompt 1. Just encounter 1 again;`,`A zero keeps you in the same place;`,`When you land on a Prompt resolve the first entry;`,`If you land on a Prompt again you resolve the next entry for that Prompt, each entry being labelled a, b, or c;`,`If you’ve landed on a Prompt three times and encountered all three entries, skip to the next Prompt.`]}]},{id:`example`,title:`Examples of play`,icon:`🎭`,sections:[{heading:`Example one`,paras:[`I think I want to create a vampire in early Eastern Europe, so I look up names and choose Ada. Next, I decide Ada is a Slav living in the region that will later become Poland. I start her first Memory with one Experience that encapsulates Ada’s existence up to this point: I am Ada, a Slavic woman living on the edge of the wild Tatra Mountains.`,`I choose some Traits for Ada.`,`Characters: Piotr, a shepherd boy who tends my flocks; Róża, my elderly mother, she lives in my homestead; Hania, my neighbor, a friend and enemy.`,`Skills: Gentle Butcher, Beermaking, Hill Wanderer.`,`Resources: Ornate Walking Staff, Large Flock of Sheep, Sack of Silver Coins.`,`Then I combine these Traits to create three new Memories, each containing one Experience.`,`All day, Mother Róża sits quietly by the beer vat; she says it sings sweet songs to her, and she carves what she hears onto a magnificent ash walking stick.`,`Piotr was orphaned during a bandit raid; I hold his family’s silver coin until he comes of age—in the meantime he works with the sheep.`,`Hania complains when I walk my sheep through the stream, but she never says no to the mutton I gift her.`,`Next I create another Character: the vampire who will cast Ada into unlife, along with a Mark and a Memory related to this.`,`Character: Vyri, a stick-thin thing that lives in a cave.`,`Memory: Wandering through the hills, I hear someone crying for help; it is a trick by the demon Vyri, who drinks my blood then casts me into a mountain stream to die—Hania and her husband pull me from the water hours later, thinking me dead.`,`Mark: Skin like ice; I am careful not to touch anyone.`,`I now have a vampire composed of three Skills, three Resources, one Mark, and five Memories made up of one Experience each. I’m ready for Ada to start encountering Prompts.`,`I roll a d10 and a d6, subtracting the latter from the former. I get an 8 and a 3: 8 minus 3 is 5. Starting at Prompt 1, I count forward five Prompts to Prompt 6: “A mortal Character begins serving you. Who are they? Why are they drawn to you? Create a new mortal Character.”`,`Let’s see… The first thing that comes to mind is pretty wild. I create Josse, an astronomer of the French court. I need to write an Experience about him and attach it to one of Ada’s Memories. To the second Memory, the one about Piotr, I add: These same bandits bring me Josse, a ragged wanderer who tells me in halting Polish that he foresaw my rise to mystic power in the stars and has been searching for me for five years; he installs himself in an outbuilding and makes intricate masks out of river clay.`,`One sentence answers are the limit, even if they get stretchy.`]},{heading:`Example two`,paras:[`Soo-ae is a Korean-born vampire who we find in 1855 living on a whaling station in Greenland. Soo-ae is currently at Prompt 56 and they have had many, many things happen during their long existence; all five of their Memories are full, containing three Experiences each.`,`Rolling a 1, Soo-ae progresses to Prompt 57: “Your knowledge of old things becomes a strength. Based on a checked Skill what knowledge do you share with contemporary mortals? Check a Skill. Create a Resource.”`,`Oh, neat! I think that Soo-ae’s time in Britain in the service of Queen Eltilda the Brave, hundreds of years ago, gave them insight into complex issues of inheritance and title. They have the checked Skill Sea Lawyer, which relates closely enough.`,`Soo-ae only has two unchecked Skills: Biting Wit and Sled Dog Trainer. Dang, this is tough. I strike out Biting Wit and start to write an Experience.`,`That’s when I realize Soo-ae’s five Memory slots are all full up with three Experiences each, and their Diary is also full with four Memories containing three Experiences each. I strike out a Memory from Soo-ae’s Diary about traveling the Silk Road with their father five hundred years ago and move one of their current Memories into the book. Soo-ae no longer has any Memories relating to their time before becoming a vampire.`,`In the newly freed Memory slot I write: I become a correspondent with the London magazine Punch; my barbed poems about the histories of prominent families reveal that I know much, and they are soon hiring me to both share secrets and keep them.`,`Lastly, I take the Resource A Fat London Bank Account.`]}]}],Ym={class:`fade-in max-w-3xl mx-auto`},Xm={class:`flex items-center justify-between mb-6`},Zm={class:`title-serif text-2xl gold-text m-0`},Qm={class:`space-y-3`},$m=[`onClick`],eh={class:`text-xl`},th={class:`flex-1 title-serif text-lg text-parchment`},nh={class:`text-amber-400/70 text-sm`},rh={key:0,class:`px-5 py-4 fade-in`},ih={key:0,class:`title-serif text-base gold-text mb-2`},ah={class:`space-y-3`},oh={class:`text-center text-xs opacity-40 mt-8`},sh=B({__name:`TutorialView`,emits:[`navigate`],setup(e,{emit:t}){let n=t,r=X(()=>Gs.value===`zh`?qm:Jm),i=I(`intro`);function a(e){i.value=i.value===e?null:e}return(e,t)=>(U(),W(`div`,Ym,[K(`div`,Xm,[K(`h2`,Zm,j(L(
