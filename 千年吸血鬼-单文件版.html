`},{type:`degradeResource`}]}]},{number:3,entries:[{text:`一位亲人发现了你的状况，并努力帮助你。创建一个代表他们帮助的资源。如果没有可用的凡人角色，请创造一个。`,effects:[{type:`gainResource`},{type:`createMortal`}]},{text:`你操纵这个凡人为你犯下可怕的罪行。当他们畏惧这些可怕任务时，你会怎么做？获得技能人类是工具。`,effects:[{type:`gainSkillNamed`,skill:`人类是工具`}]},{text:`在凡人的生命结束时，你将他们转化成了无意识的肉体机器，一个由你供养的不死物件。你对此有什么遗憾？把角色改为资源。勾选一个技能。`,effects:[{type:`characterToResource`},{type:`checkSkill`}]}]},{number:4,entries:[{text:`你暴露了，逃向邻近地区。失去所有固定资源。勾选一项技能。有一个凡人和你一起逃跑。在这些陌生人中，你取什么新名字？`,effects:[{type:`checkSkill`},{type:`loseAllFixedResources`}]},{text:`你被吸收进了一个奇怪的密教，他们不顾（或因为）你的外来者身份接纳了你。勾选一项技能并创建一项资源：秘密阴谋集团。他们是怎么找到你的？你经历了什么邪恶的入会仪式？他们知道你的真实身份吗？`,effects:[{type:`checkSkill`},{type:`gainResourceNamed`,resource:`秘密阴谋集团`}]},{text:`在你不知情的情况下，秘密阴谋集团进行了一次黑暗仪式，将一个凡人角色变成可怕、非人且不朽的存在。将一个凡人角色转换为敌对的不朽者。这个新的不朽者追求哪些异类目标？该阴谋集团是否曾操纵你参与这种创造活动？这如何改变你与该组织的关系？`,effects:[{type:`mortalToHostileImmortal`}]}]},{number:5,entries:[{text:`你杀死了一个你所爱或尊敬的人，而不是让他们揭露你。杀死一个角色。勾选一项技能。如果没有活着的角色，就不要杀任何人，而是创造一个被你背叛的心爱的凡人角色。`,effects:[{type:`checkSkill`},{type:`killCharacter`},{type:`createMortal`}]},{text:`一个被你伤害过的角色在梦中来到你面前。他们是诅咒还是原谅你？得到一个印记。`,effects:[{type:`gainMark`}]},{text:`隐藏在你灵魂中的爱促使你踏上愚蠢的赎罪之旅，以弥补巨大的负罪感。你尝试纠正什么错误？这如何失败并导致一切变得更糟？失去一项资源。勾选一项技能。`,effects:[{type:`checkSkill`},{type:`loseResource`}]}]},{number:6,entries:[{text:`一个凡人角色开始为你服务。他是谁？他为什么被你吸引？创造一个新的凡人角色。`,effects:[{type:`createMortal`}]},{text:`一个信任的凡人角色以令人惊讶的方式背叛了你。失去一项资源。他们为什么这样做？你为什么原谅他们？`,effects:[{type:`loseResource`}]},{text:`一个凡人角色为了拯救你而牺牲自己。勾选一项技能。获得与爱或信任相关的技能。`,effects:[{type:`checkSkill`},{type:`gainSkill`}]}]},{number:7,entries:[{text:`你的身体展现出创造你的吸血鬼相关特征。你如何变得更像他们？创建一个反映这一点的技能。`,effects:[{type:`gainSkill`}]},{text:`人们在你身上看到你无法感知的恐怖。你拥有什么你自己不知道的印记？创建一个印记和一个见过它的可疑凡人。在你背后，人们用什么来称呼你？`,effects:[{type:`gainMark`},{type:`createMortal`}]},{text:`通过与铁与火的不懈努力，你去除了一枚印记。记录一次痛苦和流血的经历。你责怪谁？你可以移除一项印记或用更糟糕的一项替换现有的印记。`,effects:[{type:`loseMark`}]}]},{number:8,entries:[{text:`另一个像你一样的生物认出了你是吸血鬼。创造一个不朽者角色，失去一项资源并获得一项技能。你对他们失去了什么？`,effects:[{type:`gainSkill`},{type:`loseResource`},{type:`createImmortal`}]},{text:`你对于一个不朽者角色取得了优势。从他们那里得到了什么？学到了什么？将一段记忆转化为技能：划掉该记忆。获得一项神秘学资源。`,effects:[{type:`memoryToSkill`},{type:`gainResource`}]},{text:`被你激怒的角色拥有强大的盟友。创造一个新的敌对不朽者角色，他是困扰你的这个神秘团体的代表。勾选一个技能以逃脱他们的掌控。获得技能该离开了。移居至遥远地区并失去任何固定资源。取个新名字。`,effects:[{type:`gainSkillNamed`,skill:`该离开了`},{type:`checkSkill`},{type:`loseAllFixedResources`},{type:`createImmortalHostile`}]}]},{number:9,entries:[{text:`你开发了一个系统来喂养你自己。这是什么？那些去世的人会怎样？创造一个反映这一情况的技能。`,effects:[{type:`gainSkill`}]},{text:`你不仅饮用他们的血液，还从你的受害者那里获利！你如何安排这一切？为了保护这个系统，你犯下了什么暴行？勾选一项技能，创建一项资源。`,effects:[{type:`checkSkill`},{type:`gainResource`}]},{text:`另一个角色篡夺并改进了你的喂养系统。你是否爬回到逐出者面前，乞求重新加入？如果是这样，那么获得技能匍匐在地。如果你选择重新从头建立新的喂养系统，则勾选两项技能并获得一项资源。`,effects:[{type:`gainSkillNamed`,skill:`匍匐在地`},{type:`checkSkill2`},{type:`gainResource`}]}]},{number:10,entries:[{text:`夜空中的星辰在你头顶旋转。四季如梭。你如同一个自动装置，对数十年的流逝毫无知觉。一个世纪过去了。划掉一个记忆，划掉所有凡人角色。`,effects:[{type:`loseMemory`},{type:`killAllMortals`}]},{text:`一件强大的神器，无论是宗教、魔法或技术的，都落入你的手中。有了它，你可以重塑世界。这是什么东西？谁在寻找它？创造一个凡人角色，将此物品添加为资源。如果在达成任何游戏结局结果时依然拥有它，你可以随意改写结局。如果与不朽角色的遭遇中失去了一项资源，必须首先失去这件物品。`,effects:[{type:`note`,text:`神器规则：在资源面板把此物标记为「神器」。此后与不朽者遭遇失去资源时，必须首先失去这件物品；若达成结局时仍持有它，可以改写结局。`},{type:`createMortal`},{type:`gainResource`}]},{text:`在摆弄这件神器时，你不小心引发了末日到来。恶魔崛起，天使坠落，灵魂显现。人类的人口被征用于一场将持续几个世纪并决定宇宙命运的战争之中。在适合你故事至今进展的情境下创建一个代表超自然冲突显现的角色或资源。创建两个不朽者角色，他们分别站在冲突的两边，现在对你的吸血鬼感兴趣。`,effects:[{type:`createImmortal`},{type:`createImmortal`},{type:`createCharacter`},{type:`gainResource`}]}]},{number:11,entries:[{text:`你如何从内心的强烈饥饿中找到慰藉？你可能会失去一项已勾选或未勾选的技能。`,effects:[{type:`loseSkill`}]},{text:`你发现了一种内在的专注力，让你能够控制自己的吸血鬼本性。失去一段暴力的记忆，获得技能“我控制那野兽”，并将任何未勾选的技能重写为新技能。你会取什么新名字来与过去的自己保持距离？这个名字有什么象征意义？`,effects:[{type:`loseMemory`},{type:`gainSkillNamed`,skill:`“我控制那野兽”`},{type:`rewriteSkill`}]},{text:`你的控制崩溃了。你吞食、杀戮、沉迷于鲜血。你就是饥渴本身。当你享用你最亲密的友好角色（凡人或不朽者）时，他们的临终遗言是什么？将一段被爱的记忆改为一段谎言，其中你为了保护自己而杀戮。创造一项技能，以嘲讽的方式提到一个死去角色的名字。`,effects:[{type:`editMemory`},{type:`gainSkill`}]}]},{number:12,entries:[{text:`新的法律或社会习俗让你更难隐藏在人群中。你是如何差点被抓获并被消灭的？勾选一项技能。创建一项技能。创建一个协助你的凡人罪犯。`,effects:[{type:`checkSkill`},{type:`gainSkill`},{type:`createMortal`}]},{text:`通过横跨多代人的努力，你可以改变社会法律使之对你有利。你如何让领导者屈服于你的意愿？你会改变什么？创建一项资源。`,effects:[{type:`gainResource`}]},{text:`一个凡人门徒超越了你。他比你更聪明、更残忍、更有能力。他把你关在地牢里——他们用你做什么？创造一个邪恶的凡人角色。`,effects:[{type:`createMortal`}]}]},{number:13,entries:[{text:`同一家族的几代人为你服务。这条血脉从任何活着的凡人角色开始，或从死去凡人角色的后代开始。他们为自己的服务制定了哪些奇怪的仪式？失去一项资源并创建一个仆从家族资源。`,effects:[{type:`loseResource`},{type:`gainResource`}]},{text:`你的仆人数量众多，热情高涨，但有时却毫无用处。根据记忆创建一项技能，这是你用来控制他们的技能。`,effects:[{type:`gainSkill`}]},{text:`你的仆人给你带来了一个你不想要的礼物。创建一个有问题的资源。`,effects:[{type:`gainResource`}]}]},{number:14,entries:[{text:`敌方角色利用一项失去的资源让你的几个朋友背叛你。勾选三项技能来重新获得资源，或者勾选一项技能勉强活下来。你杀了哪位前朋友？你逃到哪里去？`,effects:[{type:`checkSkill3`},{type:`checkSkill`}]},{text:`你出生的时代和地点与你现在所处的时代和地点截然不同。为了在这个陌生的世界中生存，你必须放弃哪些价值观？根据你最近的记忆创建一个合适的当代技能。你最近使用什么新名字？`,effects:[{type:`gainSkill`}]},{text:`你如何才能在这个地方取得领导地位？你通过战争和暴力征服了哪些邻居或民众？获得你从一个只想要和平的人那里夺走的资源。`,effects:[{type:`gainResource`}]}]},{number:15,entries:[{text:`在旅途中，你与另一个不朽者发生冲突。获得一项印记。对方是谁？你对他使了什么花招？创建一个新的不朽角色。`,effects:[{type:`gainMark`},{type:`createImmortal`}]},{text:`不朽者比他们表面上看起来的要强大得多。勾选一项技能，或者会失去一项资源或一段记忆。获得一项资源或技能。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`loseMemory`},{type:`gainResource`},{type:`gainSkill`}]},{text:`人类社会如何因受到像你这样的不朽者的干预而发生巨大变化？谁从中受益？你失去了什么资源？获得一项资源、技能或印记。`,effects:[{type:`loseResource`},{type:`gainResource`},{type:`gainSkill`},{type:`gainMark`}]}]},{number:16,entries:[{text:`一些凡人联合起来追捕你，他们装备精良，并且了解你的花招。你该如何击败或躲避他们？创建一个与你勾选的技能之一相关的凡人猎人。勾选一项技能。`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`猎人们执着、能干、见多识广。他们知道你不知道的事情——创造一个在对抗中显露的印记。你被迫躲藏在一片无人居住的荒地中。失去所有固定资源。学习与这片荒凉地区相关的新技能。孤独中你会想到什么新名字？`,effects:[{type:`loseAllFixedResources`},{type:`gainMark`},{type:`gainSkill`}]},{text:`重返文明世界后，你对猎人们的可怜后代进行了可怕的报复。他们的痛苦将被传唱千年。历史学家将其视为邪恶的标杆。创建一个凡人角色，他原本无辜而善良，直到你向他们索取代价。不要实际写下你对这些人的所作所为。`,effects:[{type:`createMortal`}]}]},{number:17,entries:[{text:`你犯下了卑鄙的谋杀罪，但不是为了满足食欲。为什么？勾选一项技能。如果你愿意，可以删除一个凡人角色。`,effects:[{type:`checkSkill`},{type:`deleteCharacter`}]},{text:`你因犯罪而被追捕。勾选一项技能，失去一项资源。向任何角色坦白你的罪行。将敌人变成朋友或将朋友变成敌人。如果你必须创建一个角色，你们成为恋人。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`createCharacter`},{type:`changeAllegiance`}]},{text:`你与一个心爱的角色决斗，如果没有，就创建一个。勾选一个暴力技能或适当的资源，通过杀死他们来获胜，或者获得一个印记并逃往他乡。`,effects:[{type:`checkSkill`},{type:`killCharacter`},{type:`gainMark`}]}]},{number:18,entries:[{text:`你在一个地方吃得太久了，摧毁了一个社区或社会群体。他们是谁？最后一个社区成员是怎么死的？获得一项拾荒得来的资源，失去一项资源。`,effects:[{type:`loseResource`},{type:`gainResource`}]},{text:`一个社区弃儿幸存下来，并发誓要对你进行报复。你是怎么认识他们的？他们怎么知道在你最脆弱的时候抓住你？创建一个一心想毁灭你的凡人角色。`,effects:[{type:`createMortal`}]},{text:`你被赶出了这片土地。失去所有固定资源。勾选一项技能以逃脱，两项技能以消灭迫害者，三项技能以弥补过失。`,effects:[{type:`checkSkill`},{type:`checkSkill2`},{type:`checkSkill3`},{type:`loseAllFixedResources`}]}]},{number:19,entries:[{text:`两个友好角色卷入了一场内讧。参与其中并勾选一项技能。如果需要，可创建最多两个角色。你如何从中获利？获得一项资源。`,effects:[{type:`checkSkill`},{type:`gainResource`},{type:`createCharacter`}]},{text:`当你的朋友互相争斗时，你却在暗中谋划。操纵冲突来摧毁任意角色。`,effects:[{type:`killCharacter`}]},{text:`战斗太多，流血太多。你扮演和事佬的角色，试图结束昔日好友之间的冲突，但他们却背叛了你。失去一项资源。获得一项印记。`,effects:[{type:`loseResource`},{type:`gainMark`}]}]},{number:20,entries:[{text:`社会运输货物的方式发生了巨大变化。这对你有什么好处？勾选一项技能。根据记忆创建一项技能。`,effects:[{type:`gainSkill`},{type:`checkSkill`}]},{text:`你的吸血鬼状态使你能够操纵多代人，利用他们为自己谋利。创建一个固定的资源和一个象征财富和权力的奢华资源。`,effects:[{type:`gainFixedResource`},{type:`gainResource`}]},{text:`靠投资和租金生活会让你变得懒惰，削弱了你的狩猎优势。勾选一项残忍或贪婪的技能，失去一项与创造力或努力相关的已勾选技能。获得一项你并非真正挣来的固定资源。`,effects:[{type:`checkSkill`},{type:`loseSkill`},{type:`gainFixedResource`}]}]},{number:21,entries:[{text:`当太阳升起时，你被困在外面，躲在一个你未曾预料的地方。一个孩子发现了你并与你成为朋友。创建一个凡人儿童角色并记录一次人性化的经历。`,effects:[{type:`createMortal`}]},{text:`孩子会教你重新欣赏这个世界。你看到生活中的美好。基于愉快的记忆创造一项技能。`,effects:[{type:`gainSkill`}]},{text:`几十年过去了。孩子已经因年老而死。你站在他们的坟墓旁。你还能做些什么来让他们的生活变得更好？你是如何背叛他们的？庄重地划掉这个角色。`,effects:[{type:`dieByAge`}]}]},{number:22,entries:[{text:`创造一个凡人角色。你从婴儿时期就把他们塑造成你想要的样子。失去一项资源。`,effects:[{type:`loseResource`},{type:`createMortal`}]},{text:`你的日记丢失或被盗。丢失日记及其包含的所有记忆。如果你没有日记，则丢失一项资源。创建一个被你错误地将此损失归咎于他的角色。`,effects:[{type:`note`,text:`若拥有日记：日记丢失，其中包含的记忆全部划掉（若无日记则失去一项资源）`},{type:`loseResource`},{type:`createCharacter`}]},{text:`你成为一个沉浸在当下的孤独者，操纵着一百根线以求温饱和安全。永久失去一个记忆槽。获得技能野性狡诈。`,effects:[{type:`loseMemorySlot`},{type:`gainSkillNamed`,skill:`野性狡诈`}]}]},{number:23,entries:[{text:`你掌握了一门奇怪的新科学或知识领域。你的吸血鬼本性如何让你对这些研究有特别的见解？根据记忆创建适当的技能。`,effects:[{type:`gainSkill`}]},{text:`你开始了长期的通信联系并坠入爱河。创建一个凡人角色。通过放弃一项资源来接近他们，或者扼杀爱情并失去一段记忆。`,effects:[{type:`createMortal`},{type:`loseResource`},{type:`loseMemory`}]},{text:`除非你勾选一项技能，否则你的凡人爱人会因另一个角色的阴谋而死亡。如果你确实拯救了他，他会改为死于疾病、事故或年老。无论哪种方式，你都会保留一个印记来记住他们。创建一项资源。`,effects:[{type:`checkSkill`},{type:`gainResource`}]}]},{number:24,entries:[{text:`你被迫习惯一个新名字。为什么？`,effects:[]},{text:`删除任意两段记忆的第一句话。你不太确定为什么。不要为此创建一个经历。`,effects:[{type:`removeMemorySentence`}]},{text:`所有地方对你来说都一个样，你不再回家了。失去一项固定资源。你在哪里漂泊？`,effects:[{type:`loseFixedResource`}]}]},{number:25,entries:[{text:`你猎取受害者的方法不再有效。发生了什么变化？失去一项资源并创建一项描述你的新猎食技巧的技能。`,effects:[{type:`loseResource`},{type:`gainSkill`}]},{text:`要利用这种方法，需要付出哪些体力劳动？创造一个简单实用的技能，并划掉一段记忆。`,effects:[{type:`gainSkill`},{type:`loseMemory`}]},{text:`一个凡人角色发现了你的觅食系统。他们会用什么令人信服的理由让你放弃它？勾选一项技能。`,effects:[{type:`checkSkill`}]}]},{number:26,entries:[{text:`你因为吸血不当而意外创造了一个吸血鬼。从现有的凡人角色中创造一个不朽者角色。你为什么不消灭他？勾选一项技能。`,effects:[{type:`checkSkill`},{type:`createImmortal`},{type:`mortalToImmortal`}]},{text:`这个不朽者角色潜伏在你生活的边缘。他们成为你最不受欢迎的一项已勾选技能的化身。当你们相遇时，他们会如何行动？他们会给你什么令人不安的礼物？创建一项资源。`,effects:[{type:`gainResource`}]},{text:`这个不朽者角色落入了凡人的手中，间接危及你的生存。通过勾选三个技能来拯救他。如果不拯救他，你将失去三项资源。如果你无法失去所有三项资源，那就尽可能多地失去它们，然后逃到一个新的地方——从现在起，所有人类都知道吸血鬼是真实存在的。`,effects:[{type:`loseResource3`},{type:`checkSkill3`}]}]},{number:27,entries:[{text:`你所居住的地区战火纷飞。你躲进一个隐蔽的避难所，等待战火过去。失去一项资源。`,effects:[{type:`loseResource`}]},{text:`你隐秘的行事方式导致你被当作间谍逮捕。勾选一项技能以逃脱或失去一项资源并从对你进行的实验中获得一项印记。不管怎样，创造一个领导组织的凡人，该组织资金充足并对像你这样的生物构成威胁。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`gainMark`}]},{text:`你成为了一名间谍，出卖你曾称之为家园的土地。获得两项资源。勾选一项技能，获得一项技能，取消勾选一项古老而令人惊讶的技能。哪个角色因你的行为而受苦并死亡？`,effects:[{type:`gainTwoResources`},{type:`checkSkill`},{type:`gainSkill`},{type:`uncheckSkill`}]}]},{number:28,entries:[{text:`一个死去已久的凡人角色归来。他们想从你这里得到什么？他们是如何逃过死亡的？只有当你仍然拥有相关记忆时才能认出他们。勾选一项技能。`,effects:[{type:`checkSkill`}]},{text:`他们会给你带来什么危险？创建一个新的敌人角色，可以是凡人或不朽者。勾选一项技能或失去一项资源。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`createCharacter`}]},{text:`你不断被强大的超自然生物追捕。描述你为避免被发现而开发的方法。失去一段记忆以获得一项技能或资源，或者不失去记忆并创造一个凡人仆从。`,effects:[{type:`loseMemory`},{type:`gainSkill`},{type:`gainResource`},{type:`createMortal`}]}]},{number:29,entries:[{text:`你被揭露为怪物并逃往遥远的土地。失去所有固定资源。你不懂这个新地方的语言——你如何克服这个障碍？你取了什么新名字？`,effects:[{type:`loseAllFixedResources`}]},{text:`你用一个全新的身份伪装自己。选择一个旧记忆并对其进行修改，使其变得现代而平淡。创建基于这一混合的技能。`,effects:[{type:`editMemory`},{type:`gainSkill`}]},{text:`你迷失在假装的个性中。失去你最古老和最新的记忆。扔掉你的日记。创造一项与新生活相关的技能和资源。`,effects:[{type:`loseTwoMemories`},{type:`destroyResource`},{type:`gainSkill`},{type:`gainResource`}]}]},{number:30,entries:[{text:`你忘记了哪些社会习俗？失去一项已勾选的技能。`,effects:[{type:`loseCheckedSkill`}]},{text:`你感受到一种被周围凡人的传统所禁止的爱。创建一个新角色。失去一项资源。`,effects:[{type:`createCharacter`},{type:`loseResource`}]},{text:`你将重塑自我以及与世界的关系。取消勾选一项技能。`,effects:[{type:`uncheckSkill`}]}]},{number:31,entries:[{text:`你陷入了长达一百年的沉睡。划掉所有凡人角色。`,effects:[{type:`killAllMortals`}]},{text:`你认出了你记忆中出现的某个已故凡人的后代，并感到有必要与他们结识。你如何在不暴露自己怪物本性的情况下分享有关他们祖先的知识？这次谈话为何尴尬？这次谈话有多尴尬？获得一个当代且意想不到的技能。创建一个凡人角色，一个新朋友。`,effects:[{type:`createMortal`},{type:`gainSkill`}]},{text:`你的凡人朋友发现了家族文件，揭露了你的真面目。你们的关系会如何变化？你可以恢复与凡人祖先有关的被遗忘的记忆。`,effects:[{type:`restoreMemory`}]}]},{number:32,entries:[{text:`你关押了一名囚犯。为什么是这个人？你为什么不吃掉他？创建一个与关押该囚犯有关的角色和技能。`,effects:[{type:`createCharacter`},{type:`gainSkill`}]},{text:`凡人救出了你的囚犯。创建两个凡人救援者。失去一项资源。`,effects:[{type:`createMortal`},{type:`createMortal`},{type:`loseResource`}]},{text:`你的囚犯回到了你身边，但有他们自己的条件。这种奇怪的新关系是什么样的？`,effects:[]}]},{number:33,entries:[{text:`你知道旧东西在哪里。创建一项资源并将一个敌人角色变成朋友。`,effects:[{type:`gainResource`},{type:`changeAllegiance`}]},{text:`你出版一本书或以其他方式巩固一段记忆（无论是当前的还是来自你的日记的），这样它就永远不会丢失。在记忆旁边画一个星号来表示这一点，并更改记忆以使其稍微不那么有趣。此记忆永远无法再更改或删除。它也不再占用记忆槽。`,effects:[{type:`stabilizeMemory`}]},{text:`凡人世界发生了大规模的权力转移——政府垮台，战争爆发，新秩序建立。谁从中受益？勾选一项技能。犯下暴行以获得与控制无辜人民相关的资源。获得一项技能并加入胜利方或勾选两项技能。`,effects:[{type:`checkSkill`},{type:`checkSkill2`},{type:`gainSkill`},{type:`gainResource`}]}]},{number:34,entries:[{text:`你在毫无意义的愤怒中摧毁了对你来说很重要的东西。失去一段珍贵的记忆或摧毁一项资源。`,effects:[{type:`loseMemory`},{type:`destroyResource`}]},{text:`你的狂怒甚至让你自己感到恐惧。你是学会控制它，还是选择拥抱这种恐怖？如果有一个凡人角色，就杀死他，如果没有，则创建一项印记。`,effects:[{type:`killCharacter`},{type:`gainMark`}]},{text:`你撕掉脸上的每一块皮肤，试图抹去残留的人性。创建一项印记。今后你该如何掩盖自己的毁容？`,effects:[{type:`gainMark`}]}]},{number:35,entries:[{text:`你遇到了一个宿敌的后代，并以某种方式帮助他们。你为什么要这么做？勾选一项技能。创建一个凡人角色。`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`为了报答你的恩情，他们会猛烈攻击那些他们认为是你的敌人的人。一个角色被杀死了。`,effects:[{type:`killCharacter`}]},{text:`这个凡人正处于极度危险之中。勾选一项技能或损失一项资源来拯救他，否则他会死得很惨。`,effects:[{type:`checkSkill`},{type:`loseResource`}]}]},{number:36,entries:[{text:`你的谎言甚至会骗过你自己。结合任意三个特征来编造出一段你信以为真的经历。`,effects:[]},{text:`因为这段虚假的记忆而惩罚某人。你杀死或致残一个角色。勾选一项技能。获得技能我知道什么是真的。`,effects:[{type:`gainSkillNamed`,skill:`我知道什么是真的`},{type:`checkSkill`},{type:`killCharacter`}]},{text:`你的一段真实记忆原来是完全虚构的，如同由蛛网编织的狂热梦境。彻底抹去一段记忆。`,effects:[{type:`loseMemory`}]}]},{number:37,entries:[{text:`万物化为尘土。失去一个你没有相应记忆的资源。不要为这个提示创建新的经历，它只是在你沉默凝视时发生。`,effects:[{type:`loseResource`}]},{text:`你有一种来源不明的习惯。失去一项你没有相应记忆的未勾选技能。`,effects:[{type:`loseSkill`}]},{text:`你思想僵化，沉溺于已有习惯。你差点被一个多年来一直在研究你的行为模式的敌人抓住。破坏一项资源并将其重塑为新的令人惊讶的东西。`,effects:[{type:`destroyResource`},{type:`gainResource`}]}]},{number:38,entries:[{text:`你的整个身心都集中在你的感官和饥渴上。创建一项展现你野性吸血鬼本性的技能，并失去一段现有的记忆。`,effects:[{type:`gainSkill`},{type:`loseMemory`}]},{text:`你的动作与人类不同，他们会无意识地察觉到这一点。创建一项印记。`,effects:[{type:`gainMark`}]},{text:`你总能找到脆弱、无力、易受伤害的人。使用技能淘汰弱者。不要直视强者的眼睛——他们不适合你。`,effects:[]}]},{number:39,entries:[{text:`岁月侵蚀了你的日记。从日记中最早的记忆开始，划掉三个名词。如果你没有日记，就对中年时期记忆中的前三个名词进行同样的操作。`,effects:[]},{text:`你为破旧的日记制作了一份新副本。在最近的日记记忆中，将两个动词互换。如果你没有日记，就在你最新的记忆中划掉三个动词。`,effects:[]},{text:`查找之前用来玩该游戏的角色记录。将一段记忆与该角色表中的一段记忆交换。`,effects:[]}]},{number:40,entries:[{text:`你如何在沉睡时隐藏自己？你采取了哪些保护措施？勾选一项技能并创建一项资源。如果愿意，可以创建一个凡人仆人角色。`,effects:[{type:`checkSkill`},{type:`gainResource`},{type:`createMortal`}]},{text:`一位你不认识的超自然人物向你走来。他们带你踏上一段奇异的旅程，然后以精神慰藉作为交换，要求你做出一个可怕的承诺。他们要求什么？你会接受吗？如果你接受，获得一项技能。`,effects:[{type:`gainSkill`}]},{text:`那些存在于视线之外的强大生物已被揭示于你，从此一切都将不同。让这个奇异的世界深刻影响你游戏的其余部分。获得技能观察入微。`,effects:[{type:`gainSkillNamed`,skill:`观察入微`}]}]},{number:41,entries:[{text:`你的身体远离人类的关注。失去一个记忆槽。抹去你现存最早的名字。`,effects:[{type:`loseMemorySlot`}]},{text:`一些早已被遗忘的社会习俗或禁忌深深地刻在你的心中。那是什么？它如何阻碍你在社会中的行动？创建一项印记。`,effects:[{type:`gainMark`}]},{text:`一个幽灵缠绕着你，尽管你不知道它是真实的还是疯狂的表现。将一个早已死去的角色作为幽灵带回来。`,effects:[{type:`returnGhost`}]}]},{number:42,entries:[{text:`由于你的吸血鬼本性，你无法与哪种现代技术互动？你在第一次接触这种技术时几乎被摧毁的经历是怎样的？勾选一项技能。`,effects:[{type:`checkSkill`}]},{text:`你结识了一群对你拥有的某种资源感兴趣的凡人。这是一个俱乐部吗？他们是朋友吗？创建三个凡人角色。发展出一项与对应资源相关的技能。`,effects:[{type:`createMortal`},{type:`createMortal`},{type:`createMortal`},{type:`gainSkill`}]},{text:`几十年过去了。你依然永葆青春，而你的朋友们却慢慢枯萎：你必须离开，否则会被发现是怪物。站在外面的黑暗中，看着他们一边笑一边讲述他们多么想念你的故事。`,effects:[]}]},{number:43,entries:[{text:`尽管你努力融入，但你的作风却很古板。根据已勾选的技能创建一项资源来反映这一点。`,effects:[{type:`gainResource`}]},{text:`在两个记忆之间交换专有名词。不要为此创建经历。`,effects:[{type:`swapProperNouns`}]},{text:`检查你拥有的一项资源会引发一段被遗忘的记忆。那个资源曾属于另一个角色，但你已经忘记了这一点。通过回忆起这段记忆来深入了解你自己的历史。将这段被遗忘的经历写入你的记忆或直接写入日记。注意，你是在创建一个新的“被遗忘”的经历，而不是恢复一段已被删除的记忆。`,effects:[{type:`resourceToMemory`}]}]},{number:44,entries:[{text:`你曾经遇到过的一位不朽者角色回来索债。是什么债？他们有什么变化？你愿意还债吗？如果你有和这个角色有关的记忆，你会失去两项资源，如果没有，则失去三项资源并勾选一项技能。`,effects:[{type:`note`,text:`条件分支：若你拥有与这位不朽者相关的记忆 → 失去两项资源；否则 → 失去三项资源并勾选一项技能。`},{type:`checkSkill`},{type:`loseResource3`},{type:`loseResource2`}]},{text:`他们做了什么让你陷入最深沉的绝望？抹去你最早的记忆。你永远无法找回它。获得一项技能。`,effects:[{type:`loseMemory`},{type:`gainSkill`}]},{text:`你制定计划并以无情的效率执行，给这个不朽者角色带来死亡和毁灭。你可以收回他们拿走的资源，也可以摧毁它们。勾选一项技能。`,effects:[{type:`checkSkill`}]}]},{number:45,entries:[{text:`你的身体正在经历进一步的腐化和变化。你什么时候第一次注意到这些新的变化？创建一项印记。`,effects:[{type:`gainMark`}]},{text:`你的身体变得越来越不像人类，但同时也变得更加高效。根据你的一项印记创建一项技能。`,effects:[{type:`gainSkill`}]},{text:`你在一个某种程度上被社会排斥的凡人群体中找到了陪伴。他们知道你是吸血鬼吗？他们会在意吗？创建两个友好的凡人角色，每个角色都与一个你的印记有关。`,effects:[{type:`createMortal`},{type:`createMortal`}]}]},{number:46,entries:[{text:`你暴露了，逃往遥远的土地。将任何固定资源转换为代表便携现金或财宝的新资源。你以什么名字旅行？当你停下来时，你声称自己从事什么职业？`,effects:[{type:`convertFixedResources`}]},{text:`你再次逃亡，这次是逃往遥远的飞地或殖民地。你如何利用殖民统治为自己谋利？获得一项技能：占领者、叛乱者、不显眼的人或土著，并选择一个合适的新名字。`,effects:[{type:`gainSkill`}]},{text:`革命！作为一名可疑的外来者，你被监禁了。通过勾选两项技能以逃脱，或用两项资源贿赂以逃脱。花费额外的资源来拯救任何旅行同伴。`,effects:[{type:`checkSkill2`},{type:`loseResource2`},{type:`loseResource`}]}]},{number:47,entries:[{text:`世界以你无法理解的方式发展，导致你损失了大量财富。发生了什么？勾选一项技能。创建一项技能，希望能以此防止这种情况再次发生。失去一项资源。`,effects:[{type:`gainSkill`},{type:`checkSkill`},{type:`loseResource`}]},{text:`你负责照顾无助的人。创造一项技能来帮助你利用他们。从一段快乐的记忆中衍生出来。`,effects:[{type:`gainSkill`}]},{text:`你对其中一名受害者的斗志印象深刻。他们做了什么？他们如何让你想起你最早的记忆？他们活下来了吗？创建一个凡人角色。`,effects:[{type:`createMortal`}]}]},{number:48,entries:[{text:`你满身尘土的醒来。几代人过去了。你的沉眠之地已被封锁。你该如何逃脱？失去一项资源。划掉所有凡人角色。`,effects:[{type:`loseResource`},{type:`killAllMortals`}]},{text:`你以为已经死去的凡人不知为何却依然活着。太神奇了！带回一个最近被划掉的凡人角色。`,effects:[{type:`reviveCharacter`}]},{text:`在漫长的梦境中，你发现了一条通往现实之外的土地的道路，那是一个充满巨大恐惧和绝美风景的奇幻之地。你可以抛弃这个地球，去往无人能及的地方：留下所有角色、印记和资源，除了一把银剑，然后返回提示10。从那里继续前进，成为梦境中一个没有印记的吸血鬼。如果你第二次抵达该提示，你就会醒来，并且永远无法返回。如果你不前往这个梦境之地，你可以获得资源：一本奇幻梦境的手写书。`,effects:[{type:`dreamWorld`},{type:`gainResourceNamed`,resource:`一本奇幻梦境的手写书`}]}]},{number:49,entries:[{text:`什么简单而实用的技能对你奇特的生活非常有用？你是如何学会它的？创建一项技能。`,effects:[{type:`gainSkill`}]},{text:`你是如何成为一名普通劳动者的？哪一项之前勾选过的技能让他们接受了你？那个充满友情的夜晚是什么样的？创建一个凡人角色。勾选一项技能。`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`你的新朋友将成为你食物的来源。创建一项反映这一点的资源。`,effects:[{type:`gainResource`}]}]},{number:50,entries:[{text:`你被困在一个为掠夺成性的凡人（predatory mortals）设下的陷阱中。你被当成哪种罪犯了？这次经历如何帮助你学会更好地捕食凡人？创建一项让美好记忆变质的新技能。`,effects:[{type:`gainSkill`}]},{text:`你几乎已经暴露，必须彻底改变你的猎食模式。成为社会最低阶层的一员并失去一项资源。如果你已经是最低层人民，请改为成为最高阶层的一员并勾选一项技能。`,effects:[{type:`checkSkill`},{type:`loseResource`}]},{text:`你与掠夺成性的凡人交往。创造一个令人厌恶的凡人角色成为你的同伙。连你也害怕他。为什么？`,effects:[{type:`createMortal`}]}]},{number:51,entries:[{text:`当你过于饥饿时，你会变成一个没有智慧的猎食生物。从你的记忆列表中间的记忆里随机失去一段经历。`,effects:[{type:`loseMemoryRandom`}]},{text:`你在某种非人类的事物中找到了陪伴。是动物，还是某种无生命的东西？你如何与它互动？你是如何找到它的，还是它找到了你？创建一个角色或资源来代表这个伙伴。`,effects:[{type:`createCharacter`},{type:`gainResource`}]},{text:`万物皆有终结，但显然这人没有。一个你深爱的凡人角色永不衰老。这是魔法吗？还是某种感染？他们仍然算作凡人角色，但他们永远不会因年老而死`,effects:[{type:`note`,text:`该凡人角色永不因年老而死（仍算作凡人角色）`}]}]},{number:52,entries:[{text:`黎明之美在召唤你。创建一个专注于美丽、自然或和平的额外记忆槽。`,effects:[{type:`gainMemorySlot`}]},{text:`你停留得足够久，听到了晨鸟歌声的结束。你被太阳灼伤了——创建一项印记。`,effects:[{type:`gainMark`}]},{text:`伸展双臂，感受温暖。光线穿过你的眼睑，而你没有被火焰吞噬。阳光（或其他环境条件）不再伤害你。创建一项关于自由的技能。`,effects:[{type:`gainSkill`}]}]},{number:53,entries:[{text:`你信任的凡人角色，或他们的后代之一，领导着一支猎人小队。他们用哪些你分享的秘密来对付你？勾选一项技能。`,effects:[{type:`checkSkill`}]},{text:`你已经可以任意处置那个制造麻烦的角色了。记录一次宽恕的经历。`,effects:[]},{text:`他们再次背叛你并逃跑。失去一项资源或获得一项印记毁容。`,effects:[{type:`loseResource`},{type:`gainMark`}]}]},{number:54,entries:[{text:`你奇怪的口音和老套的作风总是让你显得格格不入，最好的情况下是被嘲笑和欺骗，最坏的情况下是被憎恨。通过将一段旧记忆转化为一项新技能来掩盖这些无用的特征，以便融入其中。`,effects:[{type:`memoryToSkill`}]},{text:`你的旧记忆正在改变，以反映你在当下需要的态度。改变一段记忆以融入不合时宜的现代元素。不要为此创建新的经历。`,effects:[{type:`editMemory`}]},{text:`丢弃一个已有一百多年历史的资源。`,effects:[{type:`destroyResource`}]}]},{number:55,entries:[{text:`永恒的内省在创造性行为中体现出来。根据一段失去的记忆获得一项创造性的技能。`,effects:[{type:`gainSkill`}]},{text:`你献身于一门艺术。失去一项资源，但找回一段失去的记忆。`,effects:[{type:`loseResource`},{type:`restoreMemory`}]},{text:`你因自己的艺术而声名鹊起，但却不得不隐于阴影。沮丧地摧毁一项资源。获得一项技能。`,effects:[{type:`destroyResource`},{type:`gainSkill`}]}]},{number:56,entries:[{text:`你开始建造一座让周围凡人困惑不已的奇妙建筑。只透露一点它的用途。失去一项资源并获得技能远见。`,effects:[{type:`gainSkillNamed`,skill:`远见`},{type:`loseResource`}]},{text:`凡人试图阻止你实现你的愿景。勾选一项技能以坚持下去。你为了保护你的建筑犯下了什么可怕的罪行？`,effects:[{type:`checkSkill`}]},{text:`你已经完成了你的建筑。你为什么要做这个？它有什么用途吗？它会改变世界吗？`,effects:[]}]},{number:57,entries:[{text:`你对古老事物的知识成为一种优势。根据已勾选的技能，你与当代凡人分享了哪些知识？勾选一项技能。创建一项资源。`,effects:[{type:`checkSkill`},{type:`gainResource`}]},{text:`哪些人类会向你寻求知识？你给予他们什么？你又拿走了什么？创建一个比你更聪明、更有能力的凡人角色。获得一项资源。`,effects:[{type:`createMortal`},{type:`gainResource`}]},{text:`你被带到了你最早犯下的罪行之一的现场。谁带你来这里？为什么？你还记得吗？勾选一项技能。如果你不具有这起罪行的记忆，你会想起它。`,effects:[{type:`checkSkill`}]}]},{number:58,entries:[{text:`社会已经变了。旅行对你来说变得如何更容易？恢复任何你仍有一段记忆的固定资源，它们会重新添加到你的资源列表中。`,effects:[{type:`retrieveResource`}]},{text:`在这些古老的地方游荡会发掘出什么记忆？找回与固定资源相关的丢失的记忆，或者获取一项你在这里隐藏的新宝藏资源。`,effects:[{type:`restoreMemory`},{type:`gainResource`}]},{text:`这里为你设下了什么可怕的陷阱？失去一项资源，获得一项印记。`,effects:[{type:`loseResource`},{type:`gainMark`}]}]},{number:59,entries:[{text:`一个凡人发现了一个早已死去角色的日记，或者你自己遗失的日记，并接近你。他们在寻找什么？获得一项技能或资源。创建一个凡人角色。`,effects:[{type:`gainSkill`},{type:`gainResource`},{type:`createMortal`}]},{text:`凡人伤害、羞辱或揭发了你。在你徒劳无功地追逐他们中勾选一项技能。失去一项资源。`,effects:[{type:`checkSkill`},{type:`loseResource`}]},{text:`凡人对禁忌知识的渴望导致超自然恐怖降临于世。这是最终会毁灭世界的巨大怪物，还是一个专门针对你的个人恐怖？创建一个或多个不朽角色。`,effects:[{type:`createImmortal`}]}]},{number:60,entries:[{text:`勾选一项技能以避免作为罪犯被逮捕。发生了什么？谁代替你被捕了？如有必要，创建一个凡人角色。`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`创建一个无辜的凡人角色。他们因你犯下的罪行而被处死。在他们被处死的那天晚上，你在摆弄什么爱好？获得技能这不关我的事。`,effects:[{type:`gainSkillNamed`,skill:`这不关我的事`},{type:`createMortal`},{type:`killCharacter`}]},{text:`一整个阶层的人因你犯下的罪行而被指责。获得技能总有替罪羊。谁在替你受苦？创建一个代表这些人的友好角色，他们对你的共犯行为一无所知。创建另一个有权力的角色：他们知道这些人是无辜的，但并不在意。`,effects:[{type:`gainSkillNamed`,skill:`总有替罪羊`},{type:`createCharacter`},{type:`createCharacter`}]}]},{number:61,entries:[{text:`某人让你想起了一位早已去世的挚爱角色。勾选一项技能来讨好他们的熟人。创建一个凡人角色。`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`你经常将活着的凡人与死去的角色混淆。获得印记我到处都能看到[死去的角色]。`,effects:[{type:`gainMark`}]},{text:`你的身体已经衰老。一项印记变为失能。你必须寻求凡人的帮助。创建一个特别能帮助你的凡人角色。`,effects:[{type:`crippleMark`},{type:`createMortal`}]}]},{number:62,entries:[{text:`你意识到你长期以来所相信的某个古老禁忌或限制不再适用。是什么情况促使你发现了这一点？这如何让你的生活更令人满意？以适当的方式更改一项已勾选或未勾选的技能。`,effects:[{type:`changeSkill`}]},{text:`你发现自己曾经很强大的地方现在却变得很弱了。岁月从你身上夺走了什么？是什么导致了这种情况？失去一项已勾选的技能。`,effects:[{type:`loseCheckedSkill`}]},{text:`你受了伤，无法行动。若无人帮助，你会自行恢复，但好心人把你送到了医院。你醒来后意识到自己已经被人发现了。创建一个角色：一个惊恐万分的凡人医务人员，他完全了解你是什么东西。`,effects:[{type:`createCharacter`}]}]},{number:63,entries:[{text:`你如何满足自己平庸的物质需求？记录一次这方面出错的经历。勾选一项技能。`,effects:[{type:`checkSkill`}]},{text:`你如何避免被政府盯上？根据记忆创建一项技能。`,effects:[{type:`gainSkill`}]},{text:`你如何欺骗自己认为你为社会提供了有价值的服务？获得技能寄生虫。`,effects:[{type:`gainSkillNamed`,skill:`寄生虫`}]}]},{number:64,entries:[{text:`大量人类正在世界各地迁徙。哪些群体变得容易被捕食？你如何利用他们的无助？创建一项资源。`,effects:[{type:`gainResource`}]},{text:`你操纵社会领袖，让一群人更加容易成为你吸血的目标。你围绕这些受害者建立了什么系统？勾选一项技能，从记忆中创建一项相关技能。创建一个角色，这个角色是那些抵抗你阴谋之人的核心。`,effects:[{type:`checkSkill`},{type:`gainSkill`},{type:`createCharacter`}]},{text:`社会在全球范围内崩溃，数个世纪内都无法恢复。数百万人挨饿，政府解散，城市燃烧，街头发生谋杀。你如何利用混乱？勾选一项技能。创建两种新资源。创建一项技能。在这个可怕的时代，哪个角色能崛起成为全球领导者？`,effects:[{type:`gainSkill`},{type:`checkSkill`},{type:`gainTwoResources`}]}]},{number:65,entries:[{text:`一件物品被证明具有古董的经济价值。用你最古老的资源换取两项当代的资源。`,effects:[{type:`note`,text:`换入的是两项当代资源：划掉最古老的资源，创造两件新的资源。`},{type:`swapResource`}]},{text:`你对已放弃或丢失的资源感到非常后悔。尽一切努力将其找回。失去两项资源或勾选两项技能并找回一项失去的资源。`,effects:[{type:`checkSkill2`},{type:`loseResource2`},{type:`retrieveResource`}]},{text:`物体是短暂的。一切都是虚无。扔掉你最古老或最珍贵的资源。`,effects:[{type:`destroyResource`}]}]},{number:66,entries:[{text:`你的知识已经过时了。失去一项未勾选的技能，现在它已经没用了。`,effects:[{type:`loseUncheckedSkill`}]},{text:`我们的价值观已经过时了。失去一项资源。`,effects:[{type:`loseResource`}]},{text:`你是如此的古老，以至于不再像一个当前时代的人。创建一个反映这一点的印记。你是如何意识到你的身体不再适合现在的？`,effects:[{type:`gainMark`}]}]},{number:67,entries:[{text:`语言本身将你抛在身后。人们用你无法理解的工具讨论你无法掌握的概念。这个问题是如何显著表现出来的？创造一个角色，他会教你一项技能，以帮助你抵消这种劣势。`,effects:[{type:`createCharacter`},{type:`gainSkill`}]},{text:`新的通信形式提供了新的狩猎方法。修改一段旧记忆，以包含这种现代通信技术的不合时宜的使用。勾选一项技能，创建一项技能。`,effects:[{type:`editMemory`},{type:`checkSkill`},{type:`gainSkill`}]},{text:`语言已发展成超出你理解的东西。你可以调用凡人会以特定方式反应的音素结构，但你无法再分享实际的想法、感受或抽象的概念。创建一项表达这一点的技能。`,effects:[{type:`gainSkill`}]}]},{number:68,entries:[{text:`一件与你的凡人生活直接相关的古物浮出水面。勾选一项技能或失去一项资源，并将古物作为一项资源获得，然后重新获得你最早的记忆中的一项。记录一段获得古物的经历。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`gainResource`},{type:`restoreMemory`}]},{text:`因为这件古物，有人开始追捕你。创建一个凡人角色。他们是如何差点揭露你的？勾选一项技能或失去一项资源。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`createMortal`}]},{text:`凡人角色猎手将你逼入绝境。你化身为你勾选过的技能之一来击败他们。获得一项印记。`,effects:[{type:`gainMark`}]}]},{number:69,entries:[{text:`你与一个古老的敌人角色因共同的过去而建立联系，在其中找到比现代世界更易理解的东西。勾选一项技能。你们成为朋友。分享一项资源并获得对方与你分享的一项资源。`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`gainResource`}]},{text:`你和朋友躲进一个隐蔽的地方。在那里，你们几个世纪以来第一次分享真正的快乐。创建一项关于爱与安全的技能。`,effects:[{type:`gainSkill`}]},{text:`你和朋友想出了一个绝妙的计划，并付诸实施。勾选一项技能。计划是什么？你要征服世界吗？让死者复活吗？如果合适，你可以现在结束游戏。`,effects:[{type:`checkSkill`}]}]},{number:70,entries:[{text:`凡人是残忍的，他们行事的方式超出你的理解范围。你是如何被嘲笑或受害的？为什么你的反应无效且代价高昂？勾选一项技能。`,effects:[{type:`checkSkill`}]},{text:`一个重要的记忆因你接触当代社会的心理诡计而受到污染。修改记忆以使其不那么特别。失去一项未勾选的反社会技能。`,effects:[{type:`editMemory`},{type:`loseUncheckedSkill`}]},{text:`失去一段记忆。记录一个由对当代声望物品的渴望驱动的经历。失去两项资源，获得一项有声望的资源。`,effects:[{type:`loseMemory`},{type:`loseResource2`},{type:`gainResource`}]}]},{number:71,entries:[{text:`一个不朽者角色被凡人摧毁了。你是怎么知道这件事的？你失去了什么？根据记忆创建一项技能。必要时创建一个不朽者角色。`,effects:[{type:`gainSkill`},{type:`createImmortal`}]},{text:`你是如何无意中对这起谋杀案负责的？你获得了什么微小的好处？获得一项资源。`,effects:[{type:`gainResource`}]},{text:`创建一段关于不朽角色的虚假经历，这帮助你平静地接受与他们有关的记忆。`,effects:[]}]},{number:72,entries:[{text:`你在外面被抓住并被摧毁了。发生了什么？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:73,entries:[{text:`你达到了绝对稳定的状态，可以维持不变，直至太阳消亡。这意味着什么？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:74,entries:[{text:`你被困在一个永远无法获救的地方。你在最初的一千年里会想些什么？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:75,entries:[{text:`一个老朋友或老敌人在你睡梦中谋杀了你。在梦境与虚无之间的那几秒钟里，你看到了什么？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:76,entries:[{text:`政府抓获了你，知道了你的真面目。他们会对你做什么？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:77,entries:[{text:`你的身体终于疲惫不堪。你无法继续猎食。这会发生什么？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:78,entries:[{text:`像你这样的生物已经占领了地球。你在这个新世界中的地位是什么？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:79,entries:[{text:`你发现了一种成为凡人的方法。你会接受吗？这会有什么问题？游戏结束。`,effects:[{type:`gameOver`}]}]},{number:80,entries:[{text:`你将自身提升到更高层次。这意味着什么？游戏结束。`,effects:[{type:`gameOver`}]}]}]},vs={meta:{name:`Thousand Year Old Vampire — official Prompts (English)`,source:`TextOnly export of the official English rulebook (Tim Hutchings); effects aligned to the audited Chinese pack`,language:`en`,promptCount:80,sourceSha256:`0d7d8a57b31ef44b269d89700b04ac1f91415c4b9707870e604fdd894f8f6d62`},prompts:[{number:1,entries:[{text:`In your blood-hunger, you destroy someone close to you. Kill a mortal Character. Create a mortal if none are available. Take the skill Bloodthirsty.`,effects:[{type:`gainSkillNamed`,skill:`Bloodthirsty`},{type:`createMortal`},{type:`killCharacter`}]},{text:`You are overcome by panic and maul someone close to you, accidentally turning them into a monster like yourself. Convert a beloved mortal Character into an enemy immortal. Take the Skill Ashamed.`,effects:[{type:`gainSkillNamed`,skill:`Ashamed`},{type:`mortalToHostileImmortal`}]},{text:`You are captured and enslaved by a wicked and powerful supernatural entity. Create an immortal Character. How do you eventually escape their servitude? Check a Skill and take the Skill Humans are Cattle. Strikeout all mortal Characters, as a hundred years, have passed. Take a Resource you have used for evil while in service to your former master.`,effects:[{type:`createImmortal`},{type:`checkSkill`},{type:`gainSkillNamed`,skill:`Humans are Cattle`},{type:`killAllMortals`},{type:`gainResource`}]}]},{number:2,entries:[{text:`Horrified at your new nature, you withdraw from society. Where do you hide? How do you feed? Create a stationary Resource which shelters you`,effects:[{type:`gainFixedResource`}]},{text:`You reinvent your existence around the seclusion of your hiding place. You begin to work in an artful way, changing your living environment. How do you come to appreciate beauty or craft in a new way? Create a Skill based on a Memory.`,effects:[{type:`gainSkill`}]},{text:`Your hiding place is destroyed by mortals. What steps had you taken to ensure your survival? What revenge do you wreak upon your persecutors? Degrade a Resource into ruins. Take the Skill Vile Acts.`,effects:[{type:`gainSkillNamed`,skill:`Vile Acts`},{type:`degradeResource`}]}]},{number:3,entries:[{text:`A loved one discovers your condition and works to help you. Create a Resource which represents their assistance. Create a mortal Character if none are available.`,effects:[{type:`gainResource`},{type:`createMortal`}]},{text:`You manipulate this mortal into committing atrocious deeds on your behalf. What do you do when they quail at these awful tasks? Take the Skill Humans are Tools.`,effects:[{type:`gainSkillNamed`,skill:`Humans are Tools`}]},{text:`At the end of the mortal’s life you convert them into a mindless meat machine, an undying thing from which you feed. What regrets do you have? Change the Character to a Resource. Check a Skill.`,effects:[{type:`characterToResource`},{type:`checkSkill`}]}]},{number:4,entries:[{text:`You are exposed and flee to a neighboring region. Lose any stationary Resources. Check a Skill. A mortal flees with you. What new name do you adopt among these strangers?`,effects:[{type:`checkSkill`},{type:`loseAllFixedResources`}]},{text:`You are adopted into a strange cult who take you in despite(or because of) your outlander origin. Check a Skill and create a Resource, The Secret Cabal. How did they find you? What vile initiation ceremony do you undergo? Do they know what you are?`,effects:[{type:`checkSkill`},{type:`gainResourceNamed`,resource:`The Secret Cabal`}]},{text:`The Secret Cabal, without your knowledge, performs a dark ceremony that changes a mortal Character into a horrific, alien, and immortal thing. Convert a mortal Character into an immortal enemy. What alien objectives does this new immortal pursue? Did the Cabal manipulate you into helping with this creation? How does this change your relationship with the Cabal?`,effects:[{type:`mortalToHostileImmortal`}]}]},{number:5,entries:[{text:`You murder someone you love or respect rather than let them expose you. Kill a Character. Check a Skill. If you have no living Characters, kill no one, and create a beloved mortal Character who you have betrayed.`,effects:[{type:`checkSkill`},{type:`killCharacter`},{type:`createMortal`}]},{text:`A Character you’ve victimized comes to you in a dream. Do they curse or forgive you? Receive a Mark.`,effects:[{type:`gainMark`}]},{text:`Love hidden within your soul propels you on a foolish quest for absolution from some great guilt. What wrong did you try to right? How do you fail and make everything much, much worse? Lose a Resource. Check a Skill.`,effects:[{type:`checkSkill`},{type:`loseResource`}]}]},{number:6,entries:[{text:`A mortal Character begins serving you. Who are they? Why are they drawn to you? Create a new mortal Character.`,effects:[{type:`createMortal`}]},{text:`A trusted mortal Character betrays you in a surprising way. Lose a Resource. Why did they do this? Why do you forgive them?`,effects:[{type:`loseResource`}]},{text:`A mortal Character sacrifices themselves to save you. Check a Skill. Gain a Skill relevant to love or trust.`,effects:[{type:`checkSkill`},{type:`gainSkill`}]}]},{number:7,entries:[{text:`Your body manifests a trait related to the vampire that created you. How do you become more like them? Create a Skill that reflects this.`,effects:[{type:`gainSkill`}]},{text:`People see a horror in you that you cannot perceive in yourself. What Mark do you possess that you do not know about? Create a Mark and a suspicious mortal who has seen it. What name do the people call you when your back is turned?`,effects:[{type:`gainMark`},{type:`createMortal`}]},{text:`Through grim work with iron and fire, you remove a Mark. Record an Experience of pain and blood. Who do you blame? You may remove a Mark or replace an existing Mark with something worse.`,effects:[{type:`loseMark`}]}]},{number:8,entries:[{text:`You are recognized for what you are by another creature like yourself. Create an immortal Character, lose a Resource, and gain a Skill. What did you lose to them?`,effects:[{type:`gainSkill`},{type:`loseResource`},{type:`createImmortal`}]},{text:`You gain an advantage over an immortal Character. What do you take from them? What do you learn? Convert a Memory to a Skill; strikeout that Memory. Gain a mysterious Resource.`,effects:[{type:`memoryToSkill`},{type:`gainResource`}]},{text:`A Character you’ve angered has powerful allies. Create a new enemy immortal Character who is the face of this mysterious group which harries you. Check a Skill to escape their grasp. Take the Skill Time to Leave. Move to a far-off region and lose any stationary Resources. Take a new name.`,effects:[{type:`gainSkillNamed`,skill:`Time to Leave`},{type:`checkSkill`},{type:`loseAllFixedResources`},{type:`createImmortalHostile`}]}]},{number:9,entries:[{text:`You develop a system for feeding. What is it? What happens to those who die? Create a Skill that reflects this.`,effects:[{type:`gainSkill`}]},{text:`You not only drink their blood but financially profit from your victims as well! How do you arrange this? What atrocity do you commit to protect this system? Check a Skill, create a Resource.`,effects:[{type:`checkSkill`},{type:`gainResource`}]},{text:`Another Character usurps your feeding system and improves it. Do you crawl back to your ouster, begging to be let back in? If so, then gain the Skill Belly on the Ground. If you instead build a new feeding system from scratch, check two Skills, and gain one Resource.`,effects:[{type:`gainSkillNamed`,skill:`Belly on the Ground`},{type:`checkSkill2`},{type:`gainResource`}]}]},{number:10,entries:[{text:`The stars pinwheel above you in the night. The seasons are a blur. You are as an automaton, unconscious of the passage of decades. A century passes. Strikeout a Memory. Strikeout all mortal Characters.`,effects:[{type:`loseMemory`},{type:`killAllMortals`}]},{text:`A potent artifact, religious or magical or technological, falls into your hands. With it, you can remake the world. What is this thing? Who seeks it? Create a mortal Character. Add the item as a Resource. If you still have it when you achieve any game-ending result, you may rewrite the ending as you like. You must lose this item first if you lose Resources in an encounter with an immortal Character.`,effects:[{type:`note`,text:`Artifact rule: mark this object as an Artifact in the Resource panel. From now on, whenever you lose a Resource through an encounter with an immortal, this item must be lost first; if you still hold it when an ending is reached, you may rewrite that ending.`},{type:`createMortal`},{type:`gainResource`}]},{text:`While fiddling with the artifact you accidentally bring about the end times. Devils rise, angels fall, spirits are made manifest. Human populations are levied in a war which will last centuries and decide the fate of the cosmos itself. Create a Character or Resource that represents the manifestation of a supernatural conflict that fits your story up to this point. Create two immortal Characters aligned with either side of the conflict who are now interested in your Vampire.`,effects:[{type:`createImmortal`},{type:`createImmortal`},{type:`createCharacter`},{type:`gainResource`}]}]},{number:11,entries:[{text:`How do you find solace from the raging hunger within you? You may lose one checked or unchecked Skill.`,effects:[{type:`loseSkill`}]},{text:`You discover an internal focus which lets you maintain control of your vampire self. Lose a violent Memory and take the Skill I Control the Beast and rewrite any unchecked Skill as something new. What new name do you take to distance yourself from what you once were? How is the name symbolic?`,effects:[{type:`loseMemory`},{type:`gainSkillNamed`,skill:`I Control the Beast and rewrite any unchecked Skill as something new`},{type:`rewriteSkill`}]},{text:`Your control breaks. You slaver and kill and revel in blood. You are your hunger. What were the last words of your closest friendly Character, mortal or immortal, as you feasted upon them? Change a beloved Memory to a lie in which you murder to protect yourself. Create a Skill that invokes the name of a dead Character in a mocking way.`,effects:[{type:`editMemory`},{type:`gainSkill`}]}]},{number:12,entries:[{text:`New laws or social mores make it harder for you to hide among the populace. How are you nearly caught and destroyed? Check a Skill. Create a Skill. Create a mortal criminal who assists you.`,effects:[{type:`checkSkill`},{type:`gainSkill`},{type:`createMortal`}]},{text:`Working across generations you change the laws of society to your advantage. How do you bend leaders to your will? What do you change? Create a Resource.`,effects:[{type:`gainResource`}]},{text:`A mortal protégé outstrips you. They are smarter, crueler, and more capable than you can ever be. They lock you in a dungeon—for what purpose do they use you? Create a wicked mortal Character.`,effects:[{type:`createMortal`}]}]},{number:13,entries:[{text:`Generations of the same family serve you. This line starts from any living mortal Character, or from the descendants of a dead mortal Character. What bizarre rituals do they tie to their servitude? Lose a Resource and create a Servitor of the Lineage Resource.`,effects:[{type:`loseResource`},{type:`gainResource`}]},{text:`Your servants are numerous, enthusiastic, and sometimes useless. Create a Skill based on a Memory, this is the Skill you use to control them.`,effects:[{type:`gainSkill`}]},{text:`Your servants bring you a gift you do not want. Create a problematic Resource.`,effects:[{type:`gainResource`}]}]},{number:14,entries:[{text:`An enemy Character uses a lost Resource to turn your few friends against you. Check three Skills to regain the Resource, or check one Skill to barely survive. Which former friend did you kill? Where do you flee?`,effects:[{type:`checkSkill3`},{type:`checkSkill`}]},{text:`You were born in a time and place much different than that in which you find yourself now. What values must you set aside to survive in this strange world? Create an appropriate contemporary Skill based on your most recent Memory. What new name have you recently adopted?`,effects:[{type:`gainSkill`}]},{text:`How do you rise to a position of leadership in this place? What neighbors or populations do you subjugate through war and violence? Gain a Resource you took from someone who wanted nothing but peace.`,effects:[{type:`gainResource`}]}]},{number:15,entries:[{text:`While traveling you come into conflict with another immortal. Gain a Mark. Who are they? What trick did you play upon them? Create a new immortal Character.`,effects:[{type:`gainMark`},{type:`createImmortal`}]},{text:`An immortal proves to be much more than they appear. Check a Skill or else lose a Resource or Memory. Gain a Resource or Skill.`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`loseMemory`},{type:`gainResource`},{type:`gainSkill`}]},{text:`How does human society change drastically due to the meddling of immortals like yourself? Who benefits? What Resource do you lose? Gain one Resource, Skill, or Mark.`,effects:[{type:`loseResource`},{type:`gainResource`},{type:`gainSkill`},{type:`gainMark`}]}]},{number:16,entries:[{text:`Some mortals have banded together to hunt you, well-armed, and wise to your tricks. How do you defeat or evade them? Create a mortal hunter related to one of your checked Skills. Check a Skill.`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`The hunters are persistent, capable, and well-informed. They know things about you that you don’t. Create a Mark that is revealed in a confrontation. You are driven into hiding in an unpeopled wasteland. Lose any stationary Resources. Learn a new Skill related to this desolate region. What new name comes to you in loneliness?`,effects:[{type:`loseAllFixedResources`},{type:`gainMark`},{type:`gainSkill`}]},{text:`Returning to civilization you wreak a terrible vengeance upon the hapless descendants of your harassers. Songs will be sung of their suffering for a thousand years. Historians will use it as a benchmark for evil. Create a mortal Character that was innocent and good until you exacted your toll. Do not actually write down what acts you committed against these people.`,effects:[{type:`createMortal`}]}]},{number:17,entries:[{text:`You commit a despicable murder, but not for the sake of feeding. Why? Check a Skill. Remove a mortal Character, if you like.`,effects:[{type:`checkSkill`},{type:`deleteCharacter`}]},{text:`You are hounded for your crime. Check a Skill, lose a Resource. Confess your crime to any Character. Convert an enemy to a friend or a friend to an enemy. If you must create a Character, you become lovers.`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`createCharacter`},{type:`changeAllegiance`}]},{text:`You fight a duel with a beloved Character, create one if you have none. Check a violent Skill or appropriate Resource and win by killing them, or gain a Mark and flee to another land.`,effects:[{type:`checkSkill`},{type:`killCharacter`},{type:`gainMark`}]}]},{number:18,entries:[{text:`You have fed too long in one place, destroying a community or social group. Who were they? How did the last community member die? Gain a scavenged Resource, lose a Resource.`,effects:[{type:`loseResource`},{type:`gainResource`}]},{text:`A community outcast has survived and vows to revenge themselves upon you. How did you know them? How did they know to catch you at your most vulnerable? Create a mortal Character bent on your destruction.`,effects:[{type:`createMortal`}]},{text:`You are hounded out of the land. Lose any stationary Resources. Check one Skill to escape, two to destroy your persecutor, three to make amends.`,effects:[{type:`checkSkill`},{type:`checkSkill2`},{type:`checkSkill3`},{type:`loseAllFixedResources`}]}]},{number:19,entries:[{text:`Two friendly Characters become embroiled in an internecine conflict. Become involved and check a Skill. Create up to two Characters, if needed. How do you profit? Gain a Resource.`,effects:[{type:`checkSkill`},{type:`gainResource`},{type:`createCharacter`}]},{text:`You scheme while your friends make war on one another. Manipulate the conflict to destroy any Character.`,effects:[{type:`killCharacter`}]},{text:`Too much fighting, too much blood. Acting as peacemaker you try to end the conflict between former friends, but they both turn on you. Lose a Resource. Gain a Mark.`,effects:[{type:`loseResource`},{type:`gainMark`}]}]},{number:20,entries:[{text:`There is a great shift in the way society moves goods. How does this work to your advantage? Check a Skill. Create a Skill based on a Memory.`,effects:[{type:`gainSkill`},{type:`checkSkill`}]},{text:`Your vampiric state enables you to manipulate people across generations, using them to your own advantage. Create one stationary Resource and one ostentatious Resource that symbolizes wealth and power.`,effects:[{type:`gainFixedResource`},{type:`gainResource`}]},{text:`Living off investments and rents makes you lazy and blunts your hunting edge. Check a Skill that is cruel or grasping, lose a checked Skill related to creativity or effort. Gain a stationary Resource that you didn’t truly earn.`,effects:[{type:`checkSkill`},{type:`loseSkill`},{type:`gainFixedResource`}]}]},{number:21,entries:[{text:`You are trapped outside when the sun rises and take shelter someplace you are not supposed to be. A child discovers and befriends you. Create a mortal child Character and record a humanizing Experience.`,effects:[{type:`createMortal`}]},{text:`The child teaches you to appreciate the world again. You see small things, you smile. Create a Skill based on a pleasant Memory.`,effects:[{type:`gainSkill`}]},{text:`Decades pass. The child has died of old age. You stand at their grave. What more could you have done to make their life better? How did you betray them? Strikeout that Character with great ceremony.`,effects:[{type:`dieByAge`}]}]},{number:22,entries:[{text:`Create a mortal Character. You have shaped them from infancy to be exactly what you want. Lose a Resource.`,effects:[{type:`loseResource`},{type:`createMortal`}]},{text:`Create a mortal Character. You have shaped them from infancy to be exactly what you want. Lose a Resource.`,effects:[{type:`note`,text:`If you have a diary: when the diary is lost, strike out every Memory it holds. If you have no diary, lose a Resource instead.`},{type:`loseResource`},{type:`createCharacter`}]},{text:`You become a loner embedded in the now, manipulating a hundred threads to stay fed and safe. Lose a Memory slot permanently. Take the Skill Feral Cunning.`,effects:[{type:`loseMemorySlot`},{type:`gainSkillNamed`,skill:`Feral Cunning`}]}]},{number:23,entries:[{text:`You master a strange new science or field of knowledge. How does your vampire nature give you special insight into these studies? Create an appropriate Skill based on a Memory.`,effects:[{type:`gainSkill`}]},{text:`You strike up a long correspondence and fall in love. Create a mortal Character. Go to them by giving up a Resource, or smother the love and lose a Memory.`,effects:[{type:`createMortal`},{type:`loseResource`},{type:`loseMemory`}]},{text:`Your mortal love dies through the machinations of another Character unless you check one Skill. If you do save them they will instead die of sickness, or accident, or old age. Either way, you keep a token by which to remember them. Create a Resource.`,effects:[{type:`checkSkill`},{type:`gainResource`}]}]},{number:24,entries:[{text:`You are forced to adopt a new name. Why?`,effects:[]},{text:`Erase the first sentence of any two Memories. You’re not quite sure why. Do not create an Experience about this.`,effects:[{type:`removeMemorySentence`}]},{text:`One place is as another to you, and you simply stop returning home. Lose a stationary Resource. Where do you wander?`,effects:[{type:`loseFixedResource`}]}]},{number:25,entries:[{text:`Your methods for acquiring victims are no longer effective. What has changed? Lose a Resource and create a Skill which describes your new feeding techniques.`,effects:[{type:`loseResource`},{type:`gainSkill`}]},{text:`What physical labors are necessary to utilize this method? Create a simple, practical Skill and strike out a Memory.`,effects:[{type:`gainSkill`},{type:`loseMemory`}]},{text:`A mortal Character discovers your feeding system. What compelling argument do they use to get you to abandon it? Check a Skill.`,effects:[{type:`checkSkill`}]}]},{number:26,entries:[{text:`You accidentally create a vampire through sloppy feeding. Create an immortal Character from an existing mortal Character. Why do you not destroy them? Check a Skill.`,effects:[{type:`checkSkill`},{type:`createImmortal`},{type:`mortalToImmortal`}]},{text:`This immortal Character lurks on the fringes of your existence. They become an embodiment of one of your least savory checked Skills. How do they act when your paths cross? What disturbing gift do they give you? Create a Resource.`,effects:[{type:`gainResource`}]},{text:`This immortal Character falls into the hands of mortals, indirectly imperiling your existence. Save them by checking three Skills. Lose three Resources if you do not save them. If you cannot lose all three Resources, lose as many as possible and flee to a new land. From now on all humans know vampires are real.`,effects:[{type:`loseResource3`},{type:`checkSkill3`}]}]},{number:27,entries:[{text:`Wars rage throughout the region in which you reside. You withdraw into a hidden retreat, waiting for them to pass. Lose a Resource.`,effects:[{type:`loseResource`}]},{text:`Your secretive ways result in you being arrested as a spy. Check a Skill to escape or lose a Resource and gain a Mark from the experiments performed upon you. Either way, create a mortal who heads a well-funded organization that imperils creatures such as yourself.`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`gainMark`}]},{text:`You become a spy, selling out the land you call home. Gain two Resources. Check a Skill, gain a Skill, uncheck an ancient and surprising Skill. Which Character suffers and dies because of your actions?`,effects:[{type:`gainTwoResources`},{type:`checkSkill`},{type:`gainSkill`},{type:`uncheckSkill`}]}]},{number:28,entries:[{text:`A long-dead mortal Character returns. What do they want from you? How have they survived death? You only recognize them if you still have a related Memory. Check a Skill.`,effects:[{type:`checkSkill`}]},{text:`What peril do they pull down upon you? Create a new enemy Character, mortal or immortal. Check a Skill or lose a Resource.`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`createCharacter`}]},{text:`You are ceaselessly hunted by potent, supernatural beings. Describe the methods you develop to avoid detection. Lose a Memory to gain a Skill or Resource, or do not lose a Memory and create a mortal servitor.`,effects:[{type:`loseMemory`},{type:`gainSkill`},{type:`gainResource`},{type:`createMortal`}]}]},{number:29,entries:[{text:`You are exposed as a monster and flee to a far-off land. Lose any stationary Resources. You do not know the language of this new place. How do you overcome this obstacle? What new name do you take?`,effects:[{type:`loseAllFixedResources`}]},{text:`You disguise yourself with an entirely new persona. Take an old Memory and modify it to make it contemporary and bland. Create a Skill based on blending in.`,effects:[{type:`editMemory`},{type:`gainSkill`}]},{text:`You lose yourself in your assumed personality. Lose your oldest and newest Memories. Throw away your Diary. Create a Skill and Resource tied to your new life.`,effects:[{type:`loseTwoMemories`},{type:`destroyResource`},{type:`gainSkill`},{type:`gainResource`}]}]},{number:30,entries:[{text:`What social mores have your forgotten? Lose a checked Skill.`,effects:[{type:`loseCheckedSkill`}]},{text:`You feel a love forbidden by the convention of mortals around you. Create a new Character. Lose a Resource.`,effects:[{type:`createCharacter`},{type:`loseResource`}]},{text:`You reinvent yourself and how you relate to the world. Uncheck a Skill.`,effects:[{type:`uncheckSkill`}]}]},{number:31,entries:[{text:`You fall into a deep slumber for a hundred years. Strikeout any mortal Characters.`,effects:[{type:`killAllMortals`}]},{text:`You recognize the descendant of a dead mortal who features in one of your Memories and feel compelled to make their acquaintance. How do you share knowledge about their ancestor without revealing your monstrous nature? How is this conversation awkward? Gain a contemporary and unexpected Skill. Create a mortal Character, a new friend.`,effects:[{type:`createMortal`},{type:`gainSkill`}]},{text:`Your mortal friend discovers family documents that reveal you for what you are. How does your relationship change? You may regain a forgotten Memory related to the mortal’s ancestor.`,effects:[{type:`restoreMemory`}]}]},{number:32,entries:[{text:`You keep a prisoner. Why this particular person? Why don’t you feed upon them? Create a Character and a Skill related to keeping them captive.`,effects:[{type:`createCharacter`},{type:`gainSkill`}]},{text:`Mortals rescue your prisoner. Create two mortal rescuers. Lose a Resource.`,effects:[{type:`createMortal`},{type:`createMortal`},{type:`loseResource`}]},{text:`Your prisoner returns to you, but on their own terms. What is this strange new relationship?`,effects:[]}]},{number:33,entries:[{text:`You know where the old things are. Create a Resource and make an enemy Character into a friend.`,effects:[{type:`gainResource`},{type:`changeAllegiance`}]},{text:`You publish a book or in some other way cement a Memory (either current or from your Diary) in such a way that it can never be lost. Draw a star next to the Memory to indicate this and change the Memory to make it slightly less interesting. This Memory can never again be changed or struck out. It no longer takes up a Memory slot.`,effects:[{type:`stabilizeMemory`}]},{text:`A massive shift of power happens in the mortal realm. Governments fall, wars are waged, and a new order is created. Who benefits? Check a Skill. Commit atrocious deeds to gain a Resource related to controlling innocent people. Take the Skill Join the Winning Side or instead check two Skills.`,effects:[{type:`checkSkill`},{type:`checkSkill2`},{type:`gainSkill`},{type:`gainResource`}]}]},{number:34,entries:[{text:`You destroy something important to you in a purposeless rage. Lose a precious Memory or destroy a Resource.`,effects:[{type:`loseMemory`},{type:`destroyResource`}]},{text:`Your frenzies terrify even yourself. Do you learn to control them or instead choose to embrace this horror? Kill a mortal Character, if there is one, or create a Mark if not.`,effects:[{type:`killCharacter`},{type:`gainMark`}]},{text:`Pull the very skin from your face in an attempt to expunge yourself of lingering humanity. Create a Mark. How do you cover your disfigurement going forward?`,effects:[{type:`gainMark`}]}]},{number:35,entries:[{text:`You encounter the descendant of an old foe and help them in some way. Why did you do this? Check a Skill. Create a mortal Character.`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`They repay your kindness by lashing out at those they perceive as your enemies. A Character is killed.`,effects:[{type:`killCharacter`}]},{text:`The mortal is in grave peril. Check a Skill or lose a Resource to save them, otherwise, they die a terrible death.`,effects:[{type:`checkSkill`},{type:`loseResource`}]}]},{number:36,entries:[{text:`The deceptions you practice fool even yourself. Combine any three Traits to fabricate an Experience that you believe to be true.`,effects:[]},{text:`Punish someone because of this false Memory. You kill or maim a Character. Check a Skill. Take the Skill I Know What’s Real.`,effects:[{type:`gainSkillNamed`,skill:`I Know What’s Real`},{type:`checkSkill`},{type:`killCharacter`}]},{text:`One of your real Memories turns out to be completely fabricated, a fever dream spun of cobwebs. Completely erase one Memory.`,effects:[{type:`loseMemory`}]}]},{number:37,entries:[{text:`Things fall to dust. Lose a Resource for which you have no corresponding Memory. Do not create a new Experience for this Prompt, it simply happens as you stare in silence.`,effects:[{type:`loseResource`}]},{text:`You are a creature with habits of unknown origin. Lose an unchecked Skill for which you have no corresponding Memory.`,effects:[{type:`loseSkill`}]},{text:`Your thoughts are calcifying, your habits are tyrants. You are nearly captured by an enemy who has been studying your patterns over many years. Break a Resource and remake it into something new and surprising.`,effects:[{type:`destroyResource`},{type:`gainResource`}]}]},{number:38,entries:[{text:`Your whole being becomes centered in your senses and your hunger. Create a Skill that demonstrates your feral vampire nature and lose an existing Memory.`,effects:[{type:`gainSkill`},{type:`loseMemory`}]},{text:`You move differently than humans and they unconsciously sense it. Create a Mark.`,effects:[{type:`gainMark`}]},{text:`You can always find the frail, the weak, the vulnerable. Take the Skill Cull the Herd. Do not meet the eyes of the strong. They are not for you.`,effects:[]}]},{number:39,entries:[{text:`Age has damaged your Diary. Strikeout three nouns from the Memories in your Diary, starting from the oldest entry. If you have no Diary, do this to the first three nouns in a Memory of middling age.`,effects:[]},{text:`You make a new copy of your crumbling Diary. In your most recent Diary Memory, swap two verbs each for the other. If you have no Diary strike out three verbs in your most recent Memories.`,effects:[]},{text:`Find a character record from an earlier playthrough of this game. Swap a Memory for one from that character sheet.`,effects:[]}]},{number:40,entries:[{text:`How do you conceal yourself while you sleep? What steps have you taken for protection? Check a Skill and create a Resource. Create a mortal servant Character, if you like.`,effects:[{type:`checkSkill`},{type:`gainResource`},{type:`createMortal`}]},{text:`You are approached by a supernatural Character unknown to you. They take you on a bizarre journey, then offer you spiritual solace in exchange for a terrible pledge. What do they demand? Will you accept? If you accept, gain a Skill.`,effects:[{type:`gainSkill`}]},{text:`The potent beings which populate the spaces beyond sight have been revealed to you and nothing will ever be the same again. Let this bizarre world heavily influence the rest of your game. Take the Skill I See In-Between.`,effects:[{type:`gainSkillNamed`,skill:`I See In-Between`}]}]},{number:41,entries:[{text:`Your body is distant from human concerns. Lose a Memory slot. Erase your oldest extant name.`,effects:[{type:`loseMemorySlot`}]},{text:`A social convention or taboo from some long-forgotten part of your existence is hardwired into your being. What is it? How does this hinder your movement in society? Create a Mark.`,effects:[{type:`gainMark`}]},{text:`A ghost haunts you, though you do not know if it is real or a manifestation of madness. Bring back a long-dead Character as a spirit.`,effects:[{type:`returnGhost`}]}]},{number:42,entries:[{text:`What piece of contemporary technology can you not interact with due to your vampire nature? How did your first encounter with this technology almost get you destroyed? Check a Skill.`,effects:[{type:`checkSkill`}]},{text:`You make the acquaintance of a group of mortals who share an interest in some Resource you possess. Is it a club? Are these friends? Create three mortal Characters. Develop a Skill related to the Resource in question.`,effects:[{type:`createMortal`},{type:`createMortal`},{type:`createMortal`},{type:`gainSkill`}]},{text:`Decades pass. You remain ageless as your friends slowly curl and dry up; you must leave or be exposed as a monster. Stand outside in the darkness, watching them laugh as they tell stories of how they miss you.`,effects:[]}]},{number:43,entries:[{text:`You have archaic ways in spite of your focus on blending in. Create a Resource based on a checked Skill that reflects this.`,effects:[{type:`gainResource`}]},{text:`Swap around the proper nouns between two Memories. Do not create an Experience about this.`,effects:[{type:`swapProperNouns`}]},{text:`Examining a Resource you possess sparks a forgotten Memory. That Resource once belonged to another Character, but you had forgotten this. Gain tremendous insight into your history by recalling this Memory. Write this forgotten Experience into your Memory or directly into a Diary. To be clear, you are creating a new “forgotten” Experience, not bringing back a Memory you struck out.`,effects:[{type:`resourceToMemory`}]}]},{number:44,entries:[{text:`An immortal Character you’ve met returns to claim a debt. What is it? How have they changed? Do you pay willingly? If you have a Memory of this Character you lose two Resources, if not then lose three Resources and check a Skill.`,effects:[{type:`note`,text:`Branch: if you hold a Memory about this immortal, lose two Resources; otherwise lose three Resources and check a Skill.`},{type:`checkSkill`},{type:`loseResource3`},{type:`loseResource2`}]},{text:`What did they do to send you into the darkest despair? Erase your earliest Memory. You will never get it back. Gain a Skill.`,effects:[{type:`loseMemory`},{type:`gainSkill`}]},{text:`You develop a plan and carry it through with ruthless efficiency, bringing death and destruction to an immortal Character. You may either reclaim a Resource they took, or destroy them. Check a Skill.`,effects:[{type:`checkSkill`}]}]},{number:45,entries:[{text:`Your body is undergoing further corruption and change. When do you first notice these new changes? Create a Mark.`,effects:[{type:`gainMark`}]},{text:`Your body is becoming more effective as it becomes less human. Create a Skill based on one of your Marks.`,effects:[{type:`gainSkill`}]},{text:`You find companionship in a group of mortals who are in some way outside society. Do they know what you are? Would they care? Create two friendly mortal Characters, each related to one of your Marks.`,effects:[{type:`createMortal`},{type:`createMortal`}]}]},{number:46,entries:[{text:`You are exposed and flee to a far-off land. Convert any stationary Resources to a new Resource representing portable cash or treasure. What name do you travel under? What profession do you claim when you come to rest?`,effects:[{type:`convertFixedResources`}]},{text:`You flee again, this time to a far-off enclave or colony. How do you use colonial rule to your benefit? Choose one Skill: Occupier, Insurgent, Inconspicuous, or Gone Native along with an appropriate new name.`,effects:[{type:`gainSkill`}]},{text:`Revolution! As a suspicious outlander, you are imprisoned. Escape by checking two Skills or bribe your way free with two Resources. Spend an additional Resource to rescue any traveling companions.`,effects:[{type:`checkSkill2`},{type:`loseResource2`},{type:`loseResource`}]}]},{number:47,entries:[{text:`The world has evolved in ways you can’t comprehend, causing you to lose a good amount of wealth. What happened? Check a Skill. Create a Skill that will hopefully prevent this from happening again. Lose a Resource.`,effects:[{type:`gainSkill`},{type:`checkSkill`},{type:`loseResource`}]},{text:`You have helpless people put in your charge. Create a Skill that helps you exploit them. Derive it from a happy Memory.`,effects:[{type:`gainSkill`}]},{text:`You are impressed by the fighting spirit of one of your victims. What did they do? How do they remind you of your own earliest memories? Did they survive? Create a mortal Character.`,effects:[{type:`createMortal`}]}]},{number:48,entries:[{text:`You awaken covered in dust. Generations have passed. Your sleeping place has been sealed off. How do you escape? Lose a Resource. Strikeout all mortal Characters.`,effects:[{type:`loseResource`},{type:`killAllMortals`}]},{text:`A Mortal you thought dead is still alive, somehow. Remarkable! Bring back the most recently struck out mortal Character.`,effects:[{type:`reviveCharacter`}]},{text:`In your long dreaming, you discover a path to lands beyond the real, a fantastic place of enormous terrors and great beauty. You may abandon this Earth and go where none may follow; leave behind all Characters, Marks, and Resources except a Silver Sword and return to Prompt 10. Proceed forward from there, an unMarked vampire in a realm of dreams. If you land on this Prompt a second time, you awaken and can never return. If you do not travel to this dreamland you instead take the Resource A Handwritten Book of Fantastic Dreams.`,effects:[{type:`dreamWorld`},{type:`gainResourceNamed`,resource:`A Handwritten Book of Fantastic Dreams`}]}]},{number:49,entries:[{text:`What simple, practical skill proves invaluable in your strange existence? How did you learn it? Create a Skill.`,effects:[{type:`gainSkill`}]},{text:`How did you come to be in a place of common laborers? What previously checked Skill convinced them to accept you? What was that night of camaraderie like? Create a mortal Character. Check a Skill.`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`Your new friends become a source of food. Create a Resource that reflects this.`,effects:[{type:`gainResource`}]}]},{number:50,entries:[{text:`You are captured in a trap set for predatory mortals. What sort of criminal are you taken to be? How does this experience help you learn to better prey on mortals? Make a new Skill that sours the purity of a pleasant Memory.`,effects:[{type:`gainSkill`}]},{text:`You are almost uncovered and must dramatically shift your hunting patterns. Become a member of the lowest classes and lose a Resource. If you already are of the lowest classes instead become a member of the highest and check a Skill.`,effects:[{type:`checkSkill`},{type:`loseResource`}]},{text:`You take up with predatory mortals. Create a repugnant mortal Character who becomes your associate. Even you fear these people. Why?`,effects:[{type:`createMortal`}]}]},{number:51,entries:[{text:`When you hunger too much you become a hunting creature bereft of intellect. Lose a random Experience from a Memory somewhere in the middle of your Memory list.`,effects:[{type:`loseMemoryRandom`}]},{text:`You find companionship in something that is not human. Is it an animal, or maybe something inanimate? How do you interact with it? How did you find it, or did it find you? Create either a Character or Resource to represent this companion.`,effects:[{type:`createCharacter`},{type:`gainResource`}]},{text:`All things end, but apparently not this. A mortal Character for whom you hold great affection is un-aging. Is it magic? Some form of infection? They still count as a mortal Character, but they will never die of old age.`,effects:[{type:`note`,text:`This mortal Character never dies of old age (they still count as a mortal Character).`}]}]},{number:52,entries:[{text:`The beauty of the dawn calls you. Create an additional Memory slot dedicated to beauty, nature, or peace.`,effects:[{type:`gainMemorySlot`}]},{text:`You stay long enough to hear the end of a morning bird’s song. You are burned by the Sun. Create a Mark.`,effects:[{type:`gainMark`}]},{text:`Stretch out your arms, feel the warmth. The light pushes through your eyelids and you are not consumed in fire. Sunlight (or some other environmental condition) no longer harms you. Create a Skill about freedom.`,effects:[{type:`gainSkill`}]}]},{number:53,entries:[{text:`A mortal Character you trusted, or one of their descendants, leads a hunting party. What shared secrets are being used against you? Check a Skill.`,effects:[{type:`checkSkill`}]},{text:`You have the troublemaking Character at your mercy. Record an Experience of forgiveness.`,effects:[]},{text:`They betray you again and escape. Lose a Resource or gain a disfiguring Mark.`,effects:[{type:`loseResource`},{type:`gainMark`}]}]},{number:54,entries:[{text:`Your strange accent and old ways always reveal you as an outsider, mocked, and cheated at best or hated at worst. Smother these useless traits by converting an old Memory to a new Skill for blending in.`,effects:[{type:`memoryToSkill`}]},{text:`Your old memories are changing to reflect the attitudes you need in the present. Change a Memory to incorporate anachronistic, contemporary aspects. Do not create a new Experience.`,effects:[{type:`editMemory`}]},{text:`Discard a Resource that is more than a hundred years old.`,effects:[{type:`destroyResource`}]}]},{number:55,entries:[{text:`Timeless introspection becomes manifest in creative acts. Choose a creative Skill based on a lost Memory.`,effects:[{type:`gainSkill`}]},{text:`You dedicate yourself to an art. Lose a Resource but gain back one lost Memory.`,effects:[{type:`loseResource`},{type:`restoreMemory`}]},{text:`You achieve fame for your art but must remain in shadow. Destroy a Resource in frustration. Gain a Skill.`,effects:[{type:`destroyResource`},{type:`gainSkill`}]}]},{number:56,entries:[{text:`You begin a fantastic construction that puzzles the mortals around you. Give just a hint as to its purpose. Lose a Resource and gain the Skill Visionary.`,effects:[{type:`gainSkillNamed`,skill:`Visionary`},{type:`loseResource`}]},{text:`Mortals try to prevent you from realizing your vision. Check a Skill to persevere. What awful crime did you commit to protect your construction?`,effects:[{type:`checkSkill`}]},{text:`You’ve finished your construction. Why did you make this? Does it have a function? Does it change the world?`,effects:[]}]},{number:57,entries:[{text:`Your knowledge of old things becomes a strength. Based on a checked Skill, what knowledge do you share with contemporary mortals? Check a Skill. Create a Resource.`,effects:[{type:`checkSkill`},{type:`gainResource`}]},{text:`What humans seek you out for your knowledge? What do you give them? What do you take? Create a mortal Character who is smarter and more capable than you. Gain a Resource.`,effects:[{type:`createMortal`},{type:`gainResource`}]},{text:`You are brought to the site of one of your oldest crimes. Who brought you here? Why? Do you even remember? Check a Skill. If you have no Memory of this crime, you will be reminded.`,effects:[{type:`checkSkill`}]}]},{number:58,entries:[{text:`Society has changed. How has travel become easier for you? Recover any stationary Resources for which you still have a Memory, they are re-added to your Resource list.`,effects:[{type:`retrieveResource`}]},{text:`What memories are unearthed by wandering these old places? Get back a lost Memory related to the stationary Resource, or gain a new treasure Resource which you’d concealed here.`,effects:[{type:`restoreMemory`},{type:`gainResource`}]},{text:`What grisly trap was set for you here? Lose a Resource, gain a Mark.`,effects:[{type:`loseResource`},{type:`gainMark`}]}]},{number:59,entries:[{text:`A mortal discovers the journals of a long-dead Character, or your own lost Diary, and approaches you. What do they seek? Gain a Skill or a Resource. Create a mortal Character.`,effects:[{type:`gainSkill`},{type:`gainResource`},{type:`createMortal`}]},{text:`The mortal harms, shames, or exposes you. Check a Skill as you fruitlessly pursue them. Lose a Resource.`,effects:[{type:`checkSkill`},{type:`loseResource`}]},{text:`The mortal’s lust for forbidden knowledge results in the release of a supernatural horror upon the world. Is this a gigantic monstrosity that will eventually destroy the world or a personal horror set upon destroying you in particular? Create an immortal Character or Characters.`,effects:[{type:`createImmortal`}]}]},{number:60,entries:[{text:`Check a Skill to avoid arrest as a criminal. What happened? Who was arrested in your place? Create a mortal Character if necessary.`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`Create an innocent mortal Character. They were executed for a crime you committed. What hobby were you tinkering with the night they were put to death? Take the Skill It’s None of my Concern.`,effects:[{type:`gainSkillNamed`,skill:`It’s None of my Concern`},{type:`createMortal`},{type:`killCharacter`}]},{text:`An entire class of people are blamed for crimes you committed. Take the Skill Always Have a Scapegoat. Who suffers in your place? Create a friendly Character who represents these people and is ignorant of your complicity. Create another Character who is in a position of authority; they know these people are innocent but do not care.`,effects:[{type:`gainSkillNamed`,skill:`Always Have a Scapegoat`},{type:`createCharacter`},{type:`createCharacter`}]}]},{number:61,entries:[{text:`Someone reminds you of a beloved Character long dead. Check a Skill to curry their acquaintance. Create a mortal Character.`,effects:[{type:`checkSkill`},{type:`createMortal`}]},{text:`You frequently confuse living mortals with a dead Character. Take the Mark I See [dead Character] Everywhere.`,effects:[{type:`gainMark`}]},{text:`Your body is ancient. A Mark becomes disabling. You must seek mortal assistance. Create a mortal Character who is especially capable of helping you.`,effects:[{type:`crippleMark`},{type:`createMortal`}]}]},{number:62,entries:[{text:`You realize that some ancient taboo or limitation you long believed in no longer applies. What circumstances prompted this discovery? How does this make your existence more satisfying? Change one checked or unchecked Skill in a way that’s r ainTwoResources`}]}]},{number:65,entries:[{text:`A possession turns out to have financial value as an antique. Trade your oldest Resource for two contemporary Resources.`,effects:[{type:`note`,text:`The trade brings in two contemporary Resources: strike out your oldest Resource and create two new ones.`},{type:`swapResource`}]},{text:`You experience intense regret over a Resource you have given away or lost. Do anything to get it back. Lose two Resources or check two Skills and get back one lost Resource.`,effects:[{type:`checkSkill2`},{type:`loseResource2`},{type:`retrieveResource`}]},{text:`Objects are transient. All is nothing. Throw away your oldest or most precious Resource.`,effects:[{type:`destroyResource`}]}]},{number:66,entries:[{text:`Your knowledge is outmoded. Lose an unchecked Skill which is now useless.`,effects:[{type:`loseUncheckedSkill`}]},{text:`Your concept of value is outdated. Lose a Resource.`,effects:[{type:`loseResource`}]},{text:`You are so ancient you no longer look like the people of today. Create a Mark that reflects this. How do you come to realize that your very body no longer fits in?`,effects:[{type:`gainMark`}]}]},{number:67,entries:[{text:`Language itself leaves you behind. People discuss concepts you cannot grasp using tools you cannot understand. How is this problem dramatically made manifest? Create a Character who will teach you a Skill to help you offset this disadvantage.`,effects:[{type:`createCharacter`},{type:`gainSkill`}]},{text:`New forms of communication offer new ways to hunt. Modify an old Memory to include an anachronistic use of this sort of contemporary communication technology. Check a Skill, create a Skill.`,effects:[{type:`editMemory`},{type:`checkSkill`},{type:`gainSkill`}]},{text:`Language has grown into something outside your ken. You can invoke phonemic patterns to which mortals will react in certain ways, but you can no longer share actual thoughts or feelings or abstract ideas. Create a Skill that expresses this.`,effects:[{type:`gainSkill`}]}]},{number:68,entries:[{text:`An antiquity has surfaced which is directly tied to your mortal life. Check a Skill or lose a Resource and gain the antiquity as a Resource, then regain one of your earliest Memories. Record an Experience about acquiring the antique.`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`gainResource`},{type:`restoreMemory`}]},{text:`Because of this antiquity, someone has begun to hunt you. Create a mortal Character. How do they almost expose you? Check a Skill or lose a Resource.`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`createMortal`}]},{text:`The mortal Character hunter corners you. You become the embodiment of one of your Checked Skills to defeat them. Take a Mark.`,effects:[{type:`gainMark`}]}]},{number:69,entries:[{text:`You bond with an ancient enemy Character over your shared past, finding in it something more comprehensible than this modern world. Check a Skill. You become friends. Share a Resource and gain a Resource that is shared with you.`,effects:[{type:`checkSkill`},{type:`loseResource`},{type:`gainResource`}]},{text:`You and your friend retire to a hidden place. There you share real pleasure for the first time in centuries. Create a Skill about love and safety.`,effects:[{type:`gainSkill`}]},{text:`You and your friend concoct a fantastic plan and bring it to fruition. Check a Skill. What is it? Do you conquer the world? Raise the dead? You may end the game now, if appropriate.`,effects:[{type:`checkSkill`}]}]},{number:70,entries:[{text:`Mortals are cruel and work in ways outside your understanding. How were you mocked or victimized? Why was your response ineffectual and costly? Check a Skill.`,effects:[{type:`checkSkill`}]},{text:`An important Memory is tainted by your exposure to the psychological tricks of contemporary society. Modify a Memory to make it less special. Lose an unchecked anti-social Skill.`,effects:[{type:`editMemory`},{type:`loseUncheckedSkill`}]
