# 推送到 main 分支时自动构建并部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tyov-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tyov-web

      - name: Lint
        run: npm run lint
        working-directory: tyov-web

      - name: Unit tests (engine + store)
        run: npm test
        working-directory: tyov-web

      - name: Type-check & build (with repo subpath base)
        # GitHub Pages 子路径部署：--base=/仓库名/ 保证资源路径正确
        # 可选统计：在仓库 Settings → Variables 配置后才会注入 Umami 脚本
        env:
          VITE_UMAMI_SRC: ${{ vars.VITE_UMAMI_SRC }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: tyov-web

      - name: Verify analytics injection
        # 配了 ID 却没注入成功 → 直接失败，避免"以为接了其实没接"
        if: vars.VITE_UMAMI_WEBSITE_ID != ''
        run: grep -q "data-website-id" dist/index.html
        working-directory: tyov-web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tyov-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4