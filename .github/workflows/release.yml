# 推送 v* 标签时构建并发布两个发行产物：单文件离线版 + 在线版 dist
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tyov-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tyov-web

      - name: Lint & unit tests
        run: |
          npm run lint
          npm test
        working-directory: tyov-web

      - name: Build (PWA + single file)
        env:
          VITE_UMAMI_SRC: ${{ vars.VITE_UMAMI_SRC }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
        run: npm run build:all
        working-directory: tyov-web

      - name: Package artifacts
        # 发行物用 ASCII 文件名：GitHub 会把非 ASCII 的资产名压成 "-.html"
        run: |
          cp tyov-web/dist-singlefile/index.html thousand-year-old-vampire.html
          cd tyov-web && zip -r ../tyov-web-dist.zip dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            thousand-year-old-vampire.html
            tyov-web-dist.zip
          generate_release_notes: true
